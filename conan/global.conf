# Appended to $CONAN_HOME/global.conf by the build-env Dockerfiles.
# When a recipe's source URL fails, Conan downloads <base><sha256> from
# nesso-vendor and checks the sha256 pinned in the recipe. nesso-vendor holds
# byte-identical copies of sources that vanished upstream (onnxruntime 1.18.1:
# microsoft/onnxruntime returns 404 since 18 Nov 2026), with the script that
# rebuilds each one from Software Heritage.
core.sources:download_urls=["origin", "https://github.com/lorenzocaprari/nesso-vendor/releases/download/conan-sources/"]
