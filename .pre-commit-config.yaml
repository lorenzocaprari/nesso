repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.3
    hooks:
      - id: clang-format
        files: \.(c|cc|cxx|cpp|h|hh|hpp|hxx)$
        args:
          - '-style={BasedOnStyle: LLVM, IndentWidth: 4, ContinuationIndentWidth: 4, BreakBeforeBraces: Allman, IndentCaseLabels: false, IndentCaseBlocks: false, ColumnLimit: 120}'
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
