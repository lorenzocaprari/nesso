# Hosts the report the README badge reads. The coverage job still enforces
# the floors in scripts/code-coverage. These statuses stay informational so a
# Codecov check cannot disagree with that gate.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

# lcov counts a line with an untaken branch as a hit. Codecov scores that
# partial as a miss unless this is set, which leaves the badge far below the
# line floor in scripts/code-coverage.
parsers:
  lcov:
    partials_as_hits: true

# The uploaded trace includes test/. gtest macros leave most of those lines
# partial, so ignore them and let the badge reflect src/ only.
ignore:
  - "test/**"
