version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /test/functional
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # packaging/Dockerfile.runtime, .devcontainer/Dockerfile, and
  # .clusterfuzzlite/Dockerfile. FROM ${BUILD_IMAGE} in the runtime image is
  # the CI-published nesso-build-env tag, not a pinnable upstream image.
  - package-ecosystem: docker
    directories:
      - /packaging
      - /.devcontainer
      - /.clusterfuzzlite
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    # Rocky 9 is the EL9 baseline. Stay on major 9; digest updates still apply.
    ignore:
      - dependency-name: "rockylinux"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: pip
    directories:
      - /.devcontainer
    schedule:
      interval: weekly
    groups:
      pip:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    # Conan 2.34 requires python-dateutil<3 on Python < 3.11 and does not
    # import it on newer Pythons. 3.x and 4.x also depend on tzdata, which a
    # hash-only bump does not pin, so pip --require-hashes fails the image build.
    ignore:
      - dependency-name: "python-dateutil"
        update-types:
          - "version-update:semver-major"
