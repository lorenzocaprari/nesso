version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /test/functional
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # packaging/Dockerfile.runtime, .devcontainer/Dockerfile, and
  # .clusterfuzzlite/Dockerfile. FROM ${BUILD_IMAGE} in the runtime image is
  # the CI-published nesso-build-env tag, not a pinnable upstream image.
  - package-ecosystem: docker
    directories:
      - /packaging
      - /.devcontainer
      - /.clusterfuzzlite
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directories:
      - /.devcontainer
    schedule:
      interval: weekly
    groups:
      pip:
        patterns:
          - "*"
    cooldown:
      default-days: 7
