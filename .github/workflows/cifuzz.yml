name: ClusterFuzzLite

on:
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly batch. Offset from Scorecard (Sat 01:30) and CodeQL (Mon 04:17).
    - cron: "45 6 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  fuzzing:
    name: ClusterFuzzLite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Build fuzzers
        id: build
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@4af4c649704a468da115f46f70aac0ba0ccbef42 # 2026-10-08
        with:
          oss-fuzz-project-name: nesso
          language: c++
          sanitizer: address
          # Run both targets on every pull request. Affected-target pruning needs
          # coverage metadata this header-only build does not emit.
          keep-unaffected-fuzz-targets: true

      - name: Run fuzzers
        uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@4af4c649704a468da115f46f70aac0ba0ccbef42 # 2026-10-08
        with:
          oss-fuzz-project-name: nesso
          language: c++
          sanitizer: address
          # Pull requests get a short code-change run. The weekly schedule batch-fuzzes longer.
          fuzz-seconds: ${{ github.event_name == 'schedule' && '600' || '180' }}
          mode: ${{ github.event_name == 'schedule' && 'batch' || 'code-change' }}

      - name: Upload crash artifacts
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clusterfuzzlite-crashes
          path: ./out/artifacts
          if-no-files-found: ignore
