name: Toolchain preview

# Not a Pipeline job and not in the CI gate. ci.yml does not need these
# jobs. A red run here does not fail CI gate.
#
# GCC 16.2.1 is gcc-toolset-16-gcc-16.2.1-1.4.el9_9 (g++ -dumpfullversion
# is 16.2.1; settings.yml compiler.version is 16). Clang is the official
# apt.llvm.org resolute package, and the image fails unless clang++-23
# reports 23.1.6. Neither Dockerfile is a scripts/ci/build-env-hash input.
# Images go to ghcr.io/<owner>/nesso-build-env-preview, not nesso-build-env
# or nesso-build-env-el9.
#
# onnxruntime 1.18.1 built from the locked recipe during a local image
# build (compiler.version=16, cppstd=26, package
# 395aa3709cbc36637573a4b34a65e4006d56d7a9). The recipe passes
# --compile-no-warning-as-error. GCC 16.2.1 warned (deprecated spacing on
# the float16.h literal operators, deprecated std::is_trivial in protobuf
# 3.21 headers) and still produced the package. No recipe patch was added.
# Nesso still gets -Werror from CONAN_WERROR_ARGS. The upstream tag tarball
# 404s; Conan used nesso-vendor through conan/global.conf.
#
# Release lanes run ctest -L unit. ASan/UBSan lanes do too. TSan lanes run
# ctest -L tsan only. Fuzz lanes replay seeds with
# scripts/toolchain-preview-fuzz-smoke (no AFL++; afl-clang-lto++ is LLVM 21
# and the EL9 image has no AFL++).
on:
  schedule:
    # 07:17 UTC, after the 05:47 real-log soak and the 06:47 retrieval eval.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      force_image_rebuild:
        description: Rebuild the preview images even if the tag already exists
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/toolchain-preview.yml
      - .devcontainer/Dockerfile.gcc16
      - .devcontainer/Dockerfile.clang23
      - conan/profiles/gcc-16
      - conan/profiles/gcc-16-asan
      - conan/profiles/gcc-16-tsan
      - conan/profiles/gcc-16-fuzz
      - conan/profiles/clang-23
      - conan/profiles/clang-23-asan
      - conan/profiles/clang-23-tsan
      - conan/profiles/clang-23-fuzz
      - scripts/toolchain-preview-fuzz-smoke

concurrency:
  group: toolchain-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  CONAN_HOME: /opt/conan2
  CONAN_WERROR_ARGS: "-c user.nesso:werror=True"

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Require schedule on main, a manual dispatch, or a pull request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "toolchain-preview: schedule refuses ${GITHUB_REF}" >&2
              exit 1
            fi
            exit 0
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${EVENT_NAME}" == "pull_request" ]]; then
            exit 0
          fi
          echo "toolchain-preview: refusing event ${EVENT_NAME}" >&2
          exit 1

  prepare-gcc16:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.select.outputs.image }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image reference
        id: select
        shell: bash
        env:
          REGISTRY_NAME: ${{ env.REGISTRY }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_image_rebuild == true }}
        run: |
          set -euo pipefail
          owner_lc="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          preview_hash="$(
            sha256sum \
              .devcontainer/Dockerfile.gcc16 \
              .devcontainer/requirements.txt \
              conan/global.conf \
              conan/profiles/gcc-16 \
              conan.lock \
              conanfile.py \
              | sha256sum | awk '{print substr($1, 1, 16)}'
          )"
          reg="${REGISTRY_NAME}/${owner_lc}/nesso-build-env-preview"
          {
            echo "image=${reg}:gcc16-${preview_hash}"
            echo "cache_ref=${reg}:gcc16-buildcache"
            echo "force=${FORCE_REBUILD}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check preview image
        id: image
        env:
          IMAGE: ${{ steps.select.outputs.image }}
          FORCE_REBUILD: ${{ steps.select.outputs.force }}
        run: |
          set -euo pipefail
          if [[ "${FORCE_REBUILD}" != "true" ]] && docker buildx imagetools inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "rebuild=false" >> "${GITHUB_OUTPUT}"
          else
            echo "rebuild=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Free disk space
        if: steps.image.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          floor_kb=$((40 * 1024 * 1024))
          echo "available_kib=${avail_kb} floor_kib=${floor_kb}"
          if [ "${avail_kb}" -ge "${floor_kb}" ]; then
            echo "free space already above 40GiB; not deleting"
            exit 0
          fi
          echo "free space below 40GiB; removing android, dotnet, and ghc"
          pids=()
          sudo rm -rf /usr/local/lib/android &
          pids+=("$!")
          sudo rm -rf /usr/share/dotnet &
          pids+=("$!")
          sudo rm -rf /opt/ghc &
          pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            wait "${pid}" || status=1
          done
          if [ "${status}" -ne 0 ]; then
            echo "error: removing a preinstalled tree failed" >&2
            exit 1
          fi
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "available_kib_after=${avail_kb}"
          if [ "${avail_kb}" -lt "${floor_kb}" ]; then
            echo "error: still under 40GiB after removing preinstalled trees" >&2
            exit 1
          fi

      - name: Build and push GCC 16 preview image
        if: steps.image.outputs.rebuild == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile.gcc16
          push: true
          tags: ${{ steps.select.outputs.image }}
          cache-from: type=registry,ref=${{ steps.select.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.select.outputs.cache_ref }},mode=max

      - name: Verify image architecture
        env:
          IMAGE: ${{ steps.select.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}" | tee /tmp/image-inspect.txt
          grep -Eiq 'amd64|x86_64' /tmp/image-inspect.txt

  prepare-clang23:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.select.outputs.image }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image reference
        id: select
        shell: bash
        env:
          REGISTRY_NAME: ${{ env.REGISTRY }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_image_rebuild == true }}
        run: |
          set -euo pipefail
          owner_lc="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          deps_hash="$(./scripts/ci/build-env-hash amd64)"
          preview_hash="$(
            {
              printf '%s\n' "${deps_hash}"
              sha256sum .devcontainer/Dockerfile.clang23
            } | sha256sum | awk '{print substr($1, 1, 16)}'
          )"
          reg="${REGISTRY_NAME}/${owner_lc}/nesso-build-env-preview"
          {
            echo "base=${REGISTRY_NAME}/${owner_lc}/nesso-build-env:deps-${deps_hash}"
            echo "image=${reg}:clang23-${preview_hash}"
            echo "cache_ref=${reg}:clang23-buildcache"
            echo "force=${FORCE_REBUILD}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check preview image
        id: image
        env:
          IMAGE: ${{ steps.select.outputs.image }}
          FORCE_REBUILD: ${{ steps.select.outputs.force }}
        run: |
          set -euo pipefail
          if [[ "${FORCE_REBUILD}" != "true" ]] && docker buildx imagetools inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "rebuild=false" >> "${GITHUB_OUTPUT}"
          else
            echo "rebuild=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push Clang 23 preview image
        if: steps.image.outputs.rebuild == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile.clang23
          push: true
          tags: ${{ steps.select.outputs.image }}
          build-args: |
            BASE_IMAGE=${{ steps.select.outputs.base }}
          cache-from: type=registry,ref=${{ steps.select.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.select.outputs.cache_ref }},mode=max

      - name: Verify image architecture
        env:
          IMAGE: ${{ steps.select.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}" | tee /tmp/image-inspect.txt
          grep -Eiq 'amd64|x86_64' /tmp/image-inspect.txt

  gcc:
    name: ${{ matrix.id }}
    needs: [guard, prepare-gcc16]
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.prepare-gcc16.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gcc-16-release
            profile: conan/profiles/gcc-16
            config: Release
            suite: unit
            ctest_label: unit
            ctest_exclude: "^package_deb_test$"
            compiler_needle: /opt/rh/gcc-toolset-16/root/usr/bin/g++
            sanitize_needle: ""
            ccache: gcc-16-Release
            container_options: "--user root"
            ld_library_path: ""
          - id: gcc-16-asan
            profile: conan/profiles/gcc-16-asan
            config: RelWithDebInfo
            suite: unit
            ctest_label: unit
            ctest_exclude: "^package_deb_test$"
            compiler_needle: /opt/rh/gcc-toolset-16/root/usr/bin/g++
            sanitize_needle: "-fsanitize=address,undefined"
            ccache: gcc-16-asan
            container_options: "--user root"
            ld_library_path: /opt/rh/gcc-toolset-16/root/usr/lib64
          - id: gcc-16-tsan
            profile: conan/profiles/gcc-16-tsan
            config: Release
            suite: tsan
            ctest_label: tsan
            ctest_exclude: ""
            compiler_needle: /opt/rh/gcc-toolset-16/root/usr/bin/g++
            sanitize_needle: "-fsanitize=thread"
            ccache: gcc-16-tsan
            container_options: "--user root --security-opt seccomp=unconfined"
            ld_library_path: /opt/rh/gcc-toolset-16/root/usr/lib64
          - id: gcc-16-fuzz
            profile: conan/profiles/gcc-16-fuzz
            config: Release
            suite: fuzz
            ctest_label: ""
            ctest_exclude: ""
            compiler_needle: /opt/rh/gcc-toolset-16/root/usr/bin/g++
            sanitize_needle: "-fsanitize=address,undefined"
            ccache: gcc-16-fuzz
            container_options: "--user root"
            ld_library_path: /opt/rh/gcc-toolset-16/root/usr/lib64
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CCACHE_EXTRAFILES: ${{ github.workspace }}/conan/sanitizer/libstdcxx-format.ignorelist
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:abort_on_error=1:second_deadlock_stack=1
      PREVIEW_LD_LIBRARY_PATH: ${{ matrix.ld_library_path }}
    container:
      image: ${{ needs.prepare-gcc16.outputs.image }} # zizmor: ignore[unpinned-images] preview tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: ${{ matrix.container_options }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export sanitizer library path
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${PREVIEW_LD_LIBRARY_PATH}" ]]; then
            printf 'LD_LIBRARY_PATH=%s\n' "${PREVIEW_LD_LIBRARY_PATH}" >> "${GITHUB_ENV}"
          fi

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-${{ matrix.ccache }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-${{ matrix.ccache }}-

      - name: Zero ccache statistics
        shell: bash
        run: ccache --zero-stats

      - name: Install Dependencies (Conan)
        if: matrix.suite != 'fuzz'
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          if [[ ! -f "${CONAN_HOME}/profiles/default" ]]; then
            conan profile detect --force
          fi
          conan install . -pr:h "${PROFILE}" -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Build
        id: build
        if: matrix.suite != 'fuzz'
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          NESSO_REQUIRE_MODEL: "1"
        run: |
          set -euo pipefail
          conan build . -pr:h "${PROFILE}" -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Require the preview compiler
        id: require
        if: matrix.suite != 'fuzz'
        shell: bash
        env:
          BUILD_CONFIG: ${{ matrix.config }}
          COMPILER_NEEDLE: ${{ matrix.compiler_needle }}
          SANITIZE_NEEDLE: ${{ matrix.sanitize_needle }}
        run: |
          set -euo pipefail
          commands="build/${BUILD_CONFIG}/compile_commands.json"
          test -f "${commands}"
          grep -q -- "${COMPILER_NEEDLE}" "${commands}"
          if [[ -n "${SANITIZE_NEEDLE}" ]]; then
            grep -q -- "${SANITIZE_NEEDLE}" "${commands}"
          fi
          grep -Eq -- '(^|[[:space:]])-Werror([[:space:]]|$)' "${commands}"
          if grep -Eq -- '(^|[[:space:]])-stdlib=libc\+\+([[:space:]]|$)' "${commands}"; then
            echo "error: compile commands select libc++" >&2
            exit 1
          fi
          test -x "build/${BUILD_CONFIG}/src/nesso"
          ldd "build/${BUILD_CONFIG}/src/nesso" > /tmp/nesso-ldd.txt
          cat /tmp/nesso-ldd.txt
          grep -q 'libstdc++' /tmp/nesso-ldd.txt
          if grep -q 'libc++' /tmp/nesso-ldd.txt; then
            echo "error: nesso is linked to libc++" >&2
            exit 1
          fi

      - name: Restore MiniLM models
        id: models
        if: matrix.suite == 'unit' && steps.require.outcome == 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: matrix.suite == 'unit' && steps.require.outcome == 'success' && steps.models.outputs.cache-hit != 'true'
        shell: bash
        run: ./scripts/fetch-model models

      - name: Run tests
        id: tests
        if: matrix.suite != 'fuzz' && steps.require.outcome == 'success'
        shell: bash
        env:
          BUILD_CONFIG: ${{ matrix.config }}
          CTEST_LABEL: ${{ matrix.ctest_label }}
          CTEST_EXCLUDE: ${{ matrix.ctest_exclude }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/build/junit"
          extra=()
          if [[ -n "${CTEST_EXCLUDE}" ]]; then
            extra+=(-E "${CTEST_EXCLUDE}")
          fi
          ctest --test-dir "build/${BUILD_CONFIG}" --output-on-failure -j "$(nproc)" -L "${CTEST_LABEL}" -V \
            "${extra[@]}" \
            --output-junit "${GITHUB_WORKSPACE}/build/junit/${SUITE}.xml"

      - name: Fuzz smoke
        id: fuzz
        if: matrix.suite == 'fuzz'
        shell: bash
        env:
          NESSO_WERROR: "1"
          NESSO_PREVIEW_PROFILE: ${{ matrix.profile }}
          NESSO_PREVIEW_COMPILER_NEEDLE: ${{ matrix.compiler_needle }}
          NESSO_PREVIEW_SANITIZE_NEEDLE: ${{ matrix.sanitize_needle }}
        run: |
          set -euo pipefail
          chmod +x scripts/toolchain-preview-fuzz-smoke
          ./scripts/toolchain-preview-fuzz-smoke

      - name: Summarize
        if: always() && !cancelled()
        shell: bash
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
          SUITE: ${{ matrix.suite }}
          LANE: ${{ matrix.id }}
        run: |
          set -euo pipefail
          {
            echo "### ${LANE}"
            echo '| step | result |'
            echo '| --- | --- |'
            if [[ "${SUITE}" == "fuzz" ]]; then
              echo "| fuzz | ${{ steps.fuzz.outcome }} |"
            else
              echo "| ${SUITE} | ${{ steps.tests.outcome }} |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${SUITE}" != "fuzz" && -f "${GITHUB_WORKSPACE}/build/junit/${SUITE}.xml" ]]; then
            go build -C scripts/ci -o /tmp/nesso-ci .
            /tmp/nesso-ci junit-summary \
              --summary "${GITHUB_STEP_SUMMARY}" \
              "${SUITE}=${GITHUB_WORKSPACE}/build/junit/${SUITE}.xml"
          fi

      - name: Upload JUnit reports
        if: always() && !cancelled() && matrix.suite != 'fuzz'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.id }}
          path: build/junit
          if-no-files-found: warn
          retention-days: 14

      - name: ccache statistics
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          if grep -q 'Cacheable calls:' /tmp/ccache-stats.txt; then
            cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
            uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          else
            cacheable=$(awk '$1 == "Hits:" {print $4; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
            uncacheable=$(awk '$1 == "Uncacheable:" {getline; if ($1 == "Calls:") print $2; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          fi
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo '### ccache'
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-${{ matrix.ccache }}-${{ github.sha }}

  clang:
    name: ${{ matrix.id }}
    needs: [guard, prepare-clang23]
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.prepare-clang23.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: clang-23-release
            profile: conan/profiles/clang-23
            config: Release
            suite: unit
            ctest_label: unit
            ctest_exclude: ""
            compiler_needle: clang++-23
            sanitize_needle: ""
            ccache: clang-23-Release
            container_options: "--user root"
            ld_library_path: ""
          - id: clang-23-asan
            profile: conan/profiles/clang-23-asan
            config: Debug
            suite: unit
            ctest_label: unit
            ctest_exclude: ""
            compiler_needle: clang++-23
            sanitize_needle: "-fsanitize=address,undefined"
            ccache: clang-23-asan
            container_options: "--user root"
            ld_library_path: ""
          - id: clang-23-tsan
            profile: conan/profiles/clang-23-tsan
            config: Release
            suite: tsan
            ctest_label: tsan
            ctest_exclude: ""
            compiler_needle: clang++-23
            sanitize_needle: "-fsanitize=thread"
            ccache: clang-23-tsan
            container_options: "--user root --security-opt seccomp=unconfined"
            ld_library_path: ""
          - id: clang-23-fuzz
            profile: conan/profiles/clang-23-fuzz
            config: Release
            suite: fuzz
            ctest_label: ""
            ctest_exclude: ""
            compiler_needle: clang++-23
            sanitize_needle: "-fsanitize=address,undefined"
            ccache: clang-23-fuzz
            container_options: "--user root"
            ld_library_path: ""
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CCACHE_EXTRAFILES: ${{ github.workspace }}/conan/sanitizer/libstdcxx-format.ignorelist
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:abort_on_error=1:second_deadlock_stack=1
      PREVIEW_LD_LIBRARY_PATH: ${{ matrix.ld_library_path }}
    container:
      image: ${{ needs.prepare-clang23.outputs.image }} # zizmor: ignore[unpinned-images] preview tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: ${{ matrix.container_options }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export sanitizer library path
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${PREVIEW_LD_LIBRARY_PATH}" ]]; then
            printf 'LD_LIBRARY_PATH=%s\n' "${PREVIEW_LD_LIBRARY_PATH}" >> "${GITHUB_ENV}"
          fi

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-${{ matrix.ccache }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-${{ matrix.ccache }}-

      - name: Zero ccache statistics
        shell: bash
        run: ccache --zero-stats

      - name: Install Dependencies (Conan)
        if: matrix.suite != 'fuzz'
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          if [[ ! -f "${CONAN_HOME}/profiles/default" ]]; then
            conan profile detect --force
          fi
          conan install . -pr:h "${PROFILE}" -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Build
        id: build
        if: matrix.suite != 'fuzz'
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          NESSO_REQUIRE_MODEL: "1"
        run: |
          set -euo pipefail
          conan build . -pr:h "${PROFILE}" -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Require the preview compiler
        id: require
        if: matrix.suite != 'fuzz'
        shell: bash
        env:
          BUILD_CONFIG: ${{ matrix.config }}
          COMPILER_NEEDLE: ${{ matrix.compiler_needle }}
          SANITIZE_NEEDLE: ${{ matrix.sanitize_needle }}
        run: |
          set -euo pipefail
          commands="build/${BUILD_CONFIG}/compile_commands.json"
          test -f "${commands}"
          grep -q -- "${COMPILER_NEEDLE}" "${commands}"
          if [[ -n "${SANITIZE_NEEDLE}" ]]; then
            grep -q -- "${SANITIZE_NEEDLE}" "${commands}"
          fi
          grep -Eq -- '(^|[[:space:]])-Werror([[:space:]]|$)' "${commands}"
          if grep -Eq -- '(^|[[:space:]])-stdlib=libc\+\+([[:space:]]|$)' "${commands}"; then
            echo "error: compile commands select libc++" >&2
            exit 1
          fi
          test -x "build/${BUILD_CONFIG}/src/nesso"
          ldd "build/${BUILD_CONFIG}/src/nesso" > /tmp/nesso-ldd.txt
          cat /tmp/nesso-ldd.txt
          grep -q 'libstdc++' /tmp/nesso-ldd.txt
          if grep -q 'libc++' /tmp/nesso-ldd.txt; then
            echo "error: nesso is linked to libc++" >&2
            exit 1
          fi

      - name: Restore MiniLM models
        id: models
        if: matrix.suite == 'unit' && steps.require.outcome == 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: matrix.suite == 'unit' && steps.require.outcome == 'success' && steps.models.outputs.cache-hit != 'true'
        shell: bash
        run: ./scripts/fetch-model models

      - name: Run tests
        id: tests
        if: matrix.suite != 'fuzz' && steps.require.outcome == 'success'
        shell: bash
        env:
          BUILD_CONFIG: ${{ matrix.config }}
          CTEST_LABEL: ${{ matrix.ctest_label }}
          CTEST_EXCLUDE: ${{ matrix.ctest_exclude }}
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/build/junit"
          extra=()
          if [[ -n "${CTEST_EXCLUDE}" ]]; then
            extra+=(-E "${CTEST_EXCLUDE}")
          fi
          ctest --test-dir "build/${BUILD_CONFIG}" --output-on-failure -j "$(nproc)" -L "${CTEST_LABEL}" -V \
            "${extra[@]}" \
            --output-junit "${GITHUB_WORKSPACE}/build/junit/${SUITE}.xml"

      - name: Fuzz smoke
        id: fuzz
        if: matrix.suite == 'fuzz'
        shell: bash
        env:
          NESSO_WERROR: "1"
          NESSO_PREVIEW_PROFILE: ${{ matrix.profile }}
          NESSO_PREVIEW_COMPILER_NEEDLE: ${{ matrix.compiler_needle }}
          NESSO_PREVIEW_SANITIZE_NEEDLE: ${{ matrix.sanitize_needle }}
        run: |
          set -euo pipefail
          chmod +x scripts/toolchain-preview-fuzz-smoke
          ./scripts/toolchain-preview-fuzz-smoke

      - name: Summarize
        if: always() && !cancelled()
        shell: bash
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
          SUITE: ${{ matrix.suite }}
          LANE: ${{ matrix.id }}
        run: |
          set -euo pipefail
          {
            echo "### ${LANE}"
            echo '| step | result |'
            echo '| --- | --- |'
            if [[ "${SUITE}" == "fuzz" ]]; then
              echo "| fuzz | ${{ steps.fuzz.outcome }} |"
            else
              echo "| ${SUITE} | ${{ steps.tests.outcome }} |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${SUITE}" != "fuzz" && -f "${GITHUB_WORKSPACE}/build/junit/${SUITE}.xml" ]]; then
            go build -C scripts/ci -o /tmp/nesso-ci .
            /tmp/nesso-ci junit-summary \
              --summary "${GITHUB_STEP_SUMMARY}" \
              "${SUITE}=${GITHUB_WORKSPACE}/build/junit/${SUITE}.xml"
          fi

      - name: Upload JUnit reports
        if: always() && !cancelled() && matrix.suite != 'fuzz'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.id }}
          path: build/junit
          if-no-files-found: warn
          retention-days: 14

      - name: ccache statistics
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          if grep -q 'Cacheable calls:' /tmp/ccache-stats.txt; then
            cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
            uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          else
            cacheable=$(awk '$1 == "Hits:" {print $4; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
            uncacheable=$(awk '$1 == "Uncacheable:" {getline; if ($1 == "Calls:") print $2; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          fi
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo '### ccache'
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-${{ matrix.ccache }}-${{ github.sha }}
