name: Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # 03:17 UTC, off the hour so the nightly run misses the :00 cron pile-up.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force_image_rebuild:
        description: Force rebuild of nesso-build-env and nesso-build-env-el9 even if inputs are unchanged
        type: boolean
        default: false

# Cancel a PR run when a newer push supersedes it. Push and schedule runs
# (main and any tag ref) are left running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  CONAN_HOME: /opt/conan2
  NESSO_BUILD_SHA: ${{ github.sha }}
  NESSO_BUILD_REF: ${{ github.ref }}
  # One string. Unquoted as $CONAN_WERROR_ARGS on each conan install and conan
  # build so the shell splits it into -c and user.nesso:werror=True.
  CONAN_WERROR_ARGS: "-c user.nesso:werror=True"
  # nesso-bench commit for the eval-retrieval job. eval-retrieval.yml and
  # bench-real-log.yml pin the same commit; bump all three together.
  NESSO_BENCH_REPOSITORY: lorenzocaprari/nesso-bench
  NESSO_BENCH_REF: 140bb9e077d3070f4ddf9f907588662f98b65450

# Read-only default. Jobs that pull nesso-build-env keep packages: read.
# prepare-image-amd64, prepare-image-arm64, prepare-image-el9-amd64, and
# prepare-image-el9-arm64 override packages to write so a same-repo rebuild
# can push deps-<hash> and the BuildKit registry cache. The EL9 jobs push
# nesso-build-env-el9. The Ubuntu jobs keep nesso-build-env.
# lint and ci-gate override to contents: read. They do not pull the image.
# coverage adds id-token: write so the Codecov upload can mint an OIDC token.
# step-security/harden-runner v2.22.2 (egress-policy: audit) is the first step
# of every job that runs on the host. Jobs that set container: do not get it:
# those steps run inside the container, and the agent has to install on the VM.
permissions:
  contents: read
  packages: read

jobs:
  # Docs-only pull requests skip heavy jobs via this output. Job-level if,
  # not on.paths: a workflow that never starts leaves required checks pending,
  # and GitHub treats a skipped job as success. An explicit false is the only
  # skip. ci-gate accepts a skip of those heavy jobs only when this output is
  # false. Push, schedule, workflow_dispatch, and a tag push run every heavy
  # job. Paths outside *.md, docs/, LICENSE, and .github/ISSUE_TEMPLATE count
  # as code.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.gate.outputs.code }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'

      - name: Decide whether heavy jobs run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            code=true
          elif [ "${FILTER_CODE}" = "false" ]; then
            code=false
          else
            code=true
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "heavy_jobs=${code}"

  prepare-image-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.select.outputs.image }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image reference
        id: select
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          reg="${{ env.REGISTRY }}/${owner_lc}/nesso-build-env"
          # Shared with prepare-image-arm64 and release.yml.
          deps_hash="$(./scripts/ci/build-env-hash amd64)"
          # Existing tag. buildcache-arm64 is the arm64 twin. Renaming this
          # would orphan the populated amd64 registry cache.
          cache_ref="${reg}:buildcache"
          {
            echo "image=${reg}:deps-${deps_hash}"
            echo "cache_ref=${cache_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check dependency image
        id: image
        env:
          IMAGE: ${{ steps.select.outputs.image }}
        run: |
          if [ '${{ github.event_name == 'workflow_dispatch' && inputs.force_image_rebuild == true }}' != 'true' ] &&
            docker buildx imagetools inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "rebuild=false" >> "${GITHUB_OUTPUT}"
          else
            echo "rebuild=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Free disk space
        if: steps.image.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          # 40 GiB covers a cold BuildKit build of this image. Pull request
          # #120 (run 40221737043) started at 87 GiB free on a 145 GiB disk.
          # The previous free-disk action then spent 359s freeing another 31 GiB
          # the cached rebuild did not use. Below the floor, delete the three
          # large preinstalled trees in parallel. Skip apt purge and docker
          # image prune.
          floor_kb=$((40 * 1024 * 1024))
          echo "available_kib=${avail_kb} floor_kib=${floor_kb}"
          if [ "${avail_kb}" -ge "${floor_kb}" ]; then
            echo "free space already above 40GiB; not deleting"
            exit 0
          fi
          echo "free space below 40GiB; removing android, dotnet, and ghc"
          pids=()
          sudo rm -rf /usr/local/lib/android &
          pids+=("$!")
          sudo rm -rf /usr/share/dotnet &
          pids+=("$!")
          sudo rm -rf /opt/ghc &
          pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            wait "${pid}" || status=1
          done
          if [ "${status}" -ne 0 ]; then
            echo "error: removing a preinstalled tree failed" >&2
            exit 1
          fi
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "available_kib_after=${avail_kb}"
          if [ "${avail_kb}" -lt "${floor_kb}" ]; then
            echo "error: still under 40GiB after removing preinstalled trees" >&2
            exit 1
          fi

      - name: Build and push nesso-build-env
        if: steps.image.outputs.rebuild == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.select.outputs.image }}
          cache-from: type=registry,ref=${{ steps.select.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.select.outputs.cache_ref }},mode=max

      - name: Report free disk
        if: steps.image.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "available_kib_after_build=${avail_kb}"

  # One job, off the image, so it starts with the workflow instead of waiting
  # on prepare-image-amd64. A docs-only pull request still runs it.
  # actionlint, zizmor, ci-gate-needs, and pull-request dependency review are
  # steps here, not new jobs, so the check name stays lint. Later steps use
  # always() so the failed step name stays visible when an earlier step fails.
  # clang-tidy and cppcheck stay separate jobs in the image.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        id: install
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/pre-commit-venv"
          "${RUNNER_TEMP}/pre-commit-venv/bin/pip" install pre-commit
          echo "${RUNNER_TEMP}/pre-commit-venv/bin" >> "${GITHUB_PATH}"

      - name: Format (clang-format, cmake-format)
        if: steps.install.outcome == 'success'
        run: bash scripts/lint --format-only

      - name: Hygiene (whitespace, line endings, YAML, merge markers, large files)
        if: always() && !cancelled() && steps.install.outcome == 'success'
        run: bash scripts/lint --hygiene-only

      - name: Versions (check-versions)
        if: always() && !cancelled() && steps.checkout.outcome == 'success'
        run: bash scripts/check-versions

      - name: Agent docs (check-agent-docs)
        if: always() && !cancelled() && steps.checkout.outcome == 'success'
        run: python3 scripts/check-agent-docs

      - name: Workflow syntax (actionlint)
        if: always() && !cancelled() && steps.checkout.outcome == 'success'
        run: bash scripts/actionlint

      - name: Workflow security (zizmor)
        if: always() && !cancelled() && steps.checkout.outcome == 'success'
        run: bash scripts/zizmor

      - name: Pipeline gate needs (ci-gate)
        if: always() && !cancelled() && steps.checkout.outcome == 'success'
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
        run: go run -C scripts/ci . ci-gate-needs

      - name: Dependency review
        if: always() && !cancelled() && steps.checkout.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: .github/dependency-review-config.yml

  clang-tidy:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          # clang-26 compile DB for analyzer parity with the Clang build lane.
          # --no-remote: use only packages baked into nesso-build-env (avoid
          # ConanCenter recipe drift rebuilding Boost/ORT).
          conan install . -pr:h ./conan/profiles/clang-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Configure
        run: |
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          grep -q 'clang++-21' build/Release/compile_commands.json

      # One marker per unit that clang-tidy found clean, keyed on the
      # preprocessed source, the project files it read, the compile arguments,
      # the clang-tidy version and every .clang-tidy file. Pull requests
      # restore main's markers; only a push to main saves them.
      - name: Restore clang-tidy cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/clang-tidy-cache
          key: clang-tidy-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            clang-tidy-${{ runner.arch }}-

      - name: Run Clang-Tidy
        env:
          NESSO_CLANG_TIDY_CACHE: build/clang-tidy-cache
        run: bash scripts/clang-tidy

      # Markers are written only for clean units, so a failed run still saves
      # valid ones.
      - name: Save clang-tidy cache
        if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/clang-tidy-cache
          key: clang-tidy-${{ runner.arch }}-${{ github.sha }}

  cppcheck:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Configure
        run: |
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run Cppcheck
        run: bash scripts/cppcheck

  build-gcc-26-amd64:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-gcc-15-Release-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-gcc-15-Release-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Build
        env:
          # Baked into the test binaries. The test job restores models/ at this
          # same workspace path, and a missing model then fails instead of skipping.
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
        run: conan build . -pr:h ./conan/profiles/gcc-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: ccache statistics
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo '### ccache'
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-gcc-15-Release-${{ github.sha }}

      - name: Archive Release build
        id: archive
        run: ./scripts/ci/ci-build-archive pack build/Release release-build

      - name: Upload Release build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: ${{ steps.archive.outputs.archive }}
          retention-days: 1
          if-no-files-found: error
          # The tar is already gzip (or zstd). Skip a second zlib pass.
          compression-level: 0

  build-gcc-26-debug-amd64:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-gcc-15-Debug-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-gcc-15-Debug-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26-debug -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Build
        env:
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
        run: conan build . -pr:h ./conan/profiles/gcc-26-debug -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: ccache statistics
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo '### ccache'
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-gcc-15-Debug-${{ github.sha }}

      - name: Archive Debug build
        id: archive
        run: ./scripts/ci/ci-build-archive pack build/Debug debug-build

      - name: Upload Debug build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-build
          path: ${{ steps.archive.outputs.archive }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  # The job id is the check name. There is no matrix, so a docs-only skip or
  # a failed build still reports that name. GitHub counts the skip as success.
  # functional is a step on gcc Release, Clang, and arm64. It stays its own
  # gcc Debug job: on a no-image pull request that suite is the wall-clock
  # tail (run 40200059245, +255s) and the bdd test already uses every logical
  # CPU, so appending unit and integration would lengthen it. Those three
  # lanes have slack against that tail and against coverage on the #120 image
  # rebuild (run 40221737043, coverage at +643s).
  # ctest --output-junit is an absolute path: ctest changes into --test-dir
  # before it opens the file.
  test-gcc-26-amd64:
    needs: [prepare-image-amd64, build-gcc-26-amd64, changes]
    if: >-
      ${{ always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      needs.build-gcc-26-amd64.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      actions: write
    container:
