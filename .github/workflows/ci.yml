name: Pipeline

on:
  push:
      branches: [ "main" ]
      paths-ignore:
        - '.devcontainer/**'
  pull_request:
      branches: [ "main" ]
      paths-ignore:
        - '.devcontainer/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-gcc-26:
    runs-on: ubuntu-latest

    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    container:
      image: ghcr.io/${{ github.repository_owner }}/mach-build-env:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (Conan)
        run: |
            conan profile detect --force
            conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --build=missing

      - name: Build
        run: |
            conan build .  -pr:h ./conan/profiles/gcc-26 -pr:b default --build=missing
