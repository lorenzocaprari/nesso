name: Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build_env: ${{ steps.filter.outputs.build_env }}
    steps:
      - name: Detect toolchain image inputs
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            build_env:
              - '.devcontainer/Dockerfile'

  build-env:
    needs: changes
    if: needs.changes.outputs.build_env == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          reg="${{ env.REGISTRY }}/${owner_lc}/mach-build-env"
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            sha='${{ github.event.pull_request.head.sha }}'
          else
            sha='${{ github.sha }}'
          fi
          sha_tag="${reg}:sha-${sha}"
          {
            echo "sha_tag=${sha_tag}"
            if [ '${{ github.event_name }}' = 'push' ] && [ '${{ github.ref }}' = 'refs/heads/main' ]; then
              echo "image=${reg}:latest"
              echo "tags<<EOF"
              echo "${reg}:latest"
              echo "${sha_tag}"
              echo "EOF"
            else
              echo "image=${sha_tag}"
              echo "tags<<EOF"
              echo "${sha_tag}"
              echo "EOF"
            fi
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push mach-build-env
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  resolve-image:
    needs: [changes, build-env]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.build-env.result == 'success' || needs.build-env.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set.outputs.image }}
    steps:
      - name: Select container image
        id: set
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          if [ '${{ needs.build-env.result }}' = 'success' ]; then
            echo "image=${{ needs.build-env.outputs.image }}" >> "${GITHUB_OUTPUT}"
          else
            echo "image=${{ env.REGISTRY }}/${owner_lc}/mach-build-env:latest" >> "${GITHUB_OUTPUT}"
          fi

  # Build Conan deps (esp. onnxruntime) once before parallel jobs race --build=missing.
  conan-warm:
    needs: resolve-image
    if: needs.resolve-image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Conan cache
        id: cache-conan
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ hashFiles('conanfile.py', 'conan/profiles/**') }}
          restore-keys: |
            conan-

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-warm-${{ hashFiles('conanfile.py', 'conan/profiles/**') }}
          restore-keys: |
            ccache-warm-
            ccache-

      - name: Configure Conan and ccache
        run: |
          mkdir -p "${CONAN_HOME}" "${CCACHE_DIR}"
          conf="${CONAN_HOME}/global.conf"
          if [ -f "${conf}" ]; then
            sed -i '/tools\.cmake\.cmaketoolchain:cache_variables/d' "${conf}"
          fi
          conan profile detect --force
          grep -q 'CMAKE_CXX_COMPILER_LAUNCHER' "${conf}" || printf '%s\n' \
            'tools.cmake.cmaketoolchain:extra_variables={"CMAKE_C_COMPILER_LAUNCHER": "ccache", "CMAKE_CXX_COMPILER_LAUNCHER": "ccache"}' \
            >> "${conf}"

      - name: Warm Conan packages (Release + Debug)
        run: |
          conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --build=missing
          conan install . -pr:h ./conan/profiles/gcc-26-debug -pr:b default --build=missing
          # Drop build/source trees so the GHA cache stays under size limits.
          conan cache clean "*" --build --source --download --temp

      - name: Save Conan cache
        if: steps.cache-conan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: ${{ steps.cache-conan.outputs.cache-primary-key }}

      - name: Save ccache
        if: steps.cache-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}

  # Explicit if: default success() is false when build-env was skipped upstream,
  # which would skip every consumer even after resolve-image succeeds.
  lint:
    needs: resolve-image
    if: needs.resolve-image.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Mark repository safe for Git
        run: git config --global --add safe.directory "$(pwd)"

      - name: Run Linter
        run: bash scripts/lint

  clang-tidy:
    needs: [resolve-image, conan-warm]
    if: >-
      needs.resolve-image.result == 'success' &&
      needs.conan-warm.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ hashFiles('conanfile.py', 'conan/profiles/**') }}
          restore-keys: |
            conan-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-tidy-${{ hashFiles('conanfile.py', 'conan/profiles/**', 'src/**', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-tidy-
            ccache-

      - name: Configure Conan and ccache
        run: |
          mkdir -p "${CONAN_HOME}" "${CCACHE_DIR}"
          conf="${CONAN_HOME}/global.conf"
          # Drop invalid key from cached global.conf (breaks Conan init).
          if [ -f "${conf}" ]; then
            sed -i '/tools\.cmake\.cmaketoolchain:cache_variables/d' "${conf}"
          fi
          conan profile detect --force
          grep -q 'CMAKE_CXX_COMPILER_LAUNCHER' "${conf}" || printf '%s\n' \
            'tools.cmake.cmaketoolchain:extra_variables={"CMAKE_C_COMPILER_LAUNCHER": "ccache", "CMAKE_CXX_COMPILER_LAUNCHER": "ccache"}' \
            >> "${conf}"

      - name: Install Dependencies (Conan)
        run: conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --build=missing

      - name: Build
        run: conan build . -pr:h ./conan/profiles/gcc-26 -pr:b default --build=missing

      - name: Run Clang-Tidy
        run: bash scripts/clang-tidy

      - name: ccache stats
        if: always()
        run: ccache -s

  build-gcc-26:
    needs: [resolve-image, conan-warm]
    if: >-
      needs.resolve-image.result == 'success' &&
      needs.conan-warm.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ hashFiles('conanfile.py', 'conan/profiles/**') }}
          restore-keys: |
            conan-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-release-${{ hashFiles('conanfile.py', 'conan/profiles/**', 'src/**', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-release-
            ccache-

      - name: Configure Conan and ccache
        run: |
          mkdir -p "${CONAN_HOME}" "${CCACHE_DIR}"
          conf="${CONAN_HOME}/global.conf"
          # Drop invalid key from cached global.conf (breaks Conan init).
          if [ -f "${conf}" ]; then
            sed -i '/tools\.cmake\.cmaketoolchain:cache_variables/d' "${conf}"
          fi
          conan profile detect --force
          grep -q 'CMAKE_CXX_COMPILER_LAUNCHER' "${conf}" || printf '%s\n' \
            'tools.cmake.cmaketoolchain:extra_variables={"CMAKE_C_COMPILER_LAUNCHER": "ccache", "CMAKE_CXX_COMPILER_LAUNCHER": "ccache"}' \
            >> "${conf}"

      - name: Install Dependencies (Conan)
        run: conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --build=missing

      - name: Build
        run: conan build . -pr:h ./conan/profiles/gcc-26 -pr:b default --build=missing

      - name: Run Unit Tests
        run: |
          cd build/Release
          ctest -V

      - name: ccache stats
        if: always()
        run: ccache -s

  build-gcc-26-debug:
    needs: [resolve-image, conan-warm]
    if: >-
      needs.resolve-image.result == 'success' &&
      needs.conan-warm.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ hashFiles('conanfile.py', 'conan/profiles/**') }}
          restore-keys: |
            conan-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-debug-${{ hashFiles('conanfile.py', 'conan/profiles/**', 'src/**', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-debug-
            ccache-

      - name: Configure Conan and ccache
        run: |
          mkdir -p "${CONAN_HOME}" "${CCACHE_DIR}"
          conf="${CONAN_HOME}/global.conf"
          # Drop invalid key from cached global.conf (breaks Conan init).
          if [ -f "${conf}" ]; then
            sed -i '/tools\.cmake\.cmaketoolchain:cache_variables/d' "${conf}"
          fi
          conan profile detect --force
          grep -q 'CMAKE_CXX_COMPILER_LAUNCHER' "${conf}" || printf '%s\n' \
            'tools.cmake.cmaketoolchain:extra_variables={"CMAKE_C_COMPILER_LAUNCHER": "ccache", "CMAKE_CXX_COMPILER_LAUNCHER": "ccache"}' \
            >> "${conf}"

      - name: Install Dependencies (Conan)
        run: conan install . -pr:h ./conan/profiles/gcc-26-debug -pr:b default --build=missing

      - name: Build
        run: conan build . -pr:h ./conan/profiles/gcc-26-debug -pr:b default --build=missing

      - name: ccache stats
        if: always()
        run: ccache -s

  coverage:
    needs: [resolve-image, conan-warm, build-gcc-26, build-gcc-26-debug]
    if: >-
      needs.resolve-image.result == 'success' &&
      needs.conan-warm.result == 'success' &&
      needs.build-gcc-26.result == 'success' &&
      needs.build-gcc-26-debug.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ hashFiles('conanfile.py', 'conan/profiles/**') }}
          restore-keys: |
            conan-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-coverage-${{ hashFiles('conanfile.py', 'conan/profiles/**', 'src/**', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-coverage-
            ccache-

      - name: Configure Conan and ccache
        run: |
          mkdir -p "${CONAN_HOME}" "${CCACHE_DIR}"
          conf="${CONAN_HOME}/global.conf"
          # Drop invalid key from cached global.conf (breaks Conan init).
          if [ -f "${conf}" ]; then
            sed -i '/tools\.cmake\.cmaketoolchain:cache_variables/d' "${conf}"
          fi
          conan profile detect --force
          grep -q 'CMAKE_CXX_COMPILER_LAUNCHER' "${conf}" || printf '%s\n' \
            'tools.cmake.cmaketoolchain:extra_variables={"CMAKE_C_COMPILER_LAUNCHER": "ccache", "CMAKE_CXX_COMPILER_LAUNCHER": "ccache"}' \
            >> "${conf}"

      - name: Run Coverage Script
        run: |
          chmod +x scripts/code-coverage
          ./scripts/code-coverage conan/profiles/code-coverage

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/report
          if-no-files-found: warn
