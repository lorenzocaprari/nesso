  # Native arm64 image. The image name stays nesso-build-env. The amd64
  # tag stays deps-<hash>; the arm64 tag appends -arm64. The amd64 job id
  # is prepare-image-amd64.
  prepare-image-arm64:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.select.outputs.image }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image reference
        id: select
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          reg="${{ env.REGISTRY }}/${owner_lc}/nesso-build-env"
          deps_hash="$(./scripts/ci/build-env-hash arm64)"
          {
            echo "image=${reg}:deps-${deps_hash}-arm64"
            echo "cache_ref=${reg}:buildcache-arm64"
          } >> "${GITHUB_OUTPUT}"

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check dependency image
        id: image
        env:
          IMAGE: ${{ steps.select.outputs.image }}
        run: |
          if [ '${{ github.event_name == 'workflow_dispatch' && inputs.force_image_rebuild == true }}' != 'true' ] &&
            docker buildx imagetools inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "rebuild=false" >> "${GITHUB_OUTPUT}"
          else
            echo "rebuild=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Free disk space
        if: steps.image.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          # 40 GiB covers a cold BuildKit build of this image. Pull request
          # #120 (run 40221737043) started at 87 GiB free on a 145 GiB disk.
          # The previous free-disk action then spent 359s freeing another 31 GiB
          # the cached rebuild did not use. Below the floor, delete the three
          # large preinstalled trees in parallel. Skip apt purge and docker
          # image prune.
          floor_kb=$((40 * 1024 * 1024))
          echo "available_kib=${avail_kb} floor_kib=${floor_kb}"
          if [ "${avail_kb}" -ge "${floor_kb}" ]; then
            echo "free space already above 40GiB; not deleting"
            exit 0
          fi
          echo "free space below 40GiB; removing android, dotnet, and ghc"
          pids=()
          sudo rm -rf /usr/local/lib/android &
          pids+=("$!")
          sudo rm -rf /usr/share/dotnet &
          pids+=("$!")
          sudo rm -rf /opt/ghc &
          pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            wait "${pid}" || status=1
          done
          if [ "${status}" -ne 0 ]; then
            echo "error: removing a preinstalled tree failed" >&2
            exit 1
          fi
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "available_kib_after=${avail_kb}"
          if [ "${avail_kb}" -lt "${floor_kb}" ]; then
            echo "error: still under 40GiB after removing preinstalled trees" >&2
            exit 1
          fi

