name: Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build_env: ${{ steps.filter.outputs.build_env }}
    steps:
      - name: Detect build-env inputs
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            build_env:
              - '.devcontainer/Dockerfile'
              - 'conanfile.py'
              - 'conan/profiles/**'

  build-env:
    needs: changes
    if: needs.changes.outputs.build_env == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          reg="${{ env.REGISTRY }}/${owner_lc}/mach-build-env"
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            sha='${{ github.event.pull_request.head.sha }}'
          else
            sha='${{ github.sha }}'
          fi
          sha_tag="${reg}:sha-${sha}"
          {
            echo "sha_tag=${sha_tag}"
            if [ '${{ github.event_name }}' = 'push' ] && [ '${{ github.ref }}' = 'refs/heads/main' ]; then
              echo "image=${reg}:latest"
              echo "tags<<EOF"
              echo "${reg}:latest"
              echo "${sha_tag}"
              echo "EOF"
            else
              echo "image=${sha_tag}"
              echo "tags<<EOF"
              echo "${sha_tag}"
              echo "EOF"
            fi
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push mach-build-env
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  resolve-image:
    needs: [changes, build-env]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.build-env.result == 'success' || needs.build-env.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set.outputs.image }}
    steps:
      - name: Select container image
        id: set
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          if [ '${{ needs.build-env.result }}' = 'success' ]; then
            echo "image=${{ needs.build-env.outputs.image }}" >> "${GITHUB_OUTPUT}"
          else
            echo "image=${{ env.REGISTRY }}/${owner_lc}/mach-build-env:latest" >> "${GITHUB_OUTPUT}"
          fi

  # Explicit if: default success() is false when build-env was skipped upstream,
  # which would skip every consumer even after resolve-image succeeds.
  lint:
    needs: resolve-image
    if: needs.resolve-image.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Mark repository safe for Git
        run: git config --global --add safe.directory "$(pwd)"

      - name: Run Linter
        run: bash scripts/lint

  clang-tidy:
    needs: resolve-image
    if: needs.resolve-image.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --build=missing

      - name: Build
        run: conan build . -pr:h ./conan/profiles/gcc-26 -pr:b default --build=missing

      - name: Run Clang-Tidy
        run: bash scripts/clang-tidy

  build-gcc-26:
    needs: resolve-image
    if: needs.resolve-image.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --build=missing

      - name: Build
        run: conan build . -pr:h ./conan/profiles/gcc-26 -pr:b default --build=missing

  build-gcc-26-debug:
    needs: resolve-image
    if: needs.resolve-image.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26-debug -pr:b default --build=missing

      - name: Build
        run: conan build . -pr:h ./conan/profiles/gcc-26-debug -pr:b default --build=missing

  run-unit-tests-release:
    needs: [resolve-image, build-gcc-26, build-gcc-26-debug]
    if: >-
      needs.resolve-image.result == 'success' &&
      needs.build-gcc-26.result == 'success' &&
      needs.build-gcc-26-debug.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --build=missing

      - name: Build (for tests)
        run: conan build . -pr:h ./conan/profiles/gcc-26 -pr:b default --build=missing

      - name: Run Unit Tests
        run: |
          cd build/Release
          ctest -V

  coverage:
    needs: [resolve-image, build-gcc-26, build-gcc-26-debug]
    if: >-
      needs.resolve-image.result == 'success' &&
      needs.build-gcc-26.result == 'success' &&
      needs.build-gcc-26-debug.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Conan Default Profile
        run: conan profile detect --force

      - name: Run Coverage Script
        run: |
          chmod +x scripts/code-coverage
          ./scripts/code-coverage conan/profiles/code-coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/report
          if-no-files-found: warn
