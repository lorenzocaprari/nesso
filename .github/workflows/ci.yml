          name: junit-test-gcc-26-debug-amd64-functional
          path: build/junit
          if-no-files-found: warn
          retention-days: 14

  fuzz-test:
    needs: prepare-image-amd64
    # ClusterFuzzLite already fuzzes every pull request. This AFL++ job is
    # about three minutes and runs beside the other jobs, so keep it on main
    # pushes and the nightly schedule. It builds the LTO harnesses
    # ClusterFuzzLite does not. The job id stays fuzz-test. The amd64 image
    # already has afl++, Clang 21, the compiler-rt symlinks, lld-21, and llvm-21.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure Conan default profile
        run: conan profile detect --force

      - name: Run fuzz-test (AFL++ library harnesses + ASan)
        run: |
          chmod +x scripts/fuzz-test
          NESSO_FUZZ_MAX_TOTAL_TIME=60 ./scripts/fuzz-test

      # upload-artifact rejects ':' in paths, and every AFL finding is named id:NNNNNN,...
      - name: Collect AFL crashes
        if: failure()
        run: |
          mkdir -p build/fuzz/findings
          for crash in build/fuzz/afl-out-*/default/crashes/id:*; do
            [ -f "${crash}" ] || continue
            target="$(basename "$(dirname "$(dirname "$(dirname "${crash}")")")")"
            cp "${crash}" "build/fuzz/findings/${target}_$(basename "${crash}" | tr ':,' '__')"
          done

      - name: Upload AFL findings on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-test-findings
          path: build/fuzz/findings
          if-no-files-found: warn

  coverage:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: write
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The patch gate diffs the pull request base. History here is small,
          # and depth 0 keeps that commit local without a second fetch.
          fetch-depth: 0
          persist-credentials: false

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Create Conan Default Profile
        run: conan profile detect --force

      - name: Run Coverage Script
        env:
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
        run: |
          chmod +x scripts/code-coverage
          ./scripts/code-coverage conan/profiles/code-coverage

      # Pull requests only. Reuses the lcov trace from the floor step, so the
      # added work is the checkout history plus a line lookup. The bar is 80%
      # of changed executable lines under src/. That sits under the tree-wide
      # line floor: an untested function fails here, and a change that pulls
      # the whole tree under the floor still fails there. No executable src/
      # lines (docs, CI, tests) passes. Other events skip this step.
      - name: Patch coverage
        if: always() && !cancelled() && github.event_name == 'pull_request'
        shell: bash
        env:
          PATCH_BASE: ${{ github.event.pull_request.base.sha }}
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
        run: |
          set -euo pipefail
          # Checkout records safe.directory under a temporary HOME. Later steps
          # use the job HOME, so mark the workspace before git diff.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory /__w/nesso/nesso
          if [[ ! -s build/coverage/coverage.cleaned ]]; then
            echo "patch coverage skipped: coverage trace was not produced"
            exit 0
          fi
          if [[ ! "$PATCH_BASE" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "patch coverage: base SHA is not 40 hex characters" >&2
            exit 1
          fi
          if ! git cat-file -e "${PATCH_BASE}^{commit}"; then
            git fetch --no-tags --depth=1 origin "$PATCH_BASE"
            git cat-file -e "${PATCH_BASE}^{commit}"
          fi
          mkdir -p build/coverage/report
          go build -C scripts/ci -o /tmp/nesso-ci .
          /tmp/nesso-ci patch-coverage \
            --lcov build/coverage/coverage.cleaned \
            --repo "${GITHUB_WORKSPACE}" \
            --base "$PATCH_BASE" \
            --head HEAD \
            --prefix src \
            --threshold 80 \
            | tee build/coverage/report/patch.md

      - name: Upload Coverage Report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: build/coverage/report
          if-no-files-found: warn

  # Gates a merge. Pull requests run 1k and 10k. Pushes to main, the nightly
  # schedule, and workflow_dispatch also run 100k. The baseline is the latest
  # result saved from a non-PR run of this workflow.
  #
  # Across 13 PR runs on 2026-10-25, one tier's wall time varied by up to 4.51x
  # (two runner speed classes) while peak RSS stayed within 1.05x. Wall limit
  # is 5.50x so that spread passes; RSS limit is 1.20x. A missing baseline warns.
  #
  # Pull requests also append an informational comparison against gh-pages
  # history. That step does not fail the job and does not push. bench-history
  # records the same ci.json, and only on a push to main.
  bench:
    needs: [prepare-image-amd64, build-gcc-26-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      NESSO_BENCH_WALL_TOLERANCE: "4.5"
      NESSO_BENCH_RSS_TOLERANCE: "0.20"
      NESSO_BENCH_SIZES: ${{ github.event_name == 'pull_request' && '1000,10000' || '1000,10000,100000' }}
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Download Release build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build

      - name: Extract Release build
        run: ./scripts/ci-build-archive unpack release-build

      - name: Restore main benchmark baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench/main-baseline
          # Unique primary key so each non-PR run can save. Restore picks the
          # newest bench-baseline-* entry, which non-PR runs write below.
          key: bench-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bench-baseline-

      - name: Run end-to-end benchmark
        run: |
          # Cap address space at 3/4 of RAM so an oversized embed batch fails
          # inside nesso instead of triggering the runner's OOM killer.
          mem_kb=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          export NESSO_BENCH_AS_LIMIT_KB=$((mem_kb * 3 / 4))
          python3 scripts/bench --binary build/Release/src/nesso --timeout 300 \
            --sizes "${NESSO_BENCH_SIZES}" \
            --output bench/results/ci.json

      - name: Compare against main baseline
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 scripts/bench-compare \
            --baseline bench/main-baseline/baseline.json \
            --result bench/results/ci.json | tee bench/results/compare.txt || status=$?
          cat bench/results/compare.txt
          {
            echo '### Benchmark versus main baseline'
            echo '```'
            cat bench/results/compare.txt
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      # Reads gh-pages. Does not write it, and does not change the exit status
      # of the baseline comparison above. A missing branch or a GitHub error
      # is a summary note.
      - name: Summarize benchmark history
        if: always() && !cancelled() && github.event_name == 'pull_request'
        shell: bash
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HISTORY_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! -s bench/results/ci.json ]]; then
            {
              echo '### Benchmark history'
              echo
              echo 'No benchmark result file, so history was not compared. This does not fail the job.'
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          go build -C scripts/ci -o /tmp/nesso-ci .
          /tmp/nesso-ci bench-history --result bench/results/ci.json --repo "${HISTORY_REPO}"

      - name: Stage main benchmark baseline
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p bench/main-baseline
          cp bench/results/ci.json bench/main-baseline/baseline.json

      - name: Save main benchmark baseline
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench/main-baseline
          key: bench-baseline-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench/results/
          if-no-files-found: warn

  # Records bench/results/ci.json on gh-pages. Pull requests never run this
  # job. Nightly and workflow_dispatch do not either: a second point for the
  # same commit would weight the median. The action's alert is off, so this
  # is not a second gate. contents: write is only on this job.
  bench-history:
    needs: [bench]
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.bench.result == 'success' || needs.bench.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Refuse to record history off main
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "push" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "bench-history: refusing to write gh-pages from ${EVENT_NAME} ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download benchmark results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: bench-results
          path: bench/results

      - name: Convert benchmark result
        shell: bash
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
          BENCH_RESULT: ${{ needs.bench.result }}
        run: |
          set -euo pipefail
          if [[ ! -s bench/results/ci.json ]]; then
            if [[ "${BENCH_RESULT}" == "success" ]]; then
              echo "bench-history: bench succeeded but ci.json is missing" >&2
              exit 1
            fi
            echo "bench-history: no ci.json; nothing to record"
            exit 0
          fi
          go build -C scripts/ci -o /tmp/nesso-ci .
          /tmp/nesso-ci bench-external \
            --result bench/results/ci.json \
            --output bench/results/external.json

      - name: Ensure gh-pages exists
        if: hashFiles('bench/results/external.json') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api --silent "repos/${GITHUB_REPOSITORY}/branches/gh-pages"; then
            echo "gh-pages exists"
            exit 0
          fi
          payload="$(jq -n \
            --arg readme $'Benchmark history for nesso. The chart is dev/bench/index.html.\n' \
            --arg nojekyll $'\n' \
            '{tree: [
              {path: "README.md", mode: "100644", type: "blob", content: $readme},
              {path: ".nojekyll", mode: "100644", type: "blob", content: $nojekyll}
            ]}')"
          tree_sha="$(printf '%s' "${payload}" | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          commit_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" \
            -f message='init benchmark history' \
            -f tree="${tree_sha}" \
            --jq .sha)"
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref='refs/heads/gh-pages' \
            -f sha="${commit_sha}" >/dev/null; then
            gh api --silent "repos/${GITHUB_REPOSITORY}/branches/gh-pages"
          fi

      # fail-on-alert and comment-on-alert stay off. Runner wall time moves by
      # about 4.5x, so an alert here would fight the bench gate.
      - name: Store benchmark history
        if: hashFiles('bench/results/external.json') != ''
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: nesso
          tool: customSmallerIsBetter
          output-file-path: bench/results/external.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: "true"
          comment-on-alert: "false"
          fail-on-alert: "false"
          summary-always: "true"
          max-items-in-chart: "500"
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  # fp32 and the default int8 policy gate the job. Pull requests set
  # NESSO_DETERMINISM_MODE=pr (256-line input, 2 runs, 2 index runs).
  # Push, schedule, and workflow_dispatch keep the full gate. int8 with
  # NESSO_THREADS=$(nproc) stays report-only: that override is one
  # single-thread session per logical CPU and skips the RAM cap.
  determinism:
    needs: [prepare-image-amd64, build-gcc-26-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NESSO_DETERMINISM_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore int8 MiniLM
        id: int8
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch int8 MiniLM
        if: steps.int8.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models int8

      - name: Restore fp32 MiniLM
        id: fp32
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models-fp32
          key: minilm-fp32-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch fp32 MiniLM
        if: steps.fp32.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models-fp32 fp32

      - name: Download Release build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build

      - name: Extract Release build
        run: ./scripts/ci-build-archive unpack release-build

      - name: Write determinism input
        run: ./scripts/check-determinism --emit-input determinism-input.log

      - name: Gate fp32 determinism
        shell: bash
        run: |
          set -euo pipefail
          args=(
            ./scripts/check-determinism
            --binary build/Release/src/nesso
            --model-dir models-fp32
            --input determinism-input.log
          )
          if [[ "${NESSO_DETERMINISM_MODE}" == "full" ]]; then
            args+=(--index-runs 3)
          fi
          "${args[@]}"

      - name: Gate int8 determinism
        shell: bash
        run: |
          set -euo pipefail
          args=(
            ./scripts/check-determinism
            --binary build/Release/src/nesso
            --model-dir models
            --input determinism-input.log
          )
          if [[ "${NESSO_DETERMINISM_MODE}" == "full" ]]; then
            args+=(--index-runs 3)
          fi
          "${args[@]}"

      - name: Report int8 determinism at nproc sessions
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status=0
          args=(
            ./scripts/check-determinism
            --binary build/Release/src/nesso
            --model-dir models
            --input determinism-input.log
          )
          if [[ "${NESSO_DETERMINISM_MODE}" == "full" ]]; then
            args+=(--index-runs 3)
          fi
          NESSO_THREADS="$(nproc)" "${args[@]}" >int8-nproc-determinism.txt 2>&1 || status=$?
          cat int8-nproc-determinism.txt
          {
            echo '### int8 determinism, one single-thread session per logical CPU (report only)'
            echo '```'
            cat int8-nproc-determinism.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

  # Clang 21 compiles nesso against the gcc-built libstdc++ packages
  # already in nesso-build-env (see conan/profiles/clang-26). libc++ is
  # not used: it is a different ABI from those static archives.
  build-clang-26-amd64:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-clang-21-Release-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-clang-21-Release-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      - name: Show Clang
        run: clang++-21 --version

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/clang-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Build
        env:
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
        run: conan build . -pr:h ./conan/profiles/clang-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Require Clang and libstdc++
        run: |
          set -euo pipefail
          toolchain="build/Release/generators/conan_toolchain.cmake"
          commands="build/Release/compile_commands.json"
          grep -q 'clang++-21' "${toolchain}"
          grep -q 'clang++-21' "${commands}"
          if grep -q -- '-stdlib=libc++' "${commands}"; then
            echo "error: compile commands select libc++" >&2
            exit 1
          fi
          ldd build/Release/src/nesso > /tmp/nesso-ldd.txt
          cat /tmp/nesso-ldd.txt
          grep -q 'libstdc++' /tmp/nesso-ldd.txt
          if grep -q 'libc++' /tmp/nesso-ldd.txt; then
            echo "error: nesso is linked to libc++" >&2
            exit 1
          fi

      - name: ccache statistics
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo '### ccache'
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-clang-21-Release-${{ github.sha }}

      - name: Archive Release build
        id: archive
        run: ./scripts/ci-build-archive pack build/Release release-build-clang

      - name: Upload Release build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-clang
          path: ${{ steps.archive.outputs.archive }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

