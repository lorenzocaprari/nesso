            echo "| integration | ${{ steps.integration.outcome }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          go build -C scripts/ci -o /tmp/nesso-ci .
          /tmp/nesso-ci junit-summary \
            --summary "${GITHUB_STEP_SUMMARY}" \
            unit="${GITHUB_WORKSPACE}/build/junit/unit.xml" \
