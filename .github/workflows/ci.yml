  # name, CI gate. needs is every other job in this file. The lint step
  # ci-gate-needs fails when a job is missing from needs or from JOB_RESULTS,
  # or when a job's if is not one of the known skip shapes. always() runs
  # this job after failures, cancellations, and skips. The result check fails
  # on failure and cancelled. A skip passes only for the docs-only path
  # filter, fuzz-test on a pull request, and bench-history off a push to
  # main. A skip caused by a failed or cancelled dependency does not pass.
  ci-gate:
    name: CI gate
    needs:
      - changes
      - prepare-image-amd64
      - lint
      - clang-tidy
      - cppcheck
      - build-gcc-26-amd64
      - build-gcc-26-debug-amd64
      - test-gcc-26-amd64
      - test-gcc-26-debug-amd64
      - test-gcc-26-debug-amd64-functional
      - fuzz-test
      - coverage
      - bench
      - bench-history
      - determinism
      - build-clang-26-amd64
      - test-clang-26-amd64
      - prepare-image-arm64
      - build-gcc-26-arm64
      - test-gcc-26-arm64
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Pipeline jobs
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          JOB_RESULTS: |
            changes=${{ needs.changes.result }}
            prepare-image-amd64=${{ needs.prepare-image-amd64.result }}
            lint=${{ needs.lint.result }}
            clang-tidy=${{ needs.clang-tidy.result }}
            cppcheck=${{ needs.cppcheck.result }}
            build-gcc-26-amd64=${{ needs.build-gcc-26-amd64.result }}
            build-gcc-26-debug-amd64=${{ needs.build-gcc-26-debug-amd64.result }}
            test-gcc-26-amd64=${{ needs.test-gcc-26-amd64.result }}
            test-gcc-26-debug-amd64=${{ needs.test-gcc-26-debug-amd64.result }}
            test-gcc-26-debug-amd64-functional=${{ needs.test-gcc-26-debug-amd64-functional.result }}
            fuzz-test=${{ needs.fuzz-test.result }}
            coverage=${{ needs.coverage.result }}
            bench=${{ needs.bench.result }}
            bench-history=${{ needs.bench-history.result }}
            determinism=${{ needs.determinism.result }}
            build-clang-26-amd64=${{ needs.build-clang-26-amd64.result }}
            test-clang-26-amd64=${{ needs.test-clang-26-amd64.result }}
            prepare-image-arm64=${{ needs.prepare-image-arm64.result }}
            build-gcc-26-arm64=${{ needs.build-gcc-26-arm64.result }}
            test-gcc-26-arm64=${{ needs.test-gcc-26-arm64.result }}
        run: go run -C scripts/ci . ci-gate
