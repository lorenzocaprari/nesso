name: Pipeline

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force_image_rebuild:
        description: Force rebuild of nesso-build-env even if inputs are unchanged
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  CONAN_HOME: /opt/conan2

permissions:
  contents: read
  packages: read

jobs:
  prepare-image:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.select.outputs.image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve image reference
        id: select
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          reg="${{ env.REGISTRY }}/${owner_lc}/nesso-build-env"
          deps_hash="$(sha256sum .devcontainer/Dockerfile conanfile.py conan.lock \
            conan/profiles/gcc-26 conan/profiles/gcc-26-debug | sha256sum | cut -c1-16)"
          cache_ref="${reg}:buildcache"
          {
            echo "image=${reg}:deps-${deps_hash}"
            echo "cache_ref=${cache_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check dependency image
        id: image
        run: |
          if [ '${{ inputs.force_image_rebuild }}' != 'true' ] &&
            docker buildx imagetools inspect '${{ steps.select.outputs.image }}' >/dev/null 2>&1; then
            echo "rebuild=false" >> "${GITHUB_OUTPUT}"
          else
            echo "rebuild=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Free disk space
        if: steps.image.outputs.rebuild == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build and push nesso-build-env
        if: steps.image.outputs.rebuild == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.select.outputs.image }}
          cache-from: type=registry,ref=${{ steps.select.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.select.outputs.cache_ref }},mode=max

  lint:
    needs: prepare-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Mark repository safe for Git
        run: git config --global --add safe.directory "$(pwd)"

      - name: Run Linter
        run: bash scripts/lint

  clang-tidy:
    needs: prepare-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          # --no-remote: use only packages baked into nesso-build-env (avoid
          # ConanCenter recipe drift rebuilding Boost/ORT).
          conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Configure
        run: |
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run Clang-Tidy
        run: bash scripts/clang-tidy

  build-gcc-26:
    needs: prepare-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Build
        run: conan build . -pr:h ./conan/profiles/gcc-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Archive Release build
        run: tar -czf release-build.tar.gz build/Release

      - name: Upload Release build
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: release-build.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-gcc-26-debug:
    needs: prepare-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26-debug -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Build
        run: conan build . -pr:h ./conan/profiles/gcc-26-debug -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Archive Debug build
        run: tar -czf debug-build.tar.gz build/Debug

      - name: Upload Debug build
        uses: actions/upload-artifact@v4
        with:
          name: debug-build
          path: debug-build.tar.gz
          retention-days: 1
          if-no-files-found: error

  unit-tests-release:
    needs: [prepare-image, build-gcc-26]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download Release build
        uses: actions/download-artifact@v4
        with:
          name: release-build

      - name: Extract Release build
        run: tar -xzf release-build.tar.gz

      - name: Run Catch2 unit tests (includes search_oracle_test)
        run: ctest --test-dir build/Release -V

  unit-tests-debug:
    needs: [prepare-image, build-gcc-26-debug]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download Debug build
        uses: actions/download-artifact@v4
        with:
          name: debug-build

      - name: Extract Debug build
        run: tar -xzf debug-build.tar.gz

      - name: Run Catch2 unit tests (ASan/UBSan, includes search_oracle_test)
        run: |
          export ASAN_OPTIONS=halt_on_error=1:detect_leaks=1:abort_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          ctest --test-dir build/Debug -V

  fuzz-test:
    needs: prepare-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.prepare-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install AFL++ toolchain (idempotent if baked into image)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang-21 libclang-rt-21-dev afl++
          rm -rf /var/lib/apt/lists/*
          # Bridge Ubuntu linux/*-x86_64.a layout ↔ triple-dir names AFL/Clang may request.
          rt_lib="/usr/lib/llvm-21/lib/clang/21/lib"
          if [ -d "${rt_lib}/linux" ] && [ ! -e "${rt_lib}/x86_64-pc-linux-gnu" ]; then
            mkdir -p "${rt_lib}/x86_64-pc-linux-gnu"
            for kind in asan asan_cxx asan_static asan-preinit \
              ubsan_standalone ubsan_standalone_cxx fuzzer fuzzer_no_main; do
              for src in \
                "${rt_lib}/linux/libclang_rt.${kind}-x86_64.a" \
                "${rt_lib}/linux/libclang_rt.${kind}.a"; do
                if [ -f "${src}" ]; then
                  ln -sfn "${src}" "${rt_lib}/x86_64-pc-linux-gnu/libclang_rt.${kind}.a"
                  break
                fi
              done
            done
          fi

      - name: Ensure Conan default profile
        run: conan profile detect --force

      - name: Run fuzz-test (AFL++ library harnesses + ASan)
        run: |
          chmod +x scripts/fuzz-test
          NESSO_FUZZ_MAX_TOTAL_TIME=60 ./scripts/fuzz-test

      - name: Upload AFL findings on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-test-findings
          path: build/fuzz/afl-out-*
          if-no-files-found: warn

  coverage:
    needs: prepare-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Conan Default Profile
        run: conan profile detect --force

      - name: Run Coverage Script
        run: |
          chmod +x scripts/code-coverage
          ./scripts/code-coverage conan/profiles/code-coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/report
          if-no-files-found: warn
