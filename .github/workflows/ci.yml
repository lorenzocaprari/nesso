        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          reg="${{ env.REGISTRY }}/${owner_lc}/nesso-build-env-el9"
          deps_hash="$(./scripts/ci/build-env-hash el9-arm64)"
          {
            echo "image=${reg}:deps-${deps_hash}-arm64"
            echo "cache_ref=${reg}:buildcache-arm64"
          } >> "${GITHUB_OUTPUT}"

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check dependency image
        id: image
        env:
          IMAGE: ${{ steps.select.outputs.image }}
        run: |
          if [ '${{ github.event_name == 'workflow_dispatch' && inputs.force_image_rebuild == true }}' != 'true' ] &&
            docker buildx imagetools inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "rebuild=false" >> "${GITHUB_OUTPUT}"
          else
            echo "rebuild=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Free disk space
        if: steps.image.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          # 40 GiB covers a cold BuildKit build of this image. Pull request
          # #120 (run 40221737043) started at 87 GiB free on a 145 GiB disk.
          # The previous free-disk action then spent 359s freeing another 31 GiB
          # the cached rebuild did not use. Below the floor, delete the three
          # large preinstalled trees in parallel. Skip apt purge and docker
          # image prune.
          floor_kb=$((40 * 1024 * 1024))
          echo "available_kib=${avail_kb} floor_kib=${floor_kb}"
          if [ "${avail_kb}" -ge "${floor_kb}" ]; then
            echo "free space already above 40GiB; not deleting"
            exit 0
          fi
          echo "free space below 40GiB; removing android, dotnet, and ghc"
          pids=()
          sudo rm -rf /usr/local/lib/android &
          pids+=("$!")
          sudo rm -rf /usr/share/dotnet &
          pids+=("$!")
          sudo rm -rf /opt/ghc &
          pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            wait "${pid}" || status=1
          done
          if [ "${status}" -ne 0 ]; then
            echo "error: removing a preinstalled tree failed" >&2
            exit 1
          fi
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "available_kib_after=${avail_kb}"
          if [ "${avail_kb}" -lt "${floor_kb}" ]; then
            echo "error: still under 40GiB after removing preinstalled trees" >&2
            exit 1
          fi

      - name: Build and push nesso-build-env-el9 arm64
        if: steps.image.outputs.rebuild == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile.el9.arm64
          platforms: linux/arm64
          push: true
          tags: ${{ steps.select.outputs.image }}
          cache-from: type=registry,ref=${{ steps.select.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.select.outputs.cache_ref }},mode=max

      - name: Verify image architecture
        env:
          IMAGE: ${{ steps.select.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}" | tee /tmp/image-inspect.txt
          grep -Eiq 'arm64|aarch64' /tmp/image-inspect.txt

      - name: Report free disk
        if: steps.image.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "available_kib_after_build=${avail_kb}"

  # Release binary on the Rocky Linux 9 image. prepare-image-el9-amd64
  # publishes nesso-build-env-el9 and skips the rebuild when the deps tag
  # already exists. NESSO_ABI_BASELINE makes packaging/scripts/build-release-binary
  # select conan/profiles/gcc-26-el9 and run scripts/check-abi-baseline.
  # There is no EL9 arm64 build lane.
  build-el9-amd64:
    needs: [prepare-image-el9-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      NESSO_ABI_BASELINE: "1"
    container:
      image: ${{ needs.prepare-image-el9-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-el9-gcc-15-Release-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-el9-gcc-15-Release-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Require the EL9 toolset
        shell: bash
        run: |
          set -euo pipefail
          uname -m | grep -qx x86_64
          g++ -dumpversion | grep -qx 15
          rpm -q --qf '%{VERSION}-%{RELEASE}\n' gcc-toolset-15-gcc | grep -qx '15.2.1-7.1.el9_8'

      - name: Build the release binary
        shell: bash
        env:
          NESSO_REQUIRE_MODEL: "1"
        run: |
          set -euo pipefail
          # actions/checkout records safe.directory under a temporary HOME
          # that later steps do not see. build-release-binary reads the
          # commit timestamp with git log.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory /__w/nesso/nesso
          ./packaging/scripts/build-release-binary "${GITHUB_WORKSPACE}/out/nesso"
          "${GITHUB_WORKSPACE}/out/nesso" -V

      - name: Run unit tests
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/junit"
          # package_deb_test invokes dpkg-deb. The EL9 image does not ship it.
          ctest --test-dir build/Release --output-on-failure -j "$(nproc)" -L unit \
            -E '^package_deb_test$' \
            --output-junit "${GITHUB_WORKSPACE}/build/junit/unit.xml"

      - name: ccache statistics
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          # Ubuntu's ccache prints "Cacheable calls". ccache 4.5 on EL9 prints
          # "Hits: <hits> / <total>" and counts only calls it could cache.
          if grep -q 'Cacheable calls:' /tmp/ccache-stats.txt; then
            cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
            uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          else
            cacheable=$(awk '$1 == "Hits:" {print $4; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
            uncacheable=$(awk '$1 == "Uncacheable:" {getline; if ($1 == "Calls:") print $2; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          fi
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo '### ccache'
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-el9-gcc-15-Release-${{ github.sha }}

      - name: Upload JUnit reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-build-el9-amd64
          path: build/junit
          if-no-files-found: warn
          retention-days: 14

  # Sanitizer lanes on the amd64 image. Each job builds and tests in one
  # container: a second checkout and an artifact round trip would cost more
  # than the short TSan run, and the two ASan suites share that shape.
  # --no-remote reuses the packages baked for gcc-26 (Release) or gcc-26-debug
  # (Debug). These profiles are not build-env hash inputs. The ccache key is
  # per lane. A pull request restores that prefix; only a push to main saves.
  # gcc-26-asan-release-amd64 is RelWithDebInfo -O2 ASan/UBSan and runs unit,
  # integration, and functional. clang-26-asan-amd64 runs the same three
  # labels; the <format> implicit-integer-sign-change ignorelist is in the
  # profile. clang-26-tsan-amd64 runs ctest -L tsan only. Those tests do not
  # open an ONNX Runtime session.
  gcc-26-asan-release-amd64:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-gcc-15-RelWithDebInfo-asan-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-gcc-15-RelWithDebInfo-asan-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      - name: Show GCC
        run: g++ --version

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26-asan-release -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Build
        id: build
        env:
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
        run: conan build . -pr:h ./conan/profiles/gcc-26-asan-release -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Require the optimised sanitizer build
        id: require
        shell: bash
        run: |
          set -euo pipefail
          commands=build/RelWithDebInfo/compile_commands.json
          grep -q -- '-fsanitize=address,undefined' "${commands}"
          if grep -q 'clang++' "${commands}"; then
            echo "error: gcc-26-asan-release compiled with clang" >&2
            exit 1
          fi
          test -x build/RelWithDebInfo/src/nesso

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: success() && steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Run unit tests
        id: unit
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/junit"
          ctest --test-dir build/RelWithDebInfo --output-on-failure -j "$(nproc)" -L unit -V \
            --output-junit "${GITHUB_WORKSPACE}/build/junit/unit.xml"

      - name: Run integration tests
        id: integration
        if: always() && !cancelled() && steps.require.outcome == 'success'
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/junit"
          ctest --test-dir build/RelWithDebInfo --output-on-failure -j "$(nproc)" -L integration -V \
            --output-junit "${GITHUB_WORKSPACE}/build/junit/integration.xml"

      - name: Run functional tests
        id: functional
        if: always() && !cancelled() && steps.require.outcome == 'success'
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/junit"
          ctest --test-dir build/RelWithDebInfo --output-on-failure -j "$(nproc)" -L functional -V \
            --output-junit "${GITHUB_WORKSPACE}/build/junit/functional.xml"

      - name: Summarize test suites
        if: always() && !cancelled() && steps.require.outcome == 'success'
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
        run: |
          {
            echo '### gcc-26-asan-release-amd64'
            echo '| suite | result |'
            echo '| --- | --- |'
            echo "| unit | ${{ steps.unit.outcome }} |"
            echo "| integration | ${{ steps.integration.outcome }} |"
            echo "| functional | ${{ steps.functional.outcome }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          go build -C scripts/ci -o /tmp/nesso-ci .
          /tmp/nesso-ci junit-summary \
            --summary "${GITHUB_STEP_SUMMARY}" \
            unit="${GITHUB_WORKSPACE}/build/junit/unit.xml" \
            integration="${GITHUB_WORKSPACE}/build/junit/integration.xml" \
            functional="${GITHUB_WORKSPACE}/build/junit/functional.xml"

      - name: Upload JUnit reports
        if: always() && !cancelled() && steps.require.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-gcc-26-asan-release-amd64
          path: build/junit
          if-no-files-found: warn
          retention-days: 14

      - name: ccache statistics
        if: always() && !cancelled() && steps.build.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo '### ccache'
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-gcc-15-RelWithDebInfo-asan-${{ github.sha }}

  clang-26-asan-amd64:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CCACHE_EXTRAFILES: ${{ github.workspace }}/conan/sanitizer/libstdcxx-format.ignorelist
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-clang-21-asan-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-clang-21-asan-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      - name: Show Clang
        run: clang++-21 --version

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/clang-26-asan -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Build
        id: build
        env:
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
        run: conan build . -pr:h ./conan/profiles/clang-26-asan -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Require Clang, libstdc++, and the format ignorelist
        id: require
        shell: bash
        run: |
          set -euo pipefail
          commands=build/Debug/compile_commands.json
          grep -q 'clang++-21' "${commands}"
          grep -q 'libstdcxx-format.ignorelist' "${commands}"
          if grep -q -- '-stdlib=libc++' "${commands}"; then
            echo "error: compile commands select libc++" >&2
            exit 1
          fi
          flag=$(grep -o -- '-fsanitize-ignorelist=[^ "]*' "${commands}" | head -1)
          path=${flag#-fsanitize-ignorelist=}
          if [[ "${path}" != /* ]]; then
            path="build/Debug/${path}"
          fi
          if [[ ! -f "${path}" ]]; then
            echo "error: ignorelist not found at ${path}" >&2
            exit 1
          fi
          echo "ignorelist: ${path}"
          ldd build/Debug/src/nesso > /tmp/nesso-ldd.txt
          cat /tmp/nesso-ldd.txt
          grep -q 'libstdc++' /tmp/nesso-ldd.txt
          if grep -q 'libc++' /tmp/nesso-ldd.txt; then
            echo "error: nesso is linked to libc++" >&2
            exit 1
          fi

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: success() && steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Run unit tests
        id: unit
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/junit"
          ctest --test-dir build/Debug --output-on-failure -j "$(nproc)" -L unit -V \
            --output-junit "${GITHUB_WORKSPACE}/build/junit/unit.xml"

      - name: Run integration tests
        id: integration
        if: always() && !cancelled() && steps.require.outcome == 'success'
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/junit"
          ctest --test-dir build/Debug --output-on-failure -j "$(nproc)" -L integration -V \
            --output-junit "${GITHUB_WORKSPACE}/build/junit/integration.xml"

      - name: Run functional tests
        id: functional
        if: always() && !cancelled() && steps.require.outcome == 'success'
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/junit"
          ctest --test-dir build/Debug --output-on-failure -j "$(nproc)" -L functional -V \
            --output-junit "${GITHUB_WORKSPACE}/build/junit/functional.xml"

      - name: Summarize test suites
        if: always() && !cancelled() && steps.require.outcome == 'success'
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
        run: |
          {
            echo '### clang-26-asan-amd64'
            echo '| suite | result |'
            echo '| --- | --- |'
            echo "| unit | ${{ steps.unit.outcome }} |"
            echo "| integration | ${{ steps.integration.outcome }} |"
            echo "| functional | ${{ steps.functional.outcome }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          go build -C scripts/ci -o /tmp/nesso-ci .
          /tmp/nesso-ci junit-summary \
            --summary "${GITHUB_STEP_SUMMARY}" \
            unit="${GITHUB_WORKSPACE}/build/junit/unit.xml" \
            integration="${GITHUB_WORKSPACE}/build/junit/integration.xml" \
            functional="${GITHUB_WORKSPACE}/build/junit/functional.xml"

      - name: Upload JUnit reports
        if: always() && !cancelled() && steps.require.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-clang-26-asan-amd64
          path: build/junit
          if-no-files-found: warn
          retention-days: 14

      - name: ccache statistics
        if: always() && !cancelled() && steps.build.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo '### ccache'
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-clang-21-asan-${{ github.sha }}

  clang-26-tsan-amd64:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      TSAN_OPTIONS: halt_on_error=1:abort_on_error=1:second_deadlock_stack=1
    # TSan places its shadow at a fixed address. When the kernel's mmap
    # entropy does not fit, the runtime calls personality(ADDR_NO_RANDOMIZE).
    # The default container seccomp blocks that syscall, so the process
    # aborts before main. On the first run scan_threads_test started and the
    # other two tsan binaries did not: the layout is random, not a race.
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --security-opt seccomp=unconfined
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-clang-21-tsan-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-clang-21-tsan-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      - name: Show Clang
        run: clang++-21 --version

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/clang-26-tsan -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Build
        id: build
        run: conan build . -pr:h ./conan/profiles/clang-26-tsan -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Require Clang, libstdc++, and ThreadSanitizer
        id: require
        shell: bash
        run: |
          set -euo pipefail
          commands=build/Release/compile_commands.json
          grep -q 'clang++-21' "${commands}"
          grep -q -- '-fsanitize=thread' "${commands}"
          if grep -q -- '-stdlib=libc++' "${commands}"; then
            echo "error: compile commands select libc++" >&2
            exit 1
          fi
          ldd build/Release/src/nesso > /tmp/nesso-ldd.txt
          cat /tmp/nesso-ldd.txt
          grep -q 'libstdc++' /tmp/nesso-ldd.txt
          if grep -q 'libc++' /tmp/nesso-ldd.txt; then
            echo "error: nesso is linked to libc++" >&2
            exit 1
          fi

      - name: Run ThreadSanitizer tests
        id: tsan
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/junit"
          ctest --test-dir build/Release --output-on-failure -j "$(nproc)" -L tsan -V \
            --output-junit "${GITHUB_WORKSPACE}/build/junit/tsan.xml"

      - name: Summarize test suites
        if: always() && !cancelled() && steps.require.outcome == 'success'
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
        run: |
          {
            echo '### clang-26-tsan-amd64'
            echo '| suite | result |'
            echo '| --- | --- |'
            echo "| tsan | ${{ steps.tsan.outcome }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          go build -C scripts/ci -o /tmp/nesso-ci .
          /tmp/nesso-ci junit-summary \
            --summary "${GITHUB_STEP_SUMMARY}" \
            tsan="${GITHUB_WORKSPACE}/build/junit/tsan.xml"

      - name: Upload JUnit reports
        if: always() && !cancelled() && steps.require.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-clang-26-tsan-amd64
          path: build/junit
          if-no-files-found: warn
          retention-days: 14

      - name: ccache statistics
        if: always() && !cancelled() && steps.build.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo '### ccache'
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-clang-21-tsan-${{ github.sha }}

  # Single status check for a ruleset on main. The check run name is the job
  # name, CI gate. needs is every other job in this file. The lint step
  # ci-gate-needs fails when a job is missing from needs or from JOB_RESULTS,
  # or when a job's if is not one of the known skip shapes. always() runs
  # this job after failures, cancellations, and skips. The result check fails
  # on failure and cancelled. A skip passes only for the docs-only path
  # filter. A skip caused by a failed or cancelled dependency does not pass.
  # The AFL++ fuzz-test and real-log soaks live in their own workflows and
  # are not Pipeline jobs.
  ci-gate:
    name: CI gate
    needs:
      - changes
      - prepare-image-amd64
      - lint
      - clang-tidy
      - cppcheck
      - build-gcc-26-amd64
      - build-gcc-26-debug-amd64
      - test-gcc-26-amd64
      - test-gcc-26-debug-amd64
      - test-gcc-26-debug-amd64-functional
      - coverage-build
      - coverage-unit
      - coverage-bdd
      - coverage
      - bench
      - determinism
      - eval-retrieval
      - build-clang-26-amd64
      - test-clang-26-amd64
      - prepare-image-arm64
      - build-gcc-26-arm64
      - test-gcc-26-arm64
      - prepare-image-el9-amd64
      - prepare-image-el9-arm64
      - build-el9-amd64
      - gcc-26-asan-release-amd64
      - clang-26-asan-amd64
      - clang-26-tsan-amd64
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Pipeline jobs
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          JOB_RESULTS: |
            changes=${{ needs.changes.result }}
            prepare-image-amd64=${{ needs.prepare-image-amd64.result }}
            lint=${{ needs.lint.result }}
            clang-tidy=${{ needs.clang-tidy.result }}
            cppcheck=${{ needs.cppcheck.result }}
            build-gcc-26-amd64=${{ needs.build-gcc-26-amd64.result }}
            build-gcc-26-debug-amd64=${{ needs.build-gcc-26-debug-amd64.result }}
            test-gcc-26-amd64=${{ needs.test-gcc-26-amd64.result }}
            test-gcc-26-debug-amd64=${{ needs.test-gcc-26-debug-amd64.result }}
            test-gcc-26-debug-amd64-functional=${{ needs.test-gcc-26-debug-amd64-functional.result }}
            coverage-build=${{ needs.coverage-build.result }}
            coverage-unit=${{ needs.coverage-unit.result }}
            coverage-bdd=${{ needs.coverage-bdd.result }}
            coverage=${{ needs.coverage.result }}
            bench=${{ needs.bench.result }}
            determinism=${{ needs.determinism.result }}
            eval-retrieval=${{ needs.eval-retrieval.result }}
            build-clang-26-amd64=${{ needs.build-clang-26-amd64.result }}
            test-clang-26-amd64=${{ needs.test-clang-26-amd64.result }}
            prepare-image-arm64=${{ needs.prepare-image-arm64.result }}
            build-gcc-26-arm64=${{ needs.build-gcc-26-arm64.result }}
            test-gcc-26-arm64=${{ needs.test-gcc-26-arm64.result }}
            prepare-image-el9-amd64=${{ needs.prepare-image-el9-amd64.result }}
            prepare-image-el9-arm64=${{ needs.prepare-image-el9-arm64.result }}
            build-el9-amd64=${{ needs.build-el9-amd64.result }}
            gcc-26-asan-release-amd64=${{ needs.gcc-26-asan-release-amd64.result }}
            clang-26-asan-amd64=${{ needs.clang-26-asan-amd64.result }}
            clang-26-tsan-amd64=${{ needs.clang-26-tsan-amd64.result }}
        run: go run -C scripts/ci . ci-gate
