  # Coverage builds once, then unit/integration and four bdd feature shards run
  # in parallel and upload raw lcov traces. The coverage job merges with
  # lcov -a, applies the same exclusions and floors, uploads Codecov once, and
  # runs the patch gate. Shards are balanced by scenario count (~35/35/28/27).
  coverage-build:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      actions: write
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build coverage tree
        env:
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
          NESSO_WERROR: "1"
        run: |
          chmod +x scripts/code-coverage
          ./scripts/code-coverage --mode build conan/profiles/code-coverage

      - name: Pack coverage build
        run: ./scripts/ci/ci-build-archive pack-coverage build/coverage/build/Debug coverage-build

      - name: Upload coverage build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-build
          path: coverage-build.tar.*
          if-no-files-found: error
          retention-days: 3

  coverage-unit:
    needs: [prepare-image-amd64, coverage-build, changes]
    if: >-
      ${{ always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      needs.coverage-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      actions: write
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Download coverage build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-build

      - name: Extract coverage build
        run: ./scripts/ci/ci-build-archive unpack coverage-build

      - name: Run unit and integration under coverage
        env:
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
        run: |
          chmod +x scripts/code-coverage
          find build/coverage/build/Debug -name '*.gcda' -delete
          ./scripts/code-coverage --mode test --ctest-arg -E --ctest-arg '^bdd$'
          mkdir -p build/coverage/shards
          ./scripts/code-coverage --mode capture --info build/coverage/shards/unit.info

      - name: Upload unit coverage trace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-trace-unit
          path: build/coverage/shards/unit.info
          if-no-files-found: error
          retention-days: 3

  coverage-bdd:
    needs: [prepare-image-amd64, coverage-build, changes]
    if: >-
      ${{ always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      needs.coverage-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: grep
            paths: features/grep.feature
          - id: errors
            paths: features/errors.feature
          - id: archives-index
            paths: features/archives.feature features/index_search.feature
          - id: rest
            paths: features/group.feature features/hybrid_mode.feature features/harness.feature features/inputs.feature
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Download coverage build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-build

      - name: Extract coverage build
        run: ./scripts/ci/ci-build-archive unpack coverage-build

      - name: Run bdd shard under coverage
        env:
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
          NESSO_GODOG_PATHS: ${{ matrix.paths }}
          NESSO_GODOG_FORMAT: progress
        run: |
          chmod +x scripts/code-coverage
          find build/coverage/build/Debug -name '*.gcda' -delete
          ./scripts/code-coverage --mode test --ctest-arg -R --ctest-arg '^bdd$'
          mkdir -p build/coverage/shards
          ./scripts/code-coverage --mode capture --info "build/coverage/shards/${{ matrix.id }}.info"

      - name: Upload bdd coverage trace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-trace-bdd-${{ matrix.id }}
          path: build/coverage/shards/${{ matrix.id }}.info
          if-no-files-found: error
          retention-days: 3

  coverage:
    needs: [prepare-image-amd64, coverage-build, coverage-unit, coverage-bdd, changes]
    if: >-
      ${{ always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      needs.coverage-build.result == 'success' &&
      needs.coverage-unit.result == 'success' &&
      needs.coverage-bdd.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      actions: write
      id-token: write
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The patch gate diffs the pull request base. History here is small,
          # and depth 0 keeps that commit local without a second fetch.
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage traces
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-trace-*
          path: build/coverage/shards
          merge-multiple: true

      - name: Merge coverage traces and check floors
        # Arrays and [[ ]] need bash; the image's /bin/sh is dash.
        shell: bash
        run: |
          chmod +x scripts/code-coverage
          merge_args=()
          for trace in build/coverage/shards/*.info; do
            merge_args+=(--merge "${trace}")
          done
          if [[ ${#merge_args[@]} -eq 0 ]]; then
            echo "no coverage traces downloaded" >&2
            exit 1
          fi
          ./scripts/code-coverage --mode merge "${merge_args[@]}"

      # The Codecov CLI checks its download with gpg, which needs gpg-agent.
      # software-properties-common does not pull gnupg. The image can have gpg
      # without gpg-agent. Install gnupg when either binary is absent.
      # Pull requests and pushes to main only, after the floor script has written
      # the cleaned trace. Same-repo runs authenticate with OIDC. The action
      # itself skips OIDC on a fork and uploads tokenless (public repos accept
      # that on an owner:branch name). Dependabot gets neither an OIDC token
      # nor Actions secrets, so use_oidc is off for that actor and the token
      # input is empty unless a Dependabot CODECOV_TOKEN secret exists.
      # fail_ci_if_error is false so a missing app or token does not fail CI.
      # Schedule and workflow_dispatch do not upload.
      # plugins: noop turns off the gcov plugin. files and disable_search
      # already select the cleaned trace, so gcov must not walk .gcno files.
      - name: Ensure gpg for Codecov
        if: success() && (github.event_name == 'pull_request' || github.event_name == 'push')
        run: |
          if ! command -v gpg >/dev/null 2>&1 || ! command -v gpg-agent >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y --no-install-recommends gnupg
          fi

      - name: Upload coverage to Codecov
        if: success() && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: ${{ github.actor != 'dependabot[bot]' }}
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/coverage.cleaned
          disable_search: true
          fail_ci_if_error: false
          disable_telem: true
          cleanup: true
          plugins: noop

      # Pull requests only. Reuses the lcov trace from the floor step, so the
      # added work is the checkout history plus a line lookup. The bar is 80%
      # of changed executable lines under src/. That sits under the tree-wide
      # line floor: an untested function fails here, and a change that pulls
      # the whole tree under the floor still fails there. No executable src/
      # lines (docs, CI, tests) passes. Other events skip this step.
      - name: Patch coverage
        if: always() && !cancelled() && github.event_name == 'pull_request'
        shell: bash
        env:
          PATCH_BASE: ${{ github.event.pull_request.base.sha }}
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
        run: |
          set -euo pipefail
          # Checkout records safe.directory under a temporary HOME. Later steps
          # use the job HOME, so mark the workspace before git diff.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory /__w/nesso/nesso
          if [[ ! -s build/coverage/coverage.cleaned ]]; then
            echo "patch coverage skipped: coverage trace was not produced"
            exit 0
          fi
          if [[ ! "$PATCH_BASE" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "patch coverage: base SHA is not 40 hex characters" >&2
            exit 1
          fi
          if ! git cat-file -e "${PATCH_BASE}^{commit}"; then
            git fetch --no-tags --depth=1 origin "$PATCH_BASE"
            git cat-file -e "${PATCH_BASE}^{commit}"
          fi
          mkdir -p build/coverage/report
          go build -C scripts/ci -o /tmp/nesso-ci .
          /tmp/nesso-ci patch-coverage \
            --lcov build/coverage/coverage.cleaned \
            --repo "${GITHUB_WORKSPACE}" \
            --base "$PATCH_BASE" \
            --head HEAD \
            --prefix src \
            --threshold 80 \
            | tee build/coverage/report/patch.md

      - name: Upload Coverage Report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: build/coverage/report
          if-no-files-found: warn

  # Gates a merge. Pull requests run 1k and 10k. Pushes to main, the nightly
  # schedule, and workflow_dispatch also run 100k. The baseline is the committed
  # bench/baseline.json. go run -C scripts/ci . bench-baseline rewrites it from
  # result JSON, keeping the slower wall time of each tier.
  #
  # That file is the slowest measured sample of each tier on ubuntu-latest.
  # Samples of that slower class stayed within about 12% on wall time. Peak RSS
  # across both runner classes stayed within about 7%. The limits below sit
  # above that spread. A missing baseline file fails the job.
  #
  # The same job runs threadScaleLines (scripts/ci) once with NESSO_THREADS=1
  # and once with NESSO_THREADS=4. bench-scale fails when the speedup is below
  # threadScaleMinRatio. The summary lists lines/s for every tier and that ratio.
  bench:
    needs: [prepare-image-amd64, build-gcc-26-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      NESSO_BENCH_WALL_TOLERANCE: "0.35"
      NESSO_BENCH_RSS_TOLERANCE: "0.15"
      NESSO_BENCH_SIZES: ${{ github.event_name == 'pull_request' && '1000,10000' || '1000,10000,100000' }}
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Download Release build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build

      - name: Extract Release build
        run: ./scripts/ci/ci-build-archive unpack release-build

      - name: Run end-to-end benchmark
        run: |
          # Cap address space at 3/4 of RAM so an oversized embed batch fails
          # inside nesso instead of triggering the runner's OOM killer.
          mem_kb=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          export NESSO_BENCH_AS_LIMIT_KB=$((mem_kb * 3 / 4))
          python3 scripts/bench --binary build/Release/src/nesso --timeout 300 \
            --sizes "${NESSO_BENCH_SIZES}" \
            --output bench/results/ci.json

      # threadScaleLines in scripts/ci. One small grep, twice, on this runner.
      - name: Run thread-scaling benchmark
        if: always() && !cancelled()
        run: |
          mem_kb=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          export NESSO_BENCH_AS_LIMIT_KB=$((mem_kb * 3 / 4))
          NESSO_THREADS=1 python3 scripts/bench --binary build/Release/src/nesso --timeout 180 \
            --sizes 4000 \
            --output bench/results/threads-1.json
          NESSO_THREADS=4 python3 scripts/bench --binary build/Release/src/nesso --timeout 180 \
            --sizes 4000 \
            --output bench/results/threads-4.json

      - name: Compare against pinned baseline
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s bench/baseline.json ]]; then
            echo "bench: missing bench/baseline.json" >&2
            exit 1
          fi
          if [[ ! -s bench/results/ci.json ]]; then
            echo "bench: missing bench/results/ci.json" >&2
            exit 1
          fi
          python3 scripts/bench-compare \
            --baseline bench/baseline.json \
            --result bench/results/ci.json | tee bench/results/compare.txt

      - name: Check thread scaling
        if: always() && !cancelled()
        shell: bash
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
        run: |
          set -euo pipefail
          go build -C scripts/ci -o /tmp/nesso-ci .
          /tmp/nesso-ci bench-scale \
            --one bench/results/threads-1.json \
            --four bench/results/threads-4.json | tee bench/results/scale.txt

      - name: Write benchmark summary
        if: always() && !cancelled()
        shell: bash
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
        run: |
          set -euo pipefail
          if [[ ! -s bench/results/ci.json ]]; then
            {
              echo '### Benchmark'
              echo
              echo 'No benchmark result file.'
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [[ ! -x /tmp/nesso-ci ]]; then
            go build -C scripts/ci -o /tmp/nesso-ci .
          fi
          args=(bench-summary --result bench/results/ci.json)
          if [[ -s bench/results/threads-1.json && -s bench/results/threads-4.json ]]; then
            args+=(--one bench/results/threads-1.json --four bench/results/threads-4.json)
          fi
          /tmp/nesso-ci "${args[@]}"
          if [[ -s bench/results/compare.txt ]]; then
            {
              echo
              echo '### Benchmark versus pinned baseline'
              echo
              echo '```'
              cat bench/results/compare.txt
              echo '```'
            } >>"${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench/results/
          if-no-files-found: warn

  # fp32 and the default int8 policy gate the job. Pull requests set
  # NESSO_DETERMINISM_MODE=pr (256-line input, 2 runs, 2 index runs).
  # Push, schedule, and workflow_dispatch keep the full gate. int8 with
  # NESSO_THREADS=$(nproc) stays report-only: that override is one
  # single-thread session per logical CPU and skips the RAM cap.
  determinism:
    needs: [prepare-image-amd64, build-gcc-26-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NESSO_DETERMINISM_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore int8 MiniLM
        id: int8
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch int8 MiniLM
        if: steps.int8.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models int8

      - name: Restore fp32 MiniLM
        id: fp32
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models-fp32
          key: minilm-fp32-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch fp32 MiniLM
        if: steps.fp32.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models-fp32 fp32

      - name: Download Release build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build

      - name: Extract Release build
        run: ./scripts/ci/ci-build-archive unpack release-build

      - name: Write determinism input
        run: ./scripts/check-determinism --emit-input determinism-input.log

      - name: Gate fp32 determinism
        shell: bash
        run: |
          set -euo pipefail
          args=(
            ./scripts/check-determinism
            --binary build/Release/src/nesso
            --model-dir models-fp32
            --input determinism-input.log
          )
          if [[ "${NESSO_DETERMINISM_MODE}" == "full" ]]; then
            args+=(--index-runs 3)
          fi
          "${args[@]}"

      - name: Gate int8 determinism
        shell: bash
        run: |
          set -euo pipefail
          args=(
            ./scripts/check-determinism
            --binary build/Release/src/nesso
            --model-dir models
            --input determinism-input.log
          )
          if [[ "${NESSO_DETERMINISM_MODE}" == "full" ]]; then
            args+=(--index-runs 3)
          fi
          "${args[@]}"

      - name: Report int8 determinism at nproc sessions
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status=0
          args=(
            ./scripts/check-determinism
            --binary build/Release/src/nesso
            --model-dir models
            --input determinism-input.log
          )
          if [[ "${NESSO_DETERMINISM_MODE}" == "full" ]]; then
            args+=(--index-runs 3)
          fi
          NESSO_THREADS="$(nproc)" "${args[@]}" >int8-nproc-determinism.txt 2>&1 || status=$?
          cat int8-nproc-determinism.txt
          {
            echo '### int8 determinism, one single-thread session per logical CPU (report only)'
            echo '```'
            cat int8-nproc-determinism.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

  # Retrieval quality gate. Scores the Release binary with nesso-bench at
  # NESSO_BENCH_REF (nesso only, dev queries: Loghub 2k seed sets, the Hadoop,
  # OpenStack, and HealthApp sets, and the BGL 100k needle window) and uploads
  # the reports as eval-pipeline. A pull request compares with the reports of
  # the push run of its merge base on main. nesso's output is byte-identical,
  # so the comparison is exact. It fails when a nesso ranker's per-query MRR
  # or nDCG@10 got worse beyond noise on an unchanged query set
  # (eval-retrieval-compare --fail-on-worse). The label eval-regression-accepted
  # turns that into a warning; it is read when the job runs, so add it and
  # re-run the job. Without a merge-base report the job compares with the
  # latest push run on main and only warns. A push to main compares with its
  # parent and only warns.
  eval-retrieval:
    needs: [prepare-image-amd64, build-gcc-26-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      actions: read
      pull-requests: read
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout nesso-bench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.NESSO_BENCH_REPOSITORY }}
          ref: ${{ env.NESSO_BENCH_REF }}
          path: nesso-bench
          persist-credentials: false

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      # Eval retrieval (eval-retrieval.yml) saves these caches nightly.
      - name: Restore Loghub 2k inputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nesso-bench/build/bench/HDFS_2k.log
            nesso-bench/build/bench/HDFS_2k.log_structured.csv
            nesso-bench/build/bench/BGL_2k.log
            nesso-bench/build/bench/BGL_2k.log_structured.csv
            nesso-bench/build/bench/Thunderbird_2k.log
            nesso-bench/build/bench/Thunderbird_2k.log_structured.csv
            nesso-bench/build/bench/OpenSSH_2k.log
            nesso-bench/build/bench/OpenSSH_2k.log_structured.csv
            nesso-bench/build/bench/Linux_2k.log
            nesso-bench/build/bench/Linux_2k.log_structured.csv
            nesso-bench/build/bench/Apache_2k.log
            nesso-bench/build/bench/Apache_2k.log_structured.csv
          key: loghub-all-2k-${{ hashFiles('nesso-bench/scripts/fetch-loghub') }}

      - name: Restore Loghub format inputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nesso-bench/build/bench/Hadoop_2k.log
            nesso-bench/build/bench/Hadoop_2k.log_structured.csv
            nesso-bench/build/bench/OpenStack_2k.log
            nesso-bench/build/bench/OpenStack_2k.log_structured.csv
            nesso-bench/build/bench/HealthApp_2k.log
            nesso-bench/build/bench/HealthApp_2k.log_structured.csv
          key: loghub-all-formats-${{ hashFiles('nesso-bench/scripts/fetch-loghub') }}

      - name: Restore BGL needle window
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nesso-bench/build/bench/BGL_loghub2_4100001_100000.log
            nesso-bench/build/bench/BGL_loghub2_4100001_100000.labels
          key: loghub2-bgl-needle-100k-${{ hashFiles('nesso-bench/scripts/fetch-loghub') }}

      # Each keeps a restored input that matches its pin and downloads the rest.
      - name: Fetch Loghub inputs
        run: |
          set -euo pipefail
          python3 nesso-bench/scripts/fetch-loghub --dataset all-2k
          python3 nesso-bench/scripts/fetch-loghub --dataset all-formats
          python3 nesso-bench/scripts/fetch-loghub --dataset bgl-loghub2 --window 4100001:100000

      - name: Download Release build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build

      - name: Extract Release build
        run: ./scripts/ci/ci-build-archive unpack release-build

      # Modes match docs/benchmarks.md and nesso-bench scorecard (no hybrid).
      # --jobs 4 runs search processes in parallel with NESSO_THREADS=1.
      - name: Score nesso
        run: |
          set -euo pipefail
          mkdir -p build/eval/current
          common=(--engine nesso --split dev --modes auto,dense,lexical --jobs 4
            --binary build/Release/src/nesso --model-dir models)
          python3 nesso-bench/scripts/eval-retrieval --dataset all-2k "${common[@]}" \
            --out build/eval/current/all_2k.json
          python3 nesso-bench/scripts/eval-retrieval --dataset all-formats "${common[@]}" \
            --out build/eval/current/formats.json
          python3 nesso-bench/scripts/eval-retrieval --dataset bgl-needle-100k \
            --skip-fetch "${common[@]}" --out build/eval/current/needle.json

      # A pull request's merge base and every push run upload eval-pipeline,
      # so later runs can compare with it.
      - name: Upload eval reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-pipeline
          path: build/eval/current/
          retention-days: 90
          if-no-files-found: error

      # curl and jq: the build image has no gh. kind is merge-base (pull
      # request), parent (push), fallback (latest push run on main with the
      # reports), or none.
      - name: Find the baseline reports
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          api() {
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/$1"
          }
          # The id of the newest push run on main for $1 that kept eval-pipeline.
          run_with_reports() {
            local run
            for run in $(api "actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$1&per_page=5" | jq -r '.workflow_runs[].id'); do
              if [[ -n "$(api "actions/runs/${run}/artifacts?name=eval-pipeline" | jq -r '.artifacts[] | select(.expired | not) | .id' | head -n 1)" ]]; then
                echo "${run}"
                return 0
              fi
            done
            return 0
          }
          kind=none
          sha=""
          run=""
          case "${EVENT_NAME}" in
            pull_request)
              sha="$(api "compare/${PR_BASE_SHA}...${PR_HEAD_SHA}" | jq -r '.merge_base_commit.sha')" || sha=""
              kind=merge-base
              ;;
            push)
              sha="${PUSH_BEFORE}"
              kind=parent
              ;;
          esac
          if [[ -n "${sha}" && "${sha}" != "0000000000000000000000000000000000000000" ]]; then
            run="$(run_with_reports "${sha}")"
          fi
          if [[ -z "${run}" && "${kind}" != "none" ]]; then
            kind=fallback
            sha=""
            for candidate in $(api "actions/workflows/ci.yml/runs?event=push&branch=main&per_page=20" | jq -r --arg self "${GITHUB_RUN_ID}" '.workflow_runs[] | select((.id | tostring) != $self) | "\(.id):\(.head_sha)"'); do
              if [[ -n "$(api "actions/runs/${candidate%%:*}/artifacts?name=eval-pipeline" | jq -r '.artifacts[] | select(.expired | not) | .id' | head -n 1)" ]]; then
                run="${candidate%%:*}"
                sha="${candidate##*:}"
                break
              fi
            done
            [[ -n "${run}" ]] || kind=none
          fi
          echo "kind=${kind}" >> "${GITHUB_OUTPUT}"
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "eval baseline: ${kind} ${sha} (run ${run:-none})"

      - name: Download baseline reports
        if: steps.baseline.outputs.run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eval-pipeline
          path: build/eval/base
          run-id: ${{ steps.baseline.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare with the baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASELINE_KIND: ${{ steps.baseline.outputs.kind }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          short="${BASELINE_SHA:0:7}"
          case "${BASELINE_KIND}" in
            merge-base) about="the merge base ${short}" ;;
            parent) about="the parent commit ${short}" ;;
            fallback) about="the latest push run on main (${short}), not the merge base: report only" ;;
            *) about="" ;;
          esac
          {
            echo "### Retrieval quality (nesso, dev queries)"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ -z "${about}" ]]; then
            echo "No baseline reports to compare with." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo "Compared with ${about}." >> "${GITHUB_STEP_SUMMARY}"
          gate=false
          if [[ "${EVENT_NAME}" == "pull_request" && "${BASELINE_KIND}" == "merge-base" ]]; then
            gate=true
          fi
          worse=0
          for report in all_2k formats needle; do
            if [[ ! -f "build/eval/base/${report}.json" ]]; then
              echo "::warning::the baseline has no ${report}.json"
              continue
            fi
            args=(--current "build/eval/current/${report}.json" --previous "build/eval/base/${report}.json")
            if [[ "${gate}" == "true" ]]; then
              args+=(--fail-on-worse)
            fi
            status=0
            python3 nesso-bench/scripts/eval-retrieval-compare "${args[@]}" > "build/eval/compare-${report}.txt" || status=$?
            if [[ "${status}" -ne 0 && "${status}" -ne 3 ]]; then
              cat "build/eval/compare-${report}.txt"
              exit "${status}"
            fi
            {
              echo
              echo "#### ${report}"
              echo
              # The full table lists every metric; the per-query section and the
              # DROP and WORSE lines are what changed.
              sed -n '/^#### MRR change by query/,$p' "build/eval/compare-${report}.txt"
              grep -E '^(DROP|WORSE) ' "build/eval/compare-${report}.txt" | sed 's/^/    /' || true
            } >> "${GITHUB_STEP_SUMMARY}"
            # Annotations only for WORSE lines: DROP lines, one per metric, stay
            # in the summary so they do not crowd out the ones that matter.
            while IFS= read -r line; do
              echo "::warning::${line}"
            done < <(grep -E '^WORSE ' "build/eval/compare-${report}.txt" || true)
            if [[ "${status}" -eq 3 ]]; then
              worse=1
            fi
          done
          if [[ "${worse}" -eq 0 ]]; then
            echo "No nesso ranker got worse beyond noise." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          labels="$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -r '.labels[].name')" || labels=""
          if grep -qx 'eval-regression-accepted' <<< "${labels}"; then
            echo "Retrieval quality got worse; the pull request has eval-regression-accepted, so this is a warning." >> "${GITHUB_STEP_SUMMARY}"
            echo "::warning::retrieval quality got worse beyond noise (accepted by label)"
            exit 0
          fi
          {
            echo
            echo "Retrieval quality got worse beyond noise (WORSE lines above). If the trade-off is intended, add the label eval-regression-accepted and re-run this job."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::retrieval quality got worse beyond noise; see the job summary"
          exit 1

  # Clang 21 compiles nesso against the gcc-built libstdc++ packages
  # already in nesso-build-env (see conan/profiles/clang-26). libc++ is
  # not used: it is a different ABI from those static archives.
  build-clang-26-amd64:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-clang-21-Release-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-clang-21-Release-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      - name: Show Clang
        run: clang++-21 --version

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/clang-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Build
        env:
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
        run: conan build . -pr:h ./conan/profiles/clang-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote $CONAN_WERROR_ARGS

      - name: Require Clang and libstdc++
        run: |
          set -euo pipefail
          toolchain="build/Release/generators/conan_toolchain.cmake"
          commands="build/Release/compile_commands.json"
          grep -q 'clang++-21' "${toolchain}"
          grep -q 'clang++-21' "${commands}"
          if grep -q -- '-stdlib=libc++' "${commands}"; then
            echo "error: compile commands select libc++" >&2
            exit 1
          fi
          ldd build/Release/src/nesso > /tmp/nesso-ldd.txt
          cat /tmp/nesso-ldd.txt
          grep -q 'libstdc++' /tmp/nesso-ldd.txt
          if grep -q 'libc++' /tmp/nesso-ldd.txt; then
            echo "error: nesso is linked to libc++" >&2
            exit 1
          fi

      - name: ccache statistics
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
