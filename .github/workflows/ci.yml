name: Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # 03:17 UTC, off the hour so the nightly run misses the :00 cron pile-up.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force_image_rebuild:
        description: Force rebuild of nesso-build-env even if inputs are unchanged
        type: boolean
        default: false

# Cancel a PR run when a newer push supersedes it. Push and schedule runs
# (main and any tag ref) are left running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  CONAN_HOME: /opt/conan2

# Read-only default. Jobs that pull nesso-build-env keep packages: read.
# prepare-image-amd64 and prepare-image-arm64 override packages to write so a
# same-repo rebuild can push deps-<hash> and the BuildKit registry cache.
# lint overrides to contents: read. It does not pull the image.
permissions:
  contents: read
  packages: read

jobs:
  # Docs-only pull requests skip heavy jobs via this output. Job-level if,
  # not on.paths: a workflow that never starts leaves required checks pending,
  # and GitHub treats a skipped job as success. An explicit false is the only
  # skip. Push, schedule, workflow_dispatch, and a tag push run every heavy
  # job. Paths outside *.md, docs/, LICENSE, and .github/ISSUE_TEMPLATE count
  # as code.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.gate.outputs.code }}
    steps:
      - name: Checkout Repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'

      - name: Decide whether heavy jobs run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            code=true
          elif [ "${FILTER_CODE}" = "false" ]; then
            code=false
          else
            code=true
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "heavy_jobs=${code}"

  prepare-image-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.select.outputs.image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image reference
        id: select
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          reg="${{ env.REGISTRY }}/${owner_lc}/nesso-build-env"
          # Shared with prepare-image-arm64 and release.yml.
          deps_hash="$(./scripts/build-env-hash amd64)"
          # Existing tag. buildcache-arm64 is the arm64 twin. Renaming this
          # would orphan the populated amd64 registry cache.
          cache_ref="${reg}:buildcache"
          {
            echo "image=${reg}:deps-${deps_hash}"
            echo "cache_ref=${cache_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check dependency image
        id: image
        run: |
          if [ '${{ github.event_name == 'workflow_dispatch' && inputs.force_image_rebuild == true }}' != 'true' ] &&
            docker buildx imagetools inspect '${{ steps.select.outputs.image }}' >/dev/null 2>&1; then
            echo "rebuild=false" >> "${GITHUB_OUTPUT}"
          else
            echo "rebuild=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Free disk space
        if: steps.image.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          # 40 GiB covers a cold BuildKit build of this image. Pull request
          # #120 (run 40221737043) started at 87 GiB free on a 145 GiB disk.
          # The previous free-disk action then spent 359s freeing another 31 GiB
          # the cached rebuild did not use. Below the floor, delete the three
          # large preinstalled trees in parallel. Skip apt purge and docker
          # image prune.
          floor_kb=$((40 * 1024 * 1024))
          echo "available_kib=${avail_kb} floor_kib=${floor_kb}"
          if [ "${avail_kb}" -ge "${floor_kb}" ]; then
            echo "free space already above 40GiB; not deleting"
            exit 0
          fi
          echo "free space below 40GiB; removing android, dotnet, and ghc"
          pids=()
          sudo rm -rf /usr/local/lib/android &
          pids+=("$!")
          sudo rm -rf /usr/share/dotnet &
          pids+=("$!")
          sudo rm -rf /opt/ghc &
          pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            wait "${pid}" || status=1
          done
          if [ "${status}" -ne 0 ]; then
            echo "error: removing a preinstalled tree failed" >&2
            exit 1
          fi
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "available_kib_after=${avail_kb}"
          if [ "${avail_kb}" -lt "${floor_kb}" ]; then
            echo "error: still under 40GiB after removing preinstalled trees" >&2
            exit 1
          fi

      - name: Build and push nesso-build-env
        if: steps.image.outputs.rebuild == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.select.outputs.image }}
          cache-from: type=registry,ref=${{ steps.select.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.select.outputs.cache_ref }},mode=max

      - name: Report free disk
        if: steps.image.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "available_kib_after_build=${avail_kb}"

  # One job, off the image. pre-commit and python3 are enough, so it starts
  # with the workflow instead of waiting on prepare-image-amd64. A docs-only
  # pull request still runs it. Later steps use always() so the failed step
  # name stays visible when an earlier step fails. clang-tidy and cppcheck
  # stay separate jobs in the image.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        id: install
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/pre-commit-venv"
          "${RUNNER_TEMP}/pre-commit-venv/bin/pip" install pre-commit
          echo "${RUNNER_TEMP}/pre-commit-venv/bin" >> "${GITHUB_PATH}"

      - name: Format (clang-format, cmake-format)
        if: steps.install.outcome == 'success'
        run: bash scripts/lint --format-only

      - name: Hygiene (whitespace, line endings, YAML, merge markers, large files)
        if: always() && !cancelled() && steps.install.outcome == 'success'
        run: bash scripts/lint --hygiene-only

      - name: Versions (check-versions)
        if: always() && !cancelled() && steps.checkout.outcome == 'success'
        run: bash scripts/check-versions

      - name: Agent docs (check-agent-docs)
        if: always() && !cancelled() && steps.checkout.outcome == 'success'
        run: python3 scripts/check-agent-docs

  clang-tidy:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          # --no-remote: use only packages baked into nesso-build-env (avoid
          # ConanCenter recipe drift rebuilding Boost/ORT).
          conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Configure
        run: |
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run Clang-Tidy
        run: bash scripts/clang-tidy

  cppcheck:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Configure
        run: |
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run Cppcheck
        run: bash scripts/cppcheck

  build-gcc-26-amd64:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-gcc-15-Release-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-gcc-15-Release-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Build
        env:
          # Baked into the test binaries. The test job restores models/ at this
          # same workspace path, and a missing model then fails instead of skipping.
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
        run: conan build . -pr:h ./conan/profiles/gcc-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: ccache statistics
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo '### ccache'
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-gcc-15-Release-${{ github.sha }}

      - name: Archive Release build
        id: archive
        run: ./scripts/ci-build-archive pack build/Release release-build

      - name: Upload Release build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: ${{ steps.archive.outputs.archive }}
          retention-days: 1
          if-no-files-found: error
          # The tar is already gzip (or zstd). Skip a second zlib pass.
          compression-level: 0

  build-gcc-26-debug-amd64:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-gcc-15-Debug-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-gcc-15-Debug-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26-debug -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Build
        env:
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
        run: conan build . -pr:h ./conan/profiles/gcc-26-debug -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: ccache statistics
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo '### ccache'
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-gcc-15-Debug-${{ github.sha }}

      - name: Archive Debug build
        id: archive
        run: ./scripts/ci-build-archive pack build/Debug debug-build

      - name: Upload Debug build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-build
          path: ${{ steps.archive.outputs.archive }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  # The job id is the check name. There is no matrix, so a docs-only skip or
  # a failed build still reports that name. GitHub counts the skip as success.
  # functional is a step on gcc Release, Clang, and arm64. It stays its own
  # gcc Debug job: on a no-image pull request that suite is the wall-clock
  # tail (run 40200059245, +255s) and the bdd test already uses every logical
  # CPU, so appending unit and integration would lengthen it. Those three
  # lanes have slack against that tail and against coverage on the #120 image
  # rebuild (run 40221737043, coverage at +643s).
  test-gcc-26-amd64:
    needs: [prepare-image-amd64, build-gcc-26-amd64, changes]
    if: >-
      ${{ always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      needs.build-gcc-26-amd64.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Download Release build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build

      - name: Extract Release build
        id: extract
        run: ./scripts/ci-build-archive unpack release-build

      - name: Run unit tests
        id: unit
        run: ctest --test-dir build/Release --output-on-failure -j "$(nproc)" -L unit -V

      - name: Run integration tests
        id: integration
        if: always() && !cancelled() && steps.extract.outcome == 'success'
        run: ctest --test-dir build/Release --output-on-failure -j "$(nproc)" -L integration -V

      - name: Run functional tests
        id: functional
        if: always() && !cancelled() && steps.extract.outcome == 'success'
        run: ctest --test-dir build/Release --output-on-failure -j "$(nproc)" -L functional -V

      - name: Summarize test suites
        if: always() && !cancelled()
        run: |
          {
            echo '### test-gcc-26-amd64'
            echo '| suite | result |'
            echo '| --- | --- |'
            echo "| unit | ${{ steps.unit.outcome }} |"
            echo "| integration | ${{ steps.integration.outcome }} |"
            echo "| functional | ${{ steps.functional.outcome }} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  test-gcc-26-debug-amd64:
    needs: [prepare-image-amd64, build-gcc-26-debug-amd64, changes]
    if: >-
      ${{ always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      needs.build-gcc-26-debug-amd64.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Download Debug build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debug-build

      - name: Extract Debug build
        id: extract
        run: ./scripts/ci-build-archive unpack debug-build

      - name: Run unit tests
        id: unit
        run: ctest --test-dir build/Debug --output-on-failure -j "$(nproc)" -L unit -V

      - name: Run integration tests
        id: integration
        if: always() && !cancelled() && steps.extract.outcome == 'success'
        run: ctest --test-dir build/Debug --output-on-failure -j "$(nproc)" -L integration -V

      - name: Summarize test suites
        if: always() && !cancelled()
        run: |
          {
            echo '### test-gcc-26-debug-amd64'
            echo '| suite | result |'
            echo '| --- | --- |'
            echo "| unit | ${{ steps.unit.outcome }} |"
            echo "| integration | ${{ steps.integration.outcome }} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  test-gcc-26-debug-amd64-functional:
    needs: [prepare-image-amd64, build-gcc-26-debug-amd64, changes]
    if: >-
      ${{ always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      needs.build-gcc-26-debug-amd64.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Download Debug build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debug-build

      - name: Extract Debug build
        id: extract
        run: ./scripts/ci-build-archive unpack debug-build

      - name: Run functional tests
        id: functional
        run: ctest --test-dir build/Debug --output-on-failure -j "$(nproc)" -L functional -V

      - name: Summarize test suites
        if: always() && !cancelled()
        run: |
          {
            echo '### test-gcc-26-debug-amd64-functional'
            echo '| suite | result |'
            echo '| --- | --- |'
            echo "| functional | ${{ steps.functional.outcome }} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  fuzz-test:
    needs: prepare-image-amd64
    # ClusterFuzzLite already fuzzes every pull request. This AFL++ job is
    # about three minutes and runs beside the other jobs, so keep it on main
    # pushes and the nightly schedule. It builds the LTO harnesses
    # ClusterFuzzLite does not. The job id stays fuzz-test. The amd64 image
    # already has afl++, Clang 21, the compiler-rt symlinks, lld-21, and llvm-21.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure Conan default profile
        run: conan profile detect --force

      - name: Run fuzz-test (AFL++ library harnesses + ASan)
        run: |
          chmod +x scripts/fuzz-test
          NESSO_FUZZ_MAX_TOTAL_TIME=60 ./scripts/fuzz-test

      # upload-artifact rejects ':' in paths, and every AFL finding is named id:NNNNNN,...
      - name: Collect AFL crashes
        if: failure()
        run: |
          mkdir -p build/fuzz/findings
          for crash in build/fuzz/afl-out-*/default/crashes/id:*; do
            [ -f "${crash}" ] || continue
            target="$(basename "$(dirname "$(dirname "$(dirname "${crash}")")")")"
            cp "${crash}" "build/fuzz/findings/${target}_$(basename "${crash}" | tr ':,' '__')"
          done

      - name: Upload AFL findings on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-test-findings
          path: build/fuzz/findings
          if-no-files-found: warn

  coverage:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: write
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Create Conan Default Profile
        run: conan profile detect --force

      - name: Run Coverage Script
        env:
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
        run: |
          chmod +x scripts/code-coverage
          ./scripts/code-coverage conan/profiles/code-coverage

      - name: Upload Coverage Report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: build/coverage/report
          if-no-files-found: warn

  # Gates a merge. Pull requests run 1k and 10k. Pushes to main, the nightly
  # schedule, and workflow_dispatch also run 100k. The baseline is the latest
  # result saved from a non-PR run of this workflow.
  #
  # Across 13 PR runs on 2026-10-25, one tier's wall time varied by up to 4.51x
  # (two runner speed classes) while peak RSS stayed within 1.05x. Wall limit
  # is 5.50x so that spread passes; RSS limit is 1.20x. A missing baseline warns.
  bench:
    needs: [prepare-image-amd64, build-gcc-26-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      NESSO_BENCH_WALL_TOLERANCE: "4.5"
      NESSO_BENCH_RSS_TOLERANCE: "0.20"
      NESSO_BENCH_SIZES: ${{ github.event_name == 'pull_request' && '1000,10000' || '1000,10000,100000' }}
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Download Release build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build

      - name: Extract Release build
        run: ./scripts/ci-build-archive unpack release-build

      - name: Restore main benchmark baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench/main-baseline
          # Unique primary key so each non-PR run can save. Restore picks the
          # newest bench-baseline-* entry, which non-PR runs write below.
          key: bench-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bench-baseline-

      - name: Run end-to-end benchmark
        run: |
          # Cap address space at 3/4 of RAM so an oversized embed batch fails
          # inside nesso instead of triggering the runner's OOM killer.
          mem_kb=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          export NESSO_BENCH_AS_LIMIT_KB=$((mem_kb * 3 / 4))
          python3 scripts/bench --binary build/Release/src/nesso --timeout 300 \
            --sizes "${NESSO_BENCH_SIZES}" \
            --output bench/results/ci.json

      - name: Compare against main baseline
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 scripts/bench-compare \
            --baseline bench/main-baseline/baseline.json \
            --result bench/results/ci.json | tee bench/results/compare.txt || status=$?
          cat bench/results/compare.txt
          {
            echo '### Benchmark versus main baseline'
            echo '```'
            cat bench/results/compare.txt
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Stage main benchmark baseline
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p bench/main-baseline
          cp bench/results/ci.json bench/main-baseline/baseline.json

      - name: Save main benchmark baseline
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench/main-baseline
          key: bench-baseline-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench/results/
          if-no-files-found: warn

  # fp32 and the default int8 policy gate the job. Pull requests set
  # NESSO_DETERMINISM_MODE=pr (256-line input, 2 runs, 2 index runs).
  # Push, schedule, and workflow_dispatch keep the full gate. int8 with
  # NESSO_THREADS=$(nproc) stays report-only: that override is one
  # single-thread session per logical CPU and skips the RAM cap.
  determinism:
    needs: [prepare-image-amd64, build-gcc-26-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NESSO_DETERMINISM_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore int8 MiniLM
        id: int8
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch int8 MiniLM
        if: steps.int8.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models int8

      - name: Restore fp32 MiniLM
        id: fp32
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models-fp32
          key: minilm-fp32-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch fp32 MiniLM
        if: steps.fp32.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models-fp32 fp32

      - name: Download Release build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build

      - name: Extract Release build
        run: ./scripts/ci-build-archive unpack release-build

      - name: Write determinism input
        run: ./scripts/check-determinism --emit-input determinism-input.log

      - name: Gate fp32 determinism
        shell: bash
        run: |
          set -euo pipefail
          args=(
            ./scripts/check-determinism
            --binary build/Release/src/nesso
            --model-dir models-fp32
            --input determinism-input.log
          )
          if [[ "${NESSO_DETERMINISM_MODE}" == "full" ]]; then
            args+=(--index-runs 3)
          fi
          "${args[@]}"

      - name: Gate int8 determinism
        shell: bash
        run: |
          set -euo pipefail
          args=(
            ./scripts/check-determinism
            --binary build/Release/src/nesso
            --model-dir models
            --input determinism-input.log
          )
          if [[ "${NESSO_DETERMINISM_MODE}" == "full" ]]; then
            args+=(--index-runs 3)
          fi
          "${args[@]}"

      - name: Report int8 determinism at nproc sessions
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status=0
          args=(
            ./scripts/check-determinism
            --binary build/Release/src/nesso
            --model-dir models
            --input determinism-input.log
          )
          if [[ "${NESSO_DETERMINISM_MODE}" == "full" ]]; then
            args+=(--index-runs 3)
          fi
          NESSO_THREADS="$(nproc)" "${args[@]}" >int8-nproc-determinism.txt 2>&1 || status=$?
          cat int8-nproc-determinism.txt
          {
            echo '### int8 determinism, one single-thread session per logical CPU (report only)'
            echo '```'
            cat int8-nproc-determinism.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

  # Clang 21 compiles nesso against the gcc-built libstdc++ packages
  # already in nesso-build-env (see conan/profiles/clang-26). libc++ is
  # not used: it is a different ABI from those static archives.
  build-clang-26-amd64:
    needs: [prepare-image-amd64, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-clang-21-Release-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-clang-21-Release-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      - name: Show Clang
        run: clang++-21 --version

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/clang-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Build
        env:
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
        run: conan build . -pr:h ./conan/profiles/clang-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Require Clang and libstdc++
        run: |
          set -euo pipefail
          toolchain="build/Release/generators/conan_toolchain.cmake"
          commands="build/Release/compile_commands.json"
          grep -q 'clang++-21' "${toolchain}"
          grep -q 'clang++-21' "${commands}"
          if grep -q -- '-stdlib=libc++' "${commands}"; then
            echo "error: compile commands select libc++" >&2
            exit 1
          fi
          ldd build/Release/src/nesso > /tmp/nesso-ldd.txt
          cat /tmp/nesso-ldd.txt
          grep -q 'libstdc++' /tmp/nesso-ldd.txt
          if grep -q 'libc++' /tmp/nesso-ldd.txt; then
            echo "error: nesso is linked to libc++" >&2
            exit 1
          fi

      - name: ccache statistics
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo '### ccache'
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-clang-21-Release-${{ github.sha }}

      - name: Archive Release build
        id: archive
        run: ./scripts/ci-build-archive pack build/Release release-build-clang

      - name: Upload Release build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-clang
          path: ${{ steps.archive.outputs.archive }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  test-clang-26-amd64:
    needs: [prepare-image-amd64, build-clang-26-amd64, changes]
    if: >-
      ${{ always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      needs.build-clang-26-amd64.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.prepare-image-amd64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Download Release build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build-clang

      - name: Extract Release build
        id: extract
        run: ./scripts/ci-build-archive unpack release-build-clang

      - name: Run unit tests
        id: unit
        run: ctest --test-dir build/Release --output-on-failure -j "$(nproc)" -L unit -V

      - name: Run integration tests
        id: integration
        if: always() && !cancelled() && steps.extract.outcome == 'success'
        run: ctest --test-dir build/Release --output-on-failure -j "$(nproc)" -L integration -V

      - name: Run functional tests
        id: functional
        if: always() && !cancelled() && steps.extract.outcome == 'success'
        run: ctest --test-dir build/Release --output-on-failure -j "$(nproc)" -L functional -V

      - name: Summarize test suites
        if: always() && !cancelled()
        run: |
          {
            echo '### test-clang-26-amd64'
            echo '| suite | result |'
            echo '| --- | --- |'
            echo "| unit | ${{ steps.unit.outcome }} |"
            echo "| integration | ${{ steps.integration.outcome }} |"
            echo "| functional | ${{ steps.functional.outcome }} |"
          } >> "${GITHUB_STEP_SUMMARY}"


  # Native arm64 image. The image name stays nesso-build-env. The amd64
  # tag stays deps-<hash>; the arm64 tag appends -arm64. The amd64 job id
  # is prepare-image-amd64.
  prepare-image-arm64:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.select.outputs.image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image reference
        id: select
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          reg="${{ env.REGISTRY }}/${owner_lc}/nesso-build-env"
          deps_hash="$(./scripts/build-env-hash arm64)"
          {
            echo "image=${reg}:deps-${deps_hash}-arm64"
            echo "cache_ref=${reg}:buildcache-arm64"
          } >> "${GITHUB_OUTPUT}"

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check dependency image
        id: image
        run: |
          if [ '${{ github.event_name == 'workflow_dispatch' && inputs.force_image_rebuild == true }}' != 'true' ] &&
            docker buildx imagetools inspect '${{ steps.select.outputs.image }}' >/dev/null 2>&1; then
            echo "rebuild=false" >> "${GITHUB_OUTPUT}"
          else
            echo "rebuild=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Free disk space
        if: steps.image.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          # 40 GiB covers a cold BuildKit build of this image. Pull request
          # #120 (run 40221737043) started at 87 GiB free on a 145 GiB disk.
          # The previous free-disk action then spent 359s freeing another 31 GiB
          # the cached rebuild did not use. Below the floor, delete the three
          # large preinstalled trees in parallel. Skip apt purge and docker
          # image prune.
          floor_kb=$((40 * 1024 * 1024))
          echo "available_kib=${avail_kb} floor_kib=${floor_kb}"
          if [ "${avail_kb}" -ge "${floor_kb}" ]; then
            echo "free space already above 40GiB; not deleting"
            exit 0
          fi
          echo "free space below 40GiB; removing android, dotnet, and ghc"
          pids=()
          sudo rm -rf /usr/local/lib/android &
          pids+=("$!")
          sudo rm -rf /usr/share/dotnet &
          pids+=("$!")
          sudo rm -rf /opt/ghc &
          pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            wait "${pid}" || status=1
          done
          if [ "${status}" -ne 0 ]; then
            echo "error: removing a preinstalled tree failed" >&2
            exit 1
          fi
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "available_kib_after=${avail_kb}"
          if [ "${avail_kb}" -lt "${floor_kb}" ]; then
            echo "error: still under 40GiB after removing preinstalled trees" >&2
            exit 1
          fi

      - name: Build and push nesso-build-env arm64
        if: steps.image.outputs.rebuild == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile.arm64
          platforms: linux/arm64
          push: true
          tags: ${{ steps.select.outputs.image }}
          cache-from: type=registry,ref=${{ steps.select.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.select.outputs.cache_ref }},mode=max

      - name: Verify image architecture
        run: |
          set -euo pipefail
          docker buildx imagetools inspect '${{ steps.select.outputs.image }}' | tee /tmp/image-inspect.txt
          grep -Eiq 'arm64|aarch64' /tmp/image-inspect.txt

      - name: Report free disk
        if: steps.image.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          df -h /
          avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "available_kib_after_build=${avail_kb}"

  build-gcc-26-arm64:
    needs: [prepare-image-arm64, changes]
    if: ${{ needs.changes.outputs.code == 'true' && !cancelled() && needs.prepare-image-arm64.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    container:
      image: ${{ needs.prepare-image-arm64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-gcc-15-Release-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-gcc-15-Release-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      - name: Require an aarch64 compiler
        run: |
          set -euo pipefail
          uname -m | grep -qx aarch64
          g++-15 -dumpmachine | grep -q aarch64

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26-armv8 -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Build
        env:
          NESSO_REQUIRE_MODEL: "1"
          NESSO_REQUIRE_BDD: "1"
        run: conan build . -pr:h ./conan/profiles/gcc-26-armv8 -pr:b default --lockfile=conan.lock --build=missing --no-remote

      - name: Require an AArch64 binary
        run: |
          set -euo pipefail
          readelf -h build/Release/src/nesso | grep -q 'Machine:.*AArch64'

      - name: ccache statistics
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo '### ccache'
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-gcc-15-Release-${{ github.sha }}

      - name: Archive Release build
        id: archive
        run: ./scripts/ci-build-archive pack build/Release release-build-arm64

      - name: Upload Release build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-arm64
          path: ${{ steps.archive.outputs.archive }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  test-gcc-26-arm64:
    needs: [prepare-image-arm64, build-gcc-26-arm64, changes]
    if: >-
      ${{ always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      needs.build-gcc-26-arm64.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container:
      image: ${{ needs.prepare-image-arm64.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Download Release build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build-arm64

      - name: Extract Release build
        id: extract
        run: ./scripts/ci-build-archive unpack release-build-arm64

      - name: Run unit tests
        id: unit
        run: ctest --test-dir build/Release --output-on-failure -j "$(nproc)" -L unit -V

      - name: Run integration tests
        id: integration
        if: always() && !cancelled() && steps.extract.outcome == 'success'
        run: ctest --test-dir build/Release --output-on-failure -j "$(nproc)" -L integration -V

      - name: Run functional tests
        id: functional
        if: always() && !cancelled() && steps.extract.outcome == 'success'
        run: ctest --test-dir build/Release --output-on-failure -j "$(nproc)" -L functional -V

      - name: Summarize test suites
        if: always() && !cancelled()
        run: |
          {
            echo '### test-gcc-26-arm64'
            echo '| suite | result |'
            echo '| --- | --- |'
            echo "| unit | ${{ steps.unit.outcome }} |"
            echo "| integration | ${{ steps.integration.outcome }} |"
            echo "| functional | ${{ steps.functional.outcome }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
