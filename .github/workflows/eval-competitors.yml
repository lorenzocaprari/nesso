name: Eval competitors

# Not a Pipeline job and not in the CI gate. Scores the heavy competitor
# engines (diy-faiss, OpenSearch BM25 and k-NN, ck, vecgrep, and xerj: BM25
# match, neural, and its default semantic search) on the Loghub 2k
# seed sets and the bgl-needle-100k needle window, retrieval quality only: no
# --measure, because runner timings are too noisy to publish. Each engine runs
# in its own job; the merge job combines whatever finished into one 2k report
# and one needle report. The merged reports are the source for the committed
# reference in test/eval/reference/. Runs on workflow_dispatch, and on pull
# requests that change this workflow, the merge script, or the competitor pins.
# nesso is not built here; the eval-retrieval workflow scores it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/eval-competitors.yml"
      - "scripts/eval-retrieval-merge"
      - "bench/competitors/**"

concurrency:
  group: eval-competitors-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned competitor releases (see docs/benchmarks.md).
  CK_VERSION: "0.8.1"
  CK_SHA256: "042db74e0ed10cd5995024bc16ea9928de6aaef632ef6463b3b8812a8d1ba1ac"
  # The vecgrep release binary needs glibc 2.43 (ubuntu-24.04 has 2.39), so
  # the job builds tag v0.10.1 from its commit with the tag's Cargo.lock.
  VECGREP_REPO: "https://github.com/martintrojer/vecgrep"
  VECGREP_REV: "b257853b9202f4a170952a04ef1df7bea1b99315"
  XERJ_VERSION: "1.0.0-rc.104"
  # Static musl build: the gnu build needs glibc 2.43.
  XERJ_SHA256: "1628ee401a9a121156cc380950f9d48923e6e856458ae1e6648f0ef18db7b693"
  # xerj's neural mode is all-MiniLM-L6-v2 (it downloads these three files
  # when no local_model_dir is set). Staging them at the revision diy-faiss
  # pins makes the run reproducible and keeps it a same-model comparison.
  MINILM_REVISION: "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
  MINILM_CONFIG_SHA256: "953f9c0d463486b10a6871cc2fd59f223b2c70184f49815e7efbcab5d8908b41"
  MINILM_TOKENIZER_SHA256: "be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037"
  MINILM_MODEL_SHA256: "53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db"
  OPENSEARCH_VERSION: "3.10.0"
  OPENSEARCH_SHA512: "bbcdb9aba66e304e6759c4d3c903fde7d4269083e886ea4853f3dae01867d87287eeff5f04e6dbe84c89e684a4a1f94773b15e62d00cd06144421606212cedd9"
  PYTHONHASHSEED: "0"

jobs:
  # Fetch the Loghub inputs once, so the engine jobs do not all download the
  # Zenodo archive at the same time.
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # fetch-loghub checks every pin; a bad download is retried, not trusted.
      - name: Fetch Loghub inputs
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python3 scripts/fetch-loghub --dataset all-2k \
              && python3 scripts/fetch-loghub --dataset bgl-loghub2 --window 4100001:100000; then
              exit 0
            fi
            echo "fetch attempt ${attempt} failed; retrying" >&2
            sleep 30
          done
          exit 1

      - name: Upload Loghub inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loghub-inputs
          path: build/bench/
          retention-days: 1
          if-no-files-found: error

  score:
    name: score (${{ matrix.engine }})
    needs: [prepare]
    # Host runner, not the build container: OpenSearch refuses to run as root.
    # ubuntu-24.04 ships Python 3.12, the version diy-faiss.hashes.txt targets.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [diy-faiss, opensearch, opensearch-knn, ck, vecgrep, xerj, xerj-neural, xerj-semantic]
        # ck and vecgrep build multi-line chunk indexes that exhaust the 16 GB
        # hosted runner on the 100k needle window (the runner shuts down mid-
        # step), so they score the 2k seed sets only.
        include:
          - engine: ck
            needle: false
          - engine: vecgrep
            needle: false
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the diy-faiss stack
        if: matrix.engine == 'diy-faiss' || matrix.engine == 'opensearch-knn'
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv-diy
          .venv-diy/bin/pip install --quiet --require-hashes \
            -r bench/competitors/diy-faiss.hashes.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          echo "EVAL_PYTHON=${GITHUB_WORKSPACE}/.venv-diy/bin/python" >> "${GITHUB_ENV}"

      - name: Install OpenSearch
        if: matrix.engine == 'opensearch' || matrix.engine == 'opensearch-knn'
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          tarball="opensearch-${OPENSEARCH_VERSION}-linux-x64.tar.gz"
          curl --proto '=https' --proto-redir '=https' -fsSLO "https://artifacts.opensearch.org/releases/bundle/opensearch/${OPENSEARCH_VERSION}/${tarball}"
          echo "${OPENSEARCH_SHA512}  ${tarball}" | sha512sum -c -
          tar -xzf "${tarball}"
          rm -f "${tarball}"
          echo "OPENSEARCH_HOME=${RUNNER_TEMP}/opensearch-${OPENSEARCH_VERSION}" >> "${GITHUB_ENV}"

      - name: Install ck or vecgrep
        if: matrix.engine == 'ck' || matrix.engine == 'vecgrep'
        shell: bash
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          cd "${RUNNER_TEMP}"
          if [[ "${ENGINE}" == "ck" ]]; then
            tarball="ck-${CK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            curl --proto '=https' --proto-redir '=https' -fsSLO "https://github.com/BeaconBay/ck/releases/download/${CK_VERSION}/${tarball}"
            echo "${CK_SHA256}  ${tarball}" | sha256sum -c -
            tar -xzf "${tarball}" -C "${bin}" ./ck
          else
            cargo --version
            cargo install --locked --git "${VECGREP_REPO}" --rev "${VECGREP_REV}" --root "${RUNNER_TEMP}/vecgrep" vecgrep
            cp "${RUNNER_TEMP}/vecgrep/bin/vecgrep" "${bin}/vecgrep"
          fi
          "${bin}/${ENGINE}" --version
          echo "${bin}" >> "${GITHUB_PATH}"

      - name: Install xerj
        if: matrix.engine == 'xerj' || matrix.engine == 'xerj-neural' || matrix.engine == 'xerj-semantic'
        shell: bash
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          cd "${RUNNER_TEMP}"
          name="xerj-${XERJ_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --proto-redir '=https' -fsSLO "https://github.com/xerj-org/xerj/releases/download/v${XERJ_VERSION}/${name}.tar.gz"
          echo "${XERJ_SHA256}  ${name}.tar.gz" | sha256sum -c -
          tar -xzf "${name}.tar.gz" -C "${bin}" --strip-components=1 "${name}/xerj"
          "${bin}/xerj" -V
          echo "${bin}" >> "${GITHUB_PATH}"

      - name: Fetch the MiniLM files for xerj-neural
        if: matrix.engine == 'xerj-neural'
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/minilm"
          mkdir -p "${dir}"
          base="https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/${MINILM_REVISION}"
          for file in config.json tokenizer.json model.safetensors; do
            curl --proto '=https' --proto-redir '=https' -fsSL -o "${dir}/${file}" "${base}/${file}"
          done
          {
            echo "${MINILM_CONFIG_SHA256}  ${dir}/config.json"
            echo "${MINILM_TOKENIZER_SHA256}  ${dir}/tokenizer.json"
            echo "${MINILM_MODEL_SHA256}  ${dir}/model.safetensors"
          } | sha256sum -c -
          echo "XERJ_MODEL_DIR=${dir}" >> "${GITHUB_ENV}"

      - name: Download Loghub inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loghub-inputs
          path: build/bench

      - name: Score the 2k seed sets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/eval/competitors
          extra=()
          if [[ -n "${XERJ_MODEL_DIR:-}" ]]; then
            extra+=(--xerj-model-dir "${XERJ_MODEL_DIR}")
          fi
          "${EVAL_PYTHON:-python3}" scripts/eval-retrieval \
            --dataset all-2k \
            --engine "${ENGINE}" \
            "${extra[@]}" \
            --skip-fetch \
            --out "build/eval/competitors/2k-${ENGINE}.json"

      - name: Score the BGL needle window
        if: matrix.needle != false
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "${XERJ_MODEL_DIR:-}" ]]; then
            extra+=(--xerj-model-dir "${XERJ_MODEL_DIR}")
          fi
          "${EVAL_PYTHON:-python3}" scripts/eval-retrieval \
            --dataset bgl-needle-100k \
            --engine "${ENGINE}" \
            "${extra[@]}" \
            --skip-fetch \
            --out "build/eval/competitors/needle-${ENGINE}.json"

      - name: Upload engine reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: competitors-${{ matrix.engine }}
          path: build/eval/competitors/
          retention-days: 7
          if-no-files-found: warn

  merge:
    needs: [score]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download engine reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: competitors-*
          path: build/eval/competitors
          merge-multiple: true

      # Engines that failed (for example out of memory) are simply absent.
      - name: Merge reports
        shell: bash
        run: |
          set -euo pipefail
          out=build/eval/merged
          mkdir -p "${out}"
          {
            echo "### Competitor scores (retrieval quality only)"
            echo
            echo "ck and vecgrep score the 2k seed sets only: their chunk indexes exhaust the hosted runner's memory on the 100k needle window."
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
          for kind in 2k needle; do
            shopt -s nullglob
            inputs=()
            for engine in diy-faiss opensearch opensearch-knn ck vecgrep xerj xerj-neural xerj-semantic; do
              file="build/eval/competitors/${kind}-${engine}.json"
              if [[ -f "${file}" ]]; then
                inputs+=("${file}")
              else
                echo "- ${kind}: no report from ${engine}" >> "${GITHUB_STEP_SUMMARY}"
              fi
            done
            if [[ ${#inputs[@]} -eq 0 ]]; then
              continue
            fi
            python3 scripts/eval-retrieval-merge "${inputs[@]}" \
              --out "${out}/competitors-${kind}.json" \
              --markdown "${out}/competitors-${kind}.md"
            { echo; cat "${out}/competitors-${kind}.md"; } >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Upload merged reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-competitors
          path: build/eval/merged/
          retention-days: 30
          if-no-files-found: warn
