name: Eval retrieval

# Not a Pipeline job and not in the CI gate. Scores nesso against grep and
# SQLite BM25 on the pinned Loghub 2k seed sets, and on the BGL 100k needle
# window (Loghub 2.0, administrators' alert labels). The harness, query sets,
# and competitor reference reports come from lorenzocaprari/nesso-bench at
# NESSO_BENCH_REF. Runs nightly on main and on workflow_dispatch. Pull
# requests are scored by the Pipeline eval-retrieval job (ci.yml), which
# gates on nesso against its merge base. This run compares against the latest
# successful scheduled report on main and warns on relative drops over 5%. The
# summary also shows nesso's margin over the best other engine per class.
# Scores never fail the job; only script errors do. No gh-pages write yet.
on:
  schedule:
    # 06:47 UTC, after real-log at 05:47 UTC (fuzz-test 03:17, index-rss 04:47).
    - cron: "47 6 * * *"
  workflow_dispatch:

concurrency:
  group: eval-retrieval-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  CONAN_HOME: /opt/conan2
  CONAN_WERROR_ARGS: "-c user.nesso:werror=True"
  # nesso-bench commit that supplies eval-retrieval, eval-retrieval-compare,
  # fetch-loghub, the query sets, and test/eval/reference/. Bump it in its own
  # pull request when nesso-bench changes; the Pipeline eval-retrieval job on
  # that pull request shows any score change the bump brings. The resolve job
  # warns when this commit is behind nesso-bench's main. ci.yml and
  # bench-real-log.yml pin the same commit; bump all three together.
  NESSO_BENCH_REPOSITORY: lorenzocaprari/nesso-bench
  NESSO_BENCH_REF: 140bb9e077d3070f4ddf9f907588662f98b65450

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Require schedule on main or a manual dispatch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "eval-retrieval: schedule refuses ${GITHUB_REF}" >&2
              exit 1
            fi
            exit 0
          fi
          if [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "eval-retrieval: refusing event ${EVENT_NAME}" >&2
            exit 1
          fi

  resolve:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.select.outputs.image }}
      prev_run_id: ${{ steps.prev.outputs.prev_run_id }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image reference
        id: select
        shell: bash
        env:
          REGISTRY_NAME: ${{ env.REGISTRY }}
        run: |
          set -euo pipefail
          owner_lc="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          deps_hash="$(./scripts/ci/build-env-hash amd64)"
          echo "image=${REGISTRY_NAME}/${owner_lc}/nesso-build-env:deps-${deps_hash}" >> "${GITHUB_OUTPUT}"

      # The pin is bumped by hand, so a forgotten bump only shows up here. A
      # lagging pin is a warning, never a failure: a nesso-bench change does not
      # always change scores, and an unreachable API must not block the eval.
      - name: Check the nesso-bench pin
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short="${NESSO_BENCH_REF:0:7}"
          if ! compare="$(gh api "repos/${NESSO_BENCH_REPOSITORY}/compare/${NESSO_BENCH_REF}...main" --jq '[.status, .ahead_by] | @tsv')"; then
            echo "::warning::could not compare NESSO_BENCH_REF ${short} with ${NESSO_BENCH_REPOSITORY} main"
            exit 0
          fi
          read -r status behind <<< "${compare}"
          case "${status}" in
            identical)
              message="NESSO_BENCH_REF ${short} is ${NESSO_BENCH_REPOSITORY} main."
              ;;
            ahead)
              message="NESSO_BENCH_REF ${short} is ${behind} commit(s) behind ${NESSO_BENCH_REPOSITORY} main. Bump it in its own pull request."
              echo "::warning::${message}"
              ;;
            *)
              message="NESSO_BENCH_REF ${short} is not on ${NESSO_BENCH_REPOSITORY} main (compare status: ${status}). Pin a commit from main."
              echo "::warning::${message}"
              ;;
          esac
          { echo "### nesso-bench pin"; echo; echo "${message}"; } >> "${GITHUB_STEP_SUMMARY}"

      - name: Find previous successful scheduled run
        id: prev
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prev_run_id="$(
            gh run list \
              --workflow eval-retrieval.yml \
              --branch main \
              --event schedule \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"
          echo "prev_run_id=${prev_run_id}" >> "${GITHUB_OUTPUT}"

  eval:
    needs: [guard, resolve]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
      actions: write
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.resolve.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The harness resolves its query sets and Loghub inputs relative to its
      # own checkout, so they land under nesso-bench/.
      - name: Checkout nesso-bench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.NESSO_BENCH_REPOSITORY }}
          ref: ${{ env.NESSO_BENCH_REF }}
          path: nesso-bench
          persist-credentials: false

      - name: Download previous evaluation report
        id: prev_artifact
        if: needs.resolve.outputs.prev_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eval-retrieval
          path: build/eval/previous
          run-id: ${{ needs.resolve.outputs.prev_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Restore Loghub 2k inputs
        id: logs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nesso-bench/build/bench/HDFS_2k.log
            nesso-bench/build/bench/HDFS_2k.log_structured.csv
            nesso-bench/build/bench/BGL_2k.log
            nesso-bench/build/bench/BGL_2k.log_structured.csv
            nesso-bench/build/bench/Thunderbird_2k.log
            nesso-bench/build/bench/Thunderbird_2k.log_structured.csv
            nesso-bench/build/bench/OpenSSH_2k.log
            nesso-bench/build/bench/OpenSSH_2k.log_structured.csv
            nesso-bench/build/bench/Linux_2k.log
            nesso-bench/build/bench/Linux_2k.log_structured.csv
            nesso-bench/build/bench/Apache_2k.log
            nesso-bench/build/bench/Apache_2k.log_structured.csv
          key: loghub-all-2k-${{ hashFiles('nesso-bench/scripts/fetch-loghub') }}

      # Hadoop, OpenStack, and HealthApp: log shapes nesso-bench keeps out of
      # all-2k so the six original sets stay comparable.
      - name: Restore Loghub format inputs
        id: format_logs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nesso-bench/build/bench/Hadoop_2k.log
            nesso-bench/build/bench/Hadoop_2k.log_structured.csv
            nesso-bench/build/bench/OpenStack_2k.log
            nesso-bench/build/bench/OpenStack_2k.log_structured.csv
            nesso-bench/build/bench/HealthApp_2k.log
            nesso-bench/build/bench/HealthApp_2k.log_structured.csv
          key: loghub-all-formats-${{ hashFiles('nesso-bench/scripts/fetch-loghub') }}

      - name: Restore BGL needle window
        id: needle_logs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nesso-bench/build/bench/BGL_loghub2_4100001_100000.log
            nesso-bench/build/bench/BGL_loghub2_4100001_100000.labels
          key: loghub2-bgl-needle-100k-${{ hashFiles('nesso-bench/scripts/fetch-loghub') }}

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote -o tests=False $CONAN_WERROR_ARGS

      - name: Build
        run: conan build . -pr:h ./conan/profiles/gcc-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote -o tests=False $CONAN_WERROR_ARGS

      - name: Fetch Loghub 2k inputs
        run: python3 nesso-bench/scripts/fetch-loghub --dataset all-2k

      - name: Fetch Loghub format inputs
        run: python3 nesso-bench/scripts/fetch-loghub --dataset all-formats

      # A restored window that matches its pin is kept; otherwise the 86 MB
      # Loghub 2.0 BGL archive is downloaded, checked, cut, and deleted.
      - name: Fetch BGL needle window
        run: python3 nesso-bench/scripts/fetch-loghub --dataset bgl-loghub2 --window 4100001:100000

      - name: Run retrieval evaluation
        run: |
          set -euo pipefail
          mkdir -p build/eval
          python3 nesso-bench/scripts/eval-retrieval \
            --dataset all-2k \
            --split dev \
            --engine nesso \
            --engine grep \
            --engine bm25 \
            --binary build/Release/src/nesso \
            --model-dir models \
            --out build/eval/all_2k.json \
            | tee build/eval/all_2k.txt
          {
            echo "### Retrieval evaluation (Loghub 2k seed sets, dev queries: nesso, grep, BM25)"
            echo
            current=""
            while IFS= read -r line || [[ -n "${line}" ]]; do
              if [[ "${line}" == wrote\ * ]]; then
                continue
              fi
              if [[ "${line}" == ===\ *\ === ]]; then
                name="${line#=== }"
                name="${name% ===}"
                if [[ -n "${current}" ]]; then
                  echo '```'
                  echo
                fi
                echo "#### ${name}"
                echo
                echo '```'
                current="${name}"
                continue
              fi
              if [[ -z "${current}" ]]; then
                continue
              fi
              printf '%s\n' "${line}"
            done < build/eval/all_2k.txt
            if [[ -n "${current}" ]]; then
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run format evaluation
        run: |
          set -euo pipefail
          python3 nesso-bench/scripts/eval-retrieval \
            --dataset all-formats \
            --split dev \
            --engine nesso \
            --engine grep \
            --engine bm25 \
            --skip-fetch \
            --binary build/Release/src/nesso \
            --model-dir models \
            --out build/eval/formats.json \
            | tee build/eval/formats.txt
          {
            echo
            echo "### Format sets (Hadoop, OpenStack, HealthApp 2k, dev queries: nesso, grep, BM25)"
            echo
            echo '```'
            grep -v '^wrote ' build/eval/formats.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Labels are the BGL administrators' alert tags, not ours. About 80 s.
      - name: Run needle evaluation
        run: |
          set -euo pipefail
          python3 nesso-bench/scripts/eval-retrieval \
            --dataset bgl-needle-100k \
            --engine nesso \
            --engine grep \
            --engine bm25 \
            --modes auto,dense,lexical \
            --split dev \
            --skip-fetch \
            --binary build/Release/src/nesso \
            --model-dir models \
            --out build/eval/needle.json \
            | tee build/eval/needle.txt
          {
            echo
            echo "### Needle benchmark (BGL 100k, administrators' alert labels: nesso, grep, BM25)"
            echo
            echo '```'
            grep -v '^wrote ' build/eval/needle.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # nesso against the best other engine per class, among the engines scored
      # in this run on the same dev queries. nesso-bench's committed competitor
      # references (test/eval/reference/) are not used: they were scored on an
      # older query set and record no split.
      - name: Nesso margin against other engines
        run: |
          set -euo pipefail
          for report in all_2k formats needle; do
            {
              echo
              python3 nesso-bench/scripts/eval-retrieval-compare \
                --current "build/eval/${report}.json" \
                --margins
            } >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Compare with previous evaluation report
        run: |
          set -euo pipefail
          : > build/eval/compare.txt
          for report in all_2k formats needle; do
            previous="build/eval/previous/${report}.json"
            {
              echo
              echo "#### Compare ${report} with the latest nightly report"
              echo
              if [[ ! -f "${previous}" ]]; then
                echo "no previous run to compare"
              else
                python3 nesso-bench/scripts/eval-retrieval-compare \
                  --current "build/eval/${report}.json" \
                  --previous "${previous}" \
                  | tee -a build/eval/compare.txt
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
          done
          while IFS= read -r line || [[ -n "${line}" ]]; do
            if [[ "${line}" == DROP\ * ]]; then
              echo "::warning::${line}"
            fi
          done < build/eval/compare.txt

      - name: Note Loghub 2k inputs are ready to cache
        id: logfiles
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          ready=true
          for path in \
            nesso-bench/build/bench/HDFS_2k.log \
            nesso-bench/build/bench/HDFS_2k.log_structured.csv \
            nesso-bench/build/bench/BGL_2k.log \
            nesso-bench/build/bench/BGL_2k.log_structured.csv \
            nesso-bench/build/bench/Thunderbird_2k.log \
            nesso-bench/build/bench/Thunderbird_2k.log_structured.csv \
            nesso-bench/build/bench/OpenSSH_2k.log \
            nesso-bench/build/bench/OpenSSH_2k.log_structured.csv \
            nesso-bench/build/bench/Linux_2k.log \
            nesso-bench/build/bench/Linux_2k.log_structured.csv \
            nesso-bench/build/bench/Apache_2k.log \
            nesso-bench/build/bench/Apache_2k.log_structured.csv
          do
            if [[ ! -s "${path}" ]]; then
              ready=false
              break
            fi
          done
          echo "ready=${ready}" >> "${GITHUB_OUTPUT}"

      - name: Save Loghub 2k inputs
        if: always() && !cancelled() && steps.logs.outputs.cache-hit != 'true' && steps.logfiles.outputs.ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nesso-bench/build/bench/HDFS_2k.log
            nesso-bench/build/bench/HDFS_2k.log_structured.csv
            nesso-bench/build/bench/BGL_2k.log
            nesso-bench/build/bench/BGL_2k.log_structured.csv
            nesso-bench/build/bench/Thunderbird_2k.log
            nesso-bench/build/bench/Thunderbird_2k.log_structured.csv
            nesso-bench/build/bench/OpenSSH_2k.log
            nesso-bench/build/bench/OpenSSH_2k.log_structured.csv
            nesso-bench/build/bench/Linux_2k.log
            nesso-bench/build/bench/Linux_2k.log_structured.csv
            nesso-bench/build/bench/Apache_2k.log
            nesso-bench/build/bench/Apache_2k.log_structured.csv
          key: loghub-all-2k-${{ hashFiles('nesso-bench/scripts/fetch-loghub') }}

      - name: Save Loghub format inputs
        if: always() && !cancelled() && steps.format_logs.outputs.cache-hit != 'true' && hashFiles('nesso-bench/build/bench/HealthApp_2k.log_structured.csv') != '' && hashFiles('nesso-bench/build/bench/OpenStack_2k.log_structured.csv') != '' && hashFiles('nesso-bench/build/bench/Hadoop_2k.log_structured.csv') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nesso-bench/build/bench/Hadoop_2k.log
            nesso-bench/build/bench/Hadoop_2k.log_structured.csv
            nesso-bench/build/bench/OpenStack_2k.log
            nesso-bench/build/bench/OpenStack_2k.log_structured.csv
            nesso-bench/build/bench/HealthApp_2k.log
            nesso-bench/build/bench/HealthApp_2k.log_structured.csv
          key: loghub-all-formats-${{ hashFiles('nesso-bench/scripts/fetch-loghub') }}

      - name: Save BGL needle window
        if: always() && !cancelled() && steps.needle_logs.outputs.cache-hit != 'true' && hashFiles('nesso-bench/build/bench/BGL_loghub2_4100001_100000.labels') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            nesso-bench/build/bench/BGL_loghub2_4100001_100000.log
            nesso-bench/build/bench/BGL_loghub2_4100001_100000.labels
          key: loghub2-bgl-needle-100k-${{ hashFiles('nesso-bench/scripts/fetch-loghub') }}

      # resolve takes the nightly baseline from scheduled runs only.
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-retrieval
          path: |
            build/eval/all_2k.json
            build/eval/formats.json
            build/eval/needle.json
          retention-days: 7
          if-no-files-found: warn
