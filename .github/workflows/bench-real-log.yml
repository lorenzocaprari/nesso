name: Real-log bench

# Not a Pipeline job. Schedule and workflow_dispatch on main only.
# Pull requests keep the synthetic bench in .github/workflows/ci.yml.
on:
  schedule:
    # 05:47 UTC, after the Pipeline nightly at 03:17 UTC.
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      force_log_refetch:
        description: Ignore the truncated Loghub cache and download the prefixes again
        type: boolean
        default: false
      corpora:
        description: Real-log corpora (comma-separated, or all). Nightly default is hdfs-v1,thunderbird
        type: string
        default: "hdfs-v1,thunderbird"

concurrency:
  group: real-log-bench-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  CONAN_HOME: /opt/conan2
  CONAN_WERROR_ARGS: "-c user.nesso:werror=True"
  NESSO_BENCH_RSS_TOLERANCE: "0.15"
  NESSO_BENCH_WALL_TOLERANCE: "0.15"

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Require schedule on main or a manual dispatch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "bench-real-log: schedule refuses ${GITHUB_REF}" >&2
              exit 1
            fi
            exit 0
          fi
          if [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "bench-real-log: refusing event ${EVENT_NAME}" >&2
            exit 1
          fi

  resolve:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      image: ${{ steps.select.outputs.image }}
      prev_run_id: ${{ steps.prev.outputs.prev_run_id }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image reference
        id: select
        shell: bash
        env:
          REGISTRY_NAME: ${{ env.REGISTRY }}
        run: |
          set -euo pipefail
          owner_lc="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          deps_hash="$(./scripts/ci/build-env-hash amd64)"
          echo "image=${REGISTRY_NAME}/${owner_lc}/nesso-build-env:deps-${deps_hash}" >> "${GITHUB_OUTPUT}"

      # The wall-time comparison reads the result of the latest green nightly
      # on main. None yet is a warning, not a failure.
      - name: Find previous successful scheduled run
        id: prev
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prev_run_id="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow bench-real-log.yml \
              --branch main \
              --event schedule \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"
          echo "prev_run_id=${prev_run_id}" >> "${GITHUB_OUTPUT}"

  bench:
    needs: [guard, resolve]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: read
      actions: write
    container:
      image: ${{ needs.resolve.outputs.image }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore MiniLM models
        id: models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Fetch MiniLM models
        if: steps.models.outputs.cache-hit != 'true'
        run: ./scripts/fetch-model models

      - name: Select real-log corpora
        id: corpora
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CORPORA: ${{ inputs.corpora }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_CORPORA}" ]]; then
            corpora="${INPUT_CORPORA}"
          else
            corpora="hdfs-v1,thunderbird"
          fi
          echo "corpora=${corpora}" >> "${GITHUB_OUTPUT}"
          # Cache keys cannot contain commas, so the key joins the names with "-".
          cache_key="$(printf '%s' "${corpora}" | tr -d '[:space:]' | tr ',' '-')"
          echo "cache_key=${cache_key}" >> "${GITHUB_OUTPUT}"
          paths=()
          IFS=',' read -r -a names <<< "${corpora}"
          for name in "${names[@]}"; do
            name="$(printf '%s' "${name}" | tr -d '[:space:]')"
            case "${name}" in
              all)
                paths=(build/bench/HDFS_1m.log build/bench/BGL_1m.log build/bench/Thunderbird_1m.log)
                break
                ;;
              hdfs-v1) paths+=("build/bench/HDFS_1m.log") ;;
              bgl) paths+=("build/bench/BGL_1m.log") ;;
              thunderbird) paths+=("build/bench/Thunderbird_1m.log") ;;
              *)
                echo "bench-real-log: unknown corpus ${name}" >&2
                exit 1
                ;;
            esac
          done
          {
            echo "paths<<EOF"
            printf '%s\n' "${paths[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore truncated Loghub logs
        id: logs
        if: github.event_name != 'workflow_dispatch' || inputs.force_log_refetch != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpora.outputs.paths }}
          key: loghub-1m-${{ steps.corpora.outputs.cache_key }}-${{ hashFiles('scripts/fetch-loghub') }}

      - name: Fetch truncated Loghub logs
        shell: bash
        env:
          CORPORA: ${{ steps.corpora.outputs.corpora }}
        run: |
          set -euo pipefail
          if [[ "${CORPORA}" == "all" ]]; then
            python3 scripts/fetch-loghub --dataset all-full
            exit 0
          fi
          IFS=',' read -r -a names <<< "${CORPORA}"
          for name in "${names[@]}"; do
            name="$(printf '%s' "${name}" | tr -d '[:space:]')"
            python3 scripts/fetch-loghub --dataset "${name}"
          done

      - name: Install Dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . -pr:h ./conan/profiles/gcc-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote -o tests=False $CONAN_WERROR_ARGS

      - name: Build
        run: conan build . -pr:h ./conan/profiles/gcc-26 -pr:b default --lockfile=conan.lock --build=missing --no-remote -o tests=False $CONAN_WERROR_ARGS

      # --timeout is a per-command hang guard, not a speed budget. scripts/bench
      # sizes each corpus (REAL_LOG_DEFAULT_LINES) so a normal run stays far
      # below it, and 1200 s keeps a stuck run inside timeout-minutes.
      - name: Run real-log benchmark
        env:
          CORPORA: ${{ steps.corpora.outputs.corpora }}
        run: |
          set -euo pipefail
          mem_kb=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          export NESSO_BENCH_AS_LIMIT_KB=$((mem_kb * 3 / 4))
          python3 scripts/bench --dataset real-log --corpora "${CORPORA}" --binary build/Release/src/nesso --timeout 1200 \
            --output bench/results/real-log.json

      - name: Download previous nightly result
        if: always() && !cancelled() && needs.resolve.outputs.prev_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: real-log-bench
          path: bench/results/previous
          run-id: ${{ needs.resolve.outputs.prev_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Peak RSS fails the job. Wall time against the previous nightly only warns.
      - name: Gate peak RSS and report speed
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s bench/results/real-log.json ]]; then
            echo "bench-real-log: missing bench/results/real-log.json" >&2
            exit 1
          fi
          python3 scripts/bench-real-log-compare \
            --result bench/results/real-log.json \
            --history bench/results/previous/real-log.json

      - name: Note truncated logs are ready to cache
        id: logfiles
        if: always() && !cancelled()
        shell: bash
        env:
          LOG_PATHS: ${{ steps.corpora.outputs.paths }}
        run: |
          set -euo pipefail
          ready=true
          while IFS= read -r path; do
            [[ -n "${path}" ]] || continue
            if [[ ! -s "${path}" ]]; then
              ready=false
              break
            fi
          done <<< "${LOG_PATHS}"
          echo "ready=${ready}" >> "${GITHUB_OUTPUT}"

      - name: Save truncated Loghub logs
        if: always() && !cancelled() && steps.logs.outputs.cache-hit != 'true' && steps.logfiles.outputs.ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpora.outputs.paths }}
          key: loghub-1m-${{ steps.corpora.outputs.cache_key }}-${{ hashFiles('scripts/fetch-loghub') }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-log-bench
          path: bench/results/real-log.json
          if-no-files-found: warn
