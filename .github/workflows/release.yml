name: Release

# arm64 CI blocks Pipeline. This workflow still publishes only the amd64
# .deb, checksums, SBOM, and provenance bundles. Dockerfile.runtime and
# scripts/package-deb are amd64-only (gcc-26's -march=x86-64-v2,
# Architecture: amd64). A follow-up, behind a workflow_dispatch input that
# defaults to false, should:
#   - build the runtime image natively on ubuntu-24.04-arm with
#     conan/profiles/gcc-26-armv8
#   - push a multi-arch manifest (an arm image must not replace :latest)
#   - emit an arm64 .deb instead of the hardcoded amd64 filename
#   - cover that .deb with the same SBOM, checksum, and provenance
#     attestations this workflow already attaches for amd64
# Until that input exists, vX.Y.Z tags stay amd64-only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Semver without v; must match conanfile.py version (build and smoke only)
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  CONAN_HOME: /opt/conan2

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          ref='${{ github.ref }}'
          if [[ "${ref}" == refs/tags/* ]]; then
            tag='${{ github.ref_name }}'
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "error: tag must be vX.Y.Z, got ${tag}" >&2
              exit 1
            fi
            ver="${tag#v}"
          else
            ver='${{ inputs.version }}'
            if [[ ! "${ver}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "error: version must be X.Y.Z, got ${ver}" >&2
              exit 1
            fi
          fi
          chmod +x scripts/check-versions
          scripts/check-versions "${ver}"
          echo "ver=${ver}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${ver}" >> "${GITHUB_OUTPUT}"

      - name: Resolve build-env image
        id: select
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          reg="${{ env.REGISTRY }}/${owner_lc}/nesso-build-env"
          # Same script as both prepare-image jobs.
          deps_hash="$(./scripts/build-env-hash amd64)"
          echo "build_image=${reg}:deps-${deps_hash}" >> "${GITHUB_OUTPUT}"
          echo "runtime_image=${{ env.REGISTRY }}/${owner_lc}/nesso" >> "${GITHUB_OUTPUT}"

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require nesso-build-env
        run: |
          set -euo pipefail
          img='${{ steps.select.outputs.build_image }}'
          if ! docker pull "${img}"; then
            echo "error: missing ${img}; run CI on main so nesso-build-env is published first" >&2
            exit 1
          fi

      - name: Build runtime image
        run: |
          set -euo pipefail
          docker build -f Dockerfile.runtime \
            --build-arg BUILD_IMAGE='${{ steps.select.outputs.build_image }}' \
            -t '${{ steps.select.outputs.runtime_image }}:${{ steps.ver.outputs.tag }}' \
            -t '${{ steps.select.outputs.runtime_image }}:${{ steps.ver.outputs.ver }}' \
            .

      - name: Push runtime image
        id: push
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          img='${{ steps.select.outputs.runtime_image }}'
          tag='${{ steps.ver.outputs.tag }}'
          ver='${{ steps.ver.outputs.ver }}'
          docker tag "${img}:${tag}" "${img}:latest"
          push_log="$(docker push "${img}:${tag}")"
          printf '%s\n' "${push_log}"
          docker push "${img}:${ver}"
          docker push "${img}:latest"
          digest="$(printf '%s\n' "${push_log}" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -n1)"
          if [[ -z "${digest}" ]]; then
            digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${img}:${tag}" \
              | sed -n 's/.*@\(sha256:[0-9a-f]\{64\}\)$/\1/p' | head -n1)"
          fi
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "error: could not resolve digest for ${img}:${tag}" >&2
            exit 1
          fi
          {
            echo "image=${img}"
            echo "digest=${digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Extract binary and model
        run: |
          set -euo pipefail
          img='${{ steps.select.outputs.runtime_image }}:${{ steps.ver.outputs.tag }}'
          cid="$(docker create "${img}")"
          docker cp "${cid}:/usr/local/bin/nesso" nesso
          mkdir -p models
          docker cp "${cid}:/usr/share/nesso/." models/
          docker rm "${cid}"
          chmod +x nesso

      - name: Build .deb
        run: |
          set -euo pipefail
          if ! command -v objdump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends binutils
          fi
          chmod +x scripts/package-deb
          scripts/package-deb '${{ steps.ver.outputs.ver }}' ./nesso ./models .

      - name: Smoke-test image and .deb
        run: |
          set -euo pipefail
          chmod +x scripts/smoke-runtime-image scripts/smoke-deb
          ./scripts/smoke-runtime-image \
            '${{ steps.select.outputs.runtime_image }}:${{ steps.ver.outputs.tag }}'
          ./scripts/smoke-deb './nesso_${{ steps.ver.outputs.ver }}_amd64.deb'

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.select.outputs.runtime_image }}:${{ steps.ver.outputs.tag }}
          format: spdx-json
          output-file: nesso_${{ steps.ver.outputs.ver }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest .deb provenance
        id: attest-deb
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nesso_${{ steps.ver.outputs.ver }}_amd64.deb

      - name: Attest runtime image provenance
        id: attest-image
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Scorecard Signed-Releases ignores the attestation store. releasesHaveProvenance
      # matches a release asset whose name ends in .intoto.jsonl (score 10).
      - name: Attach provenance bundles
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          ver='${{ steps.ver.outputs.ver }}'
          cp '${{ steps.attest-deb.outputs.bundle-path }}' "nesso_${ver}_amd64.deb.intoto.jsonl"
          cp '${{ steps.attest-image.outputs.bundle-path }}' "nesso_${ver}_ghcr.intoto.jsonl"

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          ver='${{ steps.ver.outputs.ver }}'
          files=(
            "nesso_${ver}_amd64.deb"
            "nesso_${ver}.spdx.json"
          )
          for extra in \
            "nesso_${ver}_amd64.deb.intoto.jsonl" \
            "nesso_${ver}_ghcr.intoto.jsonl"
          do
            if [[ -f "${extra}" ]]; then
              files+=("${extra}")
            fi
          done
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nesso-${{ steps.ver.outputs.ver }}-linux-amd64
          path: |
            nesso_${{ steps.ver.outputs.ver }}_amd64.deb
            nesso_${{ steps.ver.outputs.ver }}.spdx.json
            SHA256SUMS
            nesso
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            nesso_${{ steps.ver.outputs.ver }}_amd64.deb
            nesso_${{ steps.ver.outputs.ver }}_amd64.deb.intoto.jsonl
            nesso_${{ steps.ver.outputs.ver }}_ghcr.intoto.jsonl
            nesso_${{ steps.ver.outputs.ver }}.spdx.json
            SHA256SUMS
          generate_release_notes: true
