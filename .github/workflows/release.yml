name: Release

# arm64 CI blocks Pipeline. This workflow still publishes only the amd64
# .deb, checksums, SBOM, and provenance. Dockerfile.runtime and
# scripts/package-deb are amd64-only (gcc-26's -march=x86-64-v2,
# Architecture: amd64). A follow-up, behind a workflow_dispatch input that
# defaults to false, should:
#   - build the runtime image natively on ubuntu-24.04-arm with
#     conan/profiles/gcc-26-armv8
#   - push a multi-arch manifest (an arm image must not replace :latest)
#   - emit an arm64 .deb instead of the hardcoded amd64 filename
#   - cover that .deb with the same SBOM, checksum, signature, and
#     provenance this workflow already attaches for amd64
# Until that input exists, vX.Y.Z tags stay amd64-only.
#
# workflow_dispatch builds, gates, and uploads workflow artifacts. Push,
# cosign, provenance, and the GitHub Release run only for a vX.Y.Z tag.
# That dispatch is the dry run: it cannot publish.
#
# deploy waits on Package (.github/workflows/package.yml). That workflow
# builds the .deb twice and installs it on Ubuntu 26.04 and 26.10. A failed
# check does not push the image or publish the GitHub Release. Package also
# runs on its own nightly schedule and when its packaging files change.

# Tag releases sign ghcr.io/<owner>/nesso by digest with keyless cosign
# (cosign 2.6.1). SLSA Build Level 3 provenance comes from
# slsa-github-generator v2.1.0: the generic generator for the .deb and
# SPDX SBOM, the container generator for the image digest. Those two
# reusable workflows are referenced by tag. They verify their own ref
# and reject a commit SHA. Every other action stays pinned by SHA.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Semver without v; must match conanfile.py version (build and smoke only)
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  CONAN_HOME: /opt/conan2

permissions: {}

jobs:
  verify-package:
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read
      packages: read
      actions: write

  deploy:
    needs: verify-package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.select.outputs.runtime_image }}
      digest: ${{ steps.push.outputs.digest }}
      ver: ${{ steps.ver.outputs.ver }}
      hashes: ${{ steps.subjects.outputs.hashes }}
      provenance_name: ${{ steps.subjects.outputs.provenance_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          ref='${{ github.ref }}'
          if [[ "${ref}" == refs/tags/* ]]; then
            tag='${{ github.ref_name }}'
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "error: tag must be vX.Y.Z, got ${tag}" >&2
              exit 1
            fi
            ver="${tag#v}"
          else
            ver='${{ inputs.version }}'
            if [[ ! "${ver}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "error: version must be X.Y.Z, got ${ver}" >&2
              exit 1
            fi
          fi
          chmod +x scripts/check-versions
          scripts/check-versions "${ver}"
          epoch="$(git log -1 --format=%ct)"
          if [[ ! "${epoch}" =~ ^[0-9]+$ ]]; then
            echo "error: could not read the commit timestamp" >&2
            exit 1
          fi
          {
            echo "ver=${ver}"
            echo "tag=v${ver}"
            echo "epoch=${epoch}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve build-env image
        id: select
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          reg="${{ env.REGISTRY }}/${owner_lc}/nesso-build-env"
          # Same script as prepare-image-amd64 and prepare-image-arm64.
          deps_hash="$(./scripts/build-env-hash amd64)"
          echo "build_image=${reg}:deps-${deps_hash}" >> "${GITHUB_OUTPUT}"
          echo "runtime_image=${{ env.REGISTRY }}/${owner_lc}/nesso" >> "${GITHUB_OUTPUT}"

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require nesso-build-env
        run: |
          set -euo pipefail
          img='${{ steps.select.outputs.build_image }}'
          if ! docker pull "${img}"; then
            echo "error: missing ${img}; run CI on main so nesso-build-env is published first" >&2
            exit 1
          fi

      - name: Build runtime image
        run: |
          set -euo pipefail
          docker build -f Dockerfile.runtime \
            --build-arg BUILD_IMAGE='${{ steps.select.outputs.build_image }}' \
            --build-arg SOURCE_DATE_EPOCH='${{ steps.ver.outputs.epoch }}' \
            -t '${{ steps.select.outputs.runtime_image }}:${{ steps.ver.outputs.tag }}' \
            -t '${{ steps.select.outputs.runtime_image }}:${{ steps.ver.outputs.ver }}' \
            .

      - name: Write determinism input
        run: ./scripts/check-determinism --emit-input determinism-input.log

      - name: Fetch fp32 MiniLM
        run: ./scripts/fetch-model models-fp32 fp32

      # The published binary needs the runtime image's glibc. A failure here
      # stops the job before the image push and the GitHub release.
      # stress-ng stays. scripts/check-determinism defaults to it for CPU load.
      # The slim runtime image does not ship it. This install is inside the
      # throwaway gate container, not the image that gets pushed. The smoke
      # test does not use stress-ng.
      - name: Gate int8 and fp32 determinism
        run: |
          set -euo pipefail
          img='${{ steps.select.outputs.runtime_image }}:${{ steps.ver.outputs.tag }}'
          docker run --rm \
            --entrypoint bash \
            -v "${PWD}/scripts/check-determinism:/opt/check-determinism:ro" \
            -v "${PWD}/determinism-input.log:/opt/determinism-input.log:ro" \
            -v "${PWD}/models-fp32:/opt/models-fp32:ro" \
            "${img}" \
            -c '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends python3 stress-ng
              rm -rf /var/lib/apt/lists/*
              gate() {
                python3 /opt/check-determinism \
                  --binary /usr/local/bin/nesso \
                  --model-dir "$1" \
                  --input /opt/determinism-input.log \
                  --runs 10 \
                  --index-runs 3
              }
              gate /usr/share/nesso
              gate /opt/models-fp32
            '

      - name: Push runtime image
        id: push
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          img='${{ steps.select.outputs.runtime_image }}'
          tag='${{ steps.ver.outputs.tag }}'
          ver='${{ steps.ver.outputs.ver }}'
          docker tag "${img}:${tag}" "${img}:latest"
          push_log="$(docker push "${img}:${tag}")"
          printf '%s\n' "${push_log}"
          docker push "${img}:${ver}"
          docker push "${img}:latest"
          digest="$(printf '%s\n' "${push_log}" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -n1)"
          if [[ -z "${digest}" ]]; then
            digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${img}:${tag}" \
              | sed -n 's/.*@\(sha256:[0-9a-f]\{64\}\)$/\1/p' | head -n1)"
          fi
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "error: could not resolve digest for ${img}:${tag}" >&2
            exit 1
          fi
          {
            echo "image=${img}"
            echo "digest=${digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Extract binary and model
        run: |
          set -euo pipefail
          img='${{ steps.select.outputs.runtime_image }}:${{ steps.ver.outputs.tag }}'
          cid="$(docker create "${img}")"
          docker cp "${cid}:/usr/local/bin/nesso" nesso
          mkdir -p models
          docker cp "${cid}:/usr/share/nesso/." models/
          docker rm "${cid}"
          chmod +x nesso

      - name: Build .deb
        run: |
          set -euo pipefail
          if ! command -v objdump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends binutils
          fi
          chmod +x scripts/package-deb
          export SOURCE_DATE_EPOCH='${{ steps.ver.outputs.epoch }}'
          scripts/package-deb '${{ steps.ver.outputs.ver }}' ./nesso ./models .

      - name: Smoke-test image and .deb
        run: |
          set -euo pipefail
          chmod +x scripts/smoke-runtime-image scripts/smoke-deb
          ./scripts/smoke-runtime-image \
            '${{ steps.select.outputs.runtime_image }}:${{ steps.ver.outputs.tag }}'
          ./scripts/smoke-deb './nesso_${{ steps.ver.outputs.ver }}_amd64.deb'

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.select.outputs.runtime_image }}:${{ steps.ver.outputs.tag }}
          format: spdx-json
          output-file: nesso_${{ steps.ver.outputs.ver }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # sha256sum layout, then base64 one line. The generic generator decodes
      # this into its subject list. The published checksum is recomputed
      # after provenance exists; this file is the workflow artifact only.
      - name: Hash release subjects
        id: subjects
        run: |
          set -euo pipefail
          ver='${{ steps.ver.outputs.ver }}'
          deb="nesso_${ver}_amd64.deb"
          sbom="nesso_${ver}.spdx.json"
          hashes="$(sha256sum "${deb}" "${sbom}" | base64 -w0)"
          echo "hashes=${hashes}" >> "${GITHUB_OUTPUT}"
          echo "provenance_name=nesso_${ver}_amd64.intoto.jsonl" >> "${GITHUB_OUTPUT}"

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          ver='${{ steps.ver.outputs.ver }}'
          sha256sum \
            "nesso_${ver}_amd64.deb" \
            "nesso_${ver}.spdx.json" \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nesso-${{ steps.ver.outputs.ver }}-linux-amd64
          path: |
            nesso_${{ steps.ver.outputs.ver }}_amd64.deb
            nesso_${{ steps.ver.outputs.ver }}.spdx.json
            SHA256SUMS
            nesso
          if-no-files-found: error

  # Keyless signature over the manifest digest. The certificate SAN is
  # https://github.com/<owner>/nesso/.github/workflows/release.yml@refs/tags/vX.Y.Z
  sign:
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign runtime image by digest
        env:
          IMAGE: ${{ needs.deploy.outputs.image }}
          DIGEST: ${{ needs.deploy.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "error: refusing to sign without a digest" >&2
            exit 1
          fi
          cosign sign --yes "${IMAGE}@${DIGEST}"

  # SLSA Build L3 for the .deb and the SPDX SBOM. upload-assets stays
  # false so the release job can checksum the provenance before publishing.
  # contents: write is declared because the called workflow's upload job
  # requests it; that job does not run when upload-assets is false.
  # Tag ref: the generator rejects a SHA pin. See CONTRIBUTING.md.
  provenance:
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
      id-token: write
      contents: write
    # zizmor: ignore[unpinned-uses] generator verifies its own vX.Y.Z ref
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.deploy.outputs.hashes }}
      provenance-name: ${{ needs.deploy.outputs.provenance_name }}
      upload-assets: false

  # SLSA Build L3 for the image. The attestation is stored on the digest
  # in GHCR. slsa-verifier verify-image reads it from the registry.
  # Tag ref: same generator constraint as the generic workflow.
  image-provenance:
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
      id-token: write
      packages: write
    # zizmor: ignore[unpinned-uses] generator verifies its own vX.Y.Z ref
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.deploy.outputs.image }}
      digest: ${{ needs.deploy.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # Scorecard Signed-Releases ignores the registry. releasesHaveProvenance
  # matches a release asset whose name ends in .intoto.jsonl.
  release:
    needs: [deploy, sign, provenance, image-provenance]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      packages: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nesso-${{ needs.deploy.outputs.ver }}-linux-amd64

      - name: Download .deb provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_NAME: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/provenance"
          mkdir -p "${dest}"
          gh run download "${GITHUB_RUN_ID}" --name "${PROVENANCE_NAME}" --dir "${dest}"
          found="$(find "${dest}" -type f -name "${PROVENANCE_NAME}" -print -quit)"
          if [[ -z "${found}" ]]; then
            echo "error: missing ${PROVENANCE_NAME} in the provenance artifact" >&2
            find "${dest}" -print >&2
            exit 1
          fi
          install -m 0644 "${found}" "./${PROVENANCE_NAME}"
          test -s "./${PROVENANCE_NAME}"

      - name: Download image provenance
        env:
          IMAGE: ${{ needs.deploy.outputs.image }}
          DIGEST: ${{ needs.deploy.outputs.digest }}
          VER: ${{ needs.deploy.outputs.ver }}
        run: |
          set -euo pipefail
          out="nesso_${VER}_ghcr.intoto.jsonl"
          tmp="$(mktemp)"
          ok=0
          for _ in 1 2 3 4 5 6; do
            if cosign download attestation "${IMAGE}@${DIGEST}" > "${tmp}" && [[ -s "${tmp}" ]]; then
              ok=1
              break
            fi
            sleep 5
          done
          if [[ "${ok}" != 1 ]]; then
            echo "error: image attestation was not readable" >&2
            exit 1
          fi
          if [[ "$(head -c 1 "${tmp}")" != '{' ]]; then
            echo "error: image attestation was not JSON" >&2
            exit 1
          fi
          mv "${tmp}" "${out}"

      - name: Generate SHA256SUMS
        env:
          VER: ${{ needs.deploy.outputs.ver }}
          PROVENANCE_NAME: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          set -euo pipefail
          sha256sum \
            "nesso_${VER}_amd64.deb" \
            "nesso_${VER}.spdx.json" \
            "${PROVENANCE_NAME}" \
            "nesso_${VER}_ghcr.intoto.jsonl" \
            > SHA256SUMS
          cat SHA256SUMS

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            nesso_${{ needs.deploy.outputs.ver }}_amd64.deb
            nesso_${{ needs.deploy.outputs.ver }}.spdx.json
            ${{ needs.provenance.outputs.provenance-name }}
            nesso_${{ needs.deploy.outputs.ver }}_ghcr.intoto.jsonl
            SHA256SUMS
          generate_release_notes: true
