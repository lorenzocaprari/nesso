name: Package

# Byte-compare two clean release .debs per architecture, then apt-install that
# package on the Ubuntu releases README claims. amd64 runs on ubuntu-latest.
# arm64 runs on ubuntu-24.04-arm. Both use the native build-env image, so
# neither build nor the distro smoke goes through QEMU. Nightly is 03:47 UTC,
# after Pipeline's 03:17 run. Pull requests run only when packaging inputs
# change, so the rest of Pipeline stays the fast path. The arm64 jobs run in
# parallel with amd64. release.yml calls this workflow and its image jobs
# wait for it: a tag does not push the image or publish the GitHub Release
# when a job here fails. The same wait applies to a release workflow_dispatch.
#
# resolve-image does not build nesso-build-env. On a pull request it polls
# for the deps-<hash> tag for up to 350 minutes so a base-image digest bump
# can wait for prepare-image-amd64 and prepare-image-arm64 in that same
# Pipeline run. The job timeout is 360 minutes, the same budget as those
# image jobs. An image that already exists returns on the first inspect.
# Schedule, workflow_dispatch, and a caller such as release.yml fail on the
# first miss: the called workflow sees the caller's event, not pull_request.
# The job keeps packages: read. A Dependabot pull request can read the tag
# Pipeline pushed and does not need packages: write.
#
# step-security/harden-runner v2.22.2 (egress-policy: audit) is the first
# step of host jobs. repro-build sets container: and does not get it: those
# steps run inside the container, and the agent has to install on the VM.
# scan-runtime runs on a direct Package run. Release passes scan_runtime:
# false; its image job scans the image it is about to publish. GitHub checks
# the called job's security-events: write before that if, so the caller
# still grants the permission.

on:
  schedule:
    - cron: "47 3 * * *"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/package.yml"
      - ".github/workflows/release.yml"
      - "packaging/Dockerfile.runtime"
      - "CMakeLists.txt"
      - "conanfile.py"
      - "conan.lock"
      - "LICENSE"
      - "scripts/build-release-binary"
      - "scripts/package-deb"
      - "scripts/compare-deb"
      - "scripts/smoke-deb"
      - "scripts/fetch-model"
      - "scripts/check-no-runpath"
      - "scripts/check-network-free"
      - "scripts/check-network-free.allow"
      - "scripts/publish-runtime-index"
      - "scripts/trivy"
      - "scripts/scan-runtime-image"
      - "scripts/ci/trivy.go"
      - "scripts/ci/runtime_scan.go"
      - "scripts/ci/wait_build_env.go"
      - "scripts/smoke-runtime-image"
      - "scripts/third-party-notices"
      - "packaging/notices/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      scan_runtime:
        description: Scan the runtime image built from the reproducible .deb
        type: boolean
        default: true
        required: false

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  NESSO_BUILD_SHA: ${{ github.sha }}
  NESSO_BUILD_REF: ${{ github.ref }}

permissions: {}

jobs:
  resolve-image:
    runs-on: ubuntu-latest
    # prepare-image-amd64 and prepare-image-arm64 use this same 360 minute
    # budget. The pull-request poll below stops at 350 minutes so this job
    # can still print a timeout. A tag that already exists returns immediately.
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    outputs:
      image_amd64: ${{ steps.select.outputs.image_amd64 }}
      image_arm64: ${{ steps.select.outputs.image_arm64 }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve build-env image
        id: select
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          reg="${{ env.REGISTRY }}/${owner_lc}/nesso-build-env"
          for arch in amd64 arm64; do
            deps_hash="$(./scripts/build-env-hash "${arch}")"
            suffix=""
            if [[ "${arch}" == "arm64" ]]; then
              suffix="-arm64"
            fi
            ref="${reg}:deps-${deps_hash}${suffix}"
            echo "image_${arch}=${ref}" >> "${GITHUB_OUTPUT}"
            echo "${arch} ${ref}"
          done

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Require nesso-build-env
        env:
          IMAGE_AMD64: ${{ steps.select.outputs.image_amd64 }}
          IMAGE_ARM64: ${{ steps.select.outputs.image_arm64 }}
          EVENT_NAME: ${{ github.event_name }}
          # Same offline Go invocation as the Pipeline lint job. scripts/ci
          # has no module requirements.
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
        run: |
          set -euo pipefail
          args=(--interval 30s)
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            args+=(--wait 350m)
          fi
          go run -C scripts/ci . wait-build-env "${args[@]}" \
            "${IMAGE_AMD64}" "${IMAGE_ARM64}"

  repro-build:
    name: repro-build (${{ matrix.arch }} ${{ matrix.slot }})
    needs: resolve-image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            slot: a
            runner: ubuntu-latest
            workdir: /tmp/nesso-repro-a
          - arch: amd64
            slot: b
            runner: ubuntu-latest
            workdir: /tmp/nesso-repro-b
          - arch: arm64
            slot: a
            runner: ubuntu-24.04-arm
            workdir: /tmp/nesso-repro-a
          - arch: arm64
            slot: b
            runner: ubuntu-24.04-arm
            workdir: /tmp/nesso-repro-b
    container:
      image: ${{ matrix.arch == 'arm64' && needs.resolve-image.outputs.image_arm64 || needs.resolve-image.outputs.image_amd64 }} # zizmor: ignore[unpinned-images] deps-<hash> tag, not a digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CONAN_HOME: /opt/conan2
      NESSO_REPRODUCIBLE: "1"
      LC_ALL: C
      TZ: UTC
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ matrix.workdir }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      WORKDIR: ${{ matrix.workdir }}
      SLOT: ${{ matrix.slot }}
      ARCH: ${{ matrix.arch }}
    # Container jobs default to sh. The steps use bash [[ ]].
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the native architecture
        run: |
          set -euo pipefail
          # ubuntu-24.04-arm has no QEMU binfmt. A foreign image would not
          # start. This still fails the job if the container arch disagrees
          # with the matrix, including a qemu user-mode mismatch.
          case "${ARCH}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *)
              echo "error: ${ARCH} repro is running on $(uname -m)" >&2
              exit 1
              ;;
          esac
          echo "native ${ARCH} ($(uname -m))"

      - name: Pin SOURCE_DATE_EPOCH
        run: |
          set -euo pipefail
          # actions/checkout records safe.directory under a temporary HOME
          # that later steps do not see. The workspace is owned by the runner,
          # so git in this container otherwise rejects /__w/nesso/nesso.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory /__w/nesso/nesso
          epoch="$(git log -1 --format=%ct)"
          if [[ ! "${epoch}" =~ ^[0-9]+$ ]]; then
            echo "error: commit timestamp is '${epoch}'" >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=${epoch}" >> "${GITHUB_ENV}"
          echo "SOURCE_DATE_EPOCH=${epoch} arch=${ARCH} slot=${SLOT} workdir=${WORKDIR}"

      - name: Copy sources
        run: |
          set -euo pipefail
          rm -rf "${WORKDIR}"
          mkdir -p "${WORKDIR}"
          git archive HEAD | tar -x -C "${WORKDIR}"
          chmod +x "${WORKDIR}/scripts/build-release-binary" \
            "${WORKDIR}/scripts/package-deb" \
            "${WORKDIR}/scripts/fetch-model" \
            "${WORKDIR}/scripts/check-versions"
          # Slot b is a later clock and fresh mtimes. Slot a keeps the
          # commit mtimes git archive records. SOURCE_DATE_EPOCH stays the
          # commit timestamp for both.
          if [[ "${SLOT}" == "b" ]]; then
            sleep 30
            find "${WORKDIR}" -exec touch {} +
          fi

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-repro-${{ matrix.slot }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-repro-${{ matrix.slot }}-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      - name: Restore MiniLM
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Build release binary
        id: build
        run: |
          set -euo pipefail
          "${WORKDIR}/scripts/build-release-binary" "${WORKDIR}/out/nesso"

      - name: Stage model
        run: |
          set -euo pipefail
          if [[ ! -f models/model.onnx || ! -f models/vocab.txt ]]; then
            ./scripts/fetch-model models
          fi
          mkdir -p "${WORKDIR}/models"
          cp -a models/model.onnx models/vocab.txt "${WORKDIR}/models/"
          if [[ "${SLOT}" == "b" ]]; then
            touch "${WORKDIR}/models/model.onnx" "${WORKDIR}/models/vocab.txt"
          fi

      - name: Package .deb
        run: |
          set -euo pipefail
          ver="$("${WORKDIR}/scripts/check-versions")"
          "${WORKDIR}/scripts/package-deb" "${ver}" "${WORKDIR}/out/nesso" "${WORKDIR}/models" "${WORKDIR}/deb"
          mkdir -p "${GITHUB_WORKSPACE}/repro-deb"
          cp -a "${WORKDIR}/deb/"*.deb "${GITHUB_WORKSPACE}/repro-deb/"
          sha256sum "${GITHUB_WORKSPACE}/repro-deb/"*.deb

      - name: ccache statistics
        if: always() && !cancelled()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${BUILD_OUTCOME}" != "success" ]]; then
            exit 0
          fi
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "### ccache (${ARCH} ${SLOT})"
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: >-
          success() && steps.ccache.outputs.cache-hit != 'true' &&
          github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-repro-${{ matrix.slot }}-${{ github.sha }}

      - name: Upload .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-deb-${{ matrix.arch }}-${{ matrix.slot }}
          path: repro-deb/*.deb
          retention-days: 14
          if-no-files-found: error

  compare:
    needs: repro-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install diffoscope
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends diffoscope zstd

      - name: Download builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repro-deb-*
          merge-multiple: false
          path: repro-debs

      - name: Compare bytes
        run: |
          set -euo pipefail
          chmod +x scripts/compare-deb
          compare_arch() {
            local arch="$1"
            local -a debs=()
            mapfile -t debs < <(find repro-debs -type f -name "nesso_*_${arch}.deb" | sort)
            if [[ "${#debs[@]}" -ne 2 ]]; then
              echo "error: expected 2 ${arch} debs, found ${#debs[@]}" >&2
              find repro-debs -type f -print >&2
              return 1
            fi
            scripts/compare-deb "${debs[0]}" "${debs[1]}" "repro-report/${arch}"
            echo "reproducible ${arch} $(sha256sum "${debs[0]}" | awk '{print $1}')"
          }
          status=0
          compare_arch amd64 || status=1
          compare_arch arm64 || status=1
          exit "${status}"

      - name: Upload diffoscope report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-diffoscope
          path: repro-report/
          retention-days: 14
          if-no-files-found: error

  distro:
    name: distro (${{ matrix.arch }}, ${{ matrix.image }})
    needs: compare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # README says Ubuntu 26.04+. These are the official images at or
        # above that floor. The .deb's libc comes from the Ubuntu 26.04
        # build-env image, so older Ubuntu and Debian are outside the claim.
        # The arm64 rows run on ubuntu-24.04-arm so apt installs the arm64
        # package without QEMU. The official tags are multi-arch; Docker
        # pulls the runner's platform.
        include:
          - arch: amd64
            image: ubuntu:26.04
            runner: ubuntu-latest
          - arch: amd64
            image: ubuntu:26.10
            runner: ubuntu-latest
          - arch: arm64
            image: ubuntu:26.04
            runner: ubuntu-24.04-arm
          - arch: arm64
            image: ubuntu:26.10
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "${ARCH}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *)
              echo "error: ${ARCH} distro smoke is running on $(uname -m)" >&2
              exit 1
              ;;
          esac

      - name: Download .deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-deb-${{ matrix.arch }}-a
          path: repro-deb

      - name: Install, smoke, remove, and purge
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          chmod +x scripts/smoke-deb
          mapfile -t debs < <(find repro-deb -type f -name "nesso_*_${ARCH}.deb" | sort)
          if [[ "${#debs[@]}" -ne 1 ]]; then
            echo "error: expected 1 ${ARCH} deb, found ${#debs[@]}" >&2
            find repro-deb -type f -print >&2
            exit 1
          fi
          scripts/smoke-deb "${debs[0]}" "${IMAGE}"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            echo "Installed, removed, and purged \`${debs[0]}\` on \`${IMAGE}\` (${ARCH})." >> "${GITHUB_STEP_SUMMARY}"
          fi

  # Final stage of packaging/Dockerfile.runtime plus the binary and models from the
  # .deb repro-build just produced. The compiler stage is not published.
  # Rebuilding it here would compile nesso again. ci runtime-scan-dockerfile
  # fails if that final stage gains an instruction this plan does not copy.
  # scan_runtime defaults to true. Release passes false: its image job scans
  # the image it built, and this job would build that final stage again.
  # A direct schedule, workflow_dispatch, or pull_request leaves the input
  # unset. null != false is false, because loose equality turns both into 0,
  # so that comparison would skip those runs. format() compares strings:
  # an unset input is '' and true is 'true', and neither is 'false'.
  # github.event_name inside a called workflow is the caller's event, never
  # workflow_call. security-events: write is on this job. Fork pull requests
  # cannot upload SARIF; the summary still runs. A caller must grant
  # security-events: write even when this job is skipped. GitHub checks
  # that at startup.
  scan-runtime:
    name: scan-runtime (${{ matrix.arch }})
    needs: repro-build
    if: success() && format('{0}', inputs.scan_runtime) != 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy cache day
        id: trivy-day
        run: echo "day=$(date -u +%Y%m%d)" >> "${GITHUB_OUTPUT}"

      - name: Cache Trivy DB and binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/trivy-db
            ${{ runner.temp }}/nesso-cache/nesso/trivy
          key: trivy-0.76.1-${{ runner.arch }}-${{ hashFiles('scripts/trivy') }}-${{ steps.trivy-day.outputs.day }}
          restore-keys: |
            trivy-0.76.1-${{ runner.arch }}-${{ hashFiles('scripts/trivy') }}-

      - name: Download .deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-deb-${{ matrix.arch }}-a
          path: repro-deb

      - name: Scan runtime image
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          XDG_CACHE_HOME: ${{ runner.temp }}/nesso-cache
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-db
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOFLAGS: "-mod=readonly -buildvcs=false"
        run: |
          set -euo pipefail
          if ! command -v go >/dev/null 2>&1 || ! go version | grep -Eq 'go1\.(2[2-9]|[3-9][0-9])'; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends golang-go
          fi
          go build -C scripts/ci -o /tmp/nesso-ci .
          chmod +x scripts/scan-runtime-image scripts/trivy
          mapfile -t debs < <(find repro-deb -type f -name "nesso_*_${ARCH}.deb" | sort)
          if [[ "${#debs[@]}" -ne 1 ]]; then
            echo "error: expected 1 ${ARCH} deb, found ${#debs[@]}" >&2
            find repro-deb -type f -print >&2
            exit 1
          fi
          ./scripts/scan-runtime-image \
            --deb "${debs[0]}" \
            --platform "${PLATFORM}" \
            --runtime packaging/Dockerfile.runtime \
            --sarif trivy.sarif \
            --json trivy.json \
            --ci /tmp/nesso-ci
          /tmp/nesso-ci trivy-summary --json trivy.json --arch "${ARCH}"

      - name: Upload Trivy SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-runtime-${{ matrix.arch }}
