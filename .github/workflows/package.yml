name: Package

# Byte-compare two clean release .debs, then apt-install that package on the
# Ubuntu releases README claims. Nightly is 03:47 UTC, after Pipeline's 03:17
# run. Pull requests run only when packaging inputs change, so the rest of
# Pipeline stays the fast path. release.yml calls this workflow and deploy
# waits for it: a tag does not push the image or publish the release when a
# job here fails. The same wait applies to a release workflow_dispatch.

on:
  schedule:
    - cron: "47 3 * * *"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/package.yml"
      - ".github/workflows/release.yml"
      - "Dockerfile.runtime"
      - "CMakeLists.txt"
      - "scripts/build-release-binary"
      - "scripts/package-deb"
      - "scripts/compare-deb"
      - "scripts/smoke-deb"
      - "scripts/fetch-model"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io

permissions: {}

jobs:
  resolve-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.select.outputs.image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve build-env image
        id: select
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          reg="${{ env.REGISTRY }}/${owner_lc}/nesso-build-env"
          deps_hash="$(./scripts/build-env-hash amd64)"
          echo "image=${reg}:deps-${deps_hash}" >> "${GITHUB_OUTPUT}"

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Require nesso-build-env
        run: |
          set -euo pipefail
          img='${{ steps.select.outputs.image }}'
          if ! docker buildx imagetools inspect "${img}" >/dev/null; then
            echo "error: missing ${img}; run CI on main so nesso-build-env is published first" >&2
            exit 1
          fi

  repro-build:
    name: repro-build (${{ matrix.slot }})
    needs: resolve-image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: a
            workdir: /tmp/nesso-repro-a
          - slot: b
            workdir: /tmp/nesso-repro-b
    container:
      image: ${{ needs.resolve-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CONAN_HOME: /opt/conan2
      NESSO_REPRODUCIBLE: "1"
      LC_ALL: C
      TZ: UTC
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ matrix.workdir }}
      CCACHE_MAXSIZE: 150M
      CCACHE_COMPRESS: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      WORKDIR: ${{ matrix.workdir }}
      SLOT: ${{ matrix.slot }}
    # Container jobs default to sh. The steps use bash [[ ]].
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pin SOURCE_DATE_EPOCH
        run: |
          set -euo pipefail
          # actions/checkout records safe.directory under a temporary HOME
          # that later steps do not see. The workspace is owned by the runner,
          # so git in this container otherwise rejects /__w/nesso/nesso.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory /__w/nesso/nesso
          epoch="$(git log -1 --format=%ct)"
          if [[ ! "${epoch}" =~ ^[0-9]+$ ]]; then
            echo "error: commit timestamp is '${epoch}'" >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=${epoch}" >> "${GITHUB_ENV}"
          echo "SOURCE_DATE_EPOCH=${epoch} slot=${SLOT} workdir=${WORKDIR}"

      - name: Copy sources
        run: |
          set -euo pipefail
          rm -rf "${WORKDIR}"
          mkdir -p "${WORKDIR}"
          git archive HEAD | tar -x -C "${WORKDIR}"
          chmod +x "${WORKDIR}/scripts/build-release-binary" \
            "${WORKDIR}/scripts/package-deb" \
            "${WORKDIR}/scripts/fetch-model" \
            "${WORKDIR}/scripts/check-versions"
          # Slot b is a later clock and fresh mtimes. Slot a keeps the
          # commit mtimes git archive records. SOURCE_DATE_EPOCH stays the
          # commit timestamp for both.
          if [[ "${SLOT}" == "b" ]]; then
            sleep 30
            find "${WORKDIR}" -exec touch {} +
          fi

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-repro-${{ matrix.slot }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-repro-${{ matrix.slot }}-

      - name: Zero ccache statistics
        run: ccache --zero-stats

      - name: Restore MiniLM
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: minilm-${{ hashFiles('scripts/fetch-model') }}

      - name: Build release binary
        id: build
        run: |
          set -euo pipefail
          "${WORKDIR}/scripts/build-release-binary" "${WORKDIR}/out/nesso"

      - name: Stage model
        run: |
          set -euo pipefail
          if [[ ! -f models/model.onnx || ! -f models/vocab.txt ]]; then
            ./scripts/fetch-model models
          fi
          mkdir -p "${WORKDIR}/models"
          cp -a models/model.onnx models/vocab.txt "${WORKDIR}/models/"
          if [[ "${SLOT}" == "b" ]]; then
            touch "${WORKDIR}/models/model.onnx" "${WORKDIR}/models/vocab.txt"
          fi

      - name: Package .deb
        run: |
          set -euo pipefail
          ver="$("${WORKDIR}/scripts/check-versions")"
          "${WORKDIR}/scripts/package-deb" "${ver}" "${WORKDIR}/out/nesso" "${WORKDIR}/models" "${WORKDIR}/deb"
          mkdir -p "${GITHUB_WORKSPACE}/repro-deb"
          cp -a "${WORKDIR}/deb/"*.deb "${GITHUB_WORKSPACE}/repro-deb/"
          sha256sum "${GITHUB_WORKSPACE}/repro-deb/"*.deb

      - name: ccache statistics
        if: always() && !cancelled()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          ccache --version
          ccache -s | tee /tmp/ccache-stats.txt
          ccache -sv
          cacheable=$(awk '/^Cacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          uncacheable=$(awk '/^Uncacheable calls:/ {print $3; found=1} END {if (!found) print 0}' /tmp/ccache-stats.txt)
          echo "ccache cacheable calls: ${cacheable}"
          echo "ccache uncacheable calls: ${uncacheable}"
          if [[ "${BUILD_OUTCOME}" != "success" ]]; then
            exit 0
          fi
          if [[ "${cacheable}" -eq 0 || "${uncacheable}" -gt 0 ]]; then
            echo "error: ccache recorded ${cacheable} cacheable and ${uncacheable} uncacheable compilations" >&2
            exit 1
          fi
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "### ccache (${SLOT})"
              echo '```'
              cat /tmp/ccache-stats.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Save ccache
        if: >-
          success() && steps.ccache.outputs.cache-hit != 'true' &&
          github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.arch }}-repro-${{ matrix.slot }}-${{ github.sha }}

      - name: Upload .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-deb-${{ matrix.slot }}
          path: repro-deb/*.deb
          retention-days: 14
          if-no-files-found: error

  compare:
    needs: repro-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install diffoscope
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends diffoscope zstd

      - name: Download builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repro-deb-*
          merge-multiple: false
          path: repro-debs

      - name: Compare bytes
        run: |
          set -euo pipefail
          chmod +x scripts/compare-deb
          mapfile -t debs < <(find repro-debs -type f -name '*.deb' | sort)
          if [[ "${#debs[@]}" -ne 2 ]]; then
            echo "error: expected 2 debs, found ${#debs[@]}" >&2
            printf '%s\n' "${debs[@]}" >&2
            exit 1
          fi
          scripts/compare-deb "${debs[0]}" "${debs[1]}" repro-report

      - name: Upload diffoscope report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-diffoscope
          path: repro-report/
          retention-days: 14
          if-no-files-found: error

  distro:
    name: distro (${{ matrix.image }})
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # README says Ubuntu 26.04+. These are the official images at or
        # above that floor. The .deb's libc comes from the Ubuntu 26.04
        # build-env image, so older Ubuntu and Debian are outside the claim.
        image:
          - ubuntu:26.04
          - ubuntu:26.10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download .deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-deb-a
          path: repro-deb

      - name: Install, smoke, remove, and purge
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          chmod +x scripts/smoke-deb
          mapfile -t debs < <(find repro-deb -type f -name '*.deb' | sort)
          if [[ "${#debs[@]}" -ne 1 ]]; then
            echo "error: expected 1 deb, found ${#debs[@]}" >&2
            exit 1
          fi
          scripts/smoke-deb "${debs[0]}" "${IMAGE}"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            echo "Installed, removed, and purged on \`${IMAGE}\`." >> "${GITHUB_STEP_SUMMARY}"
          fi
