name: Build and Push Docker Image

# Manual rebuild of the thin mach-build-env toolchain image.
# Automatic rebuilds when .devcontainer/Dockerfile changes run in Pipeline
# (ci.yml) before dependent jobs. Conan packages are cached in GHA, not the image.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          reg="${{ env.REGISTRY }}/${owner_lc}/mach-build-env"
          sha='${{ github.sha }}'
          {
            echo "tags<<EOF"
            echo "${reg}:latest"
            echo "${reg}:sha-${sha}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
